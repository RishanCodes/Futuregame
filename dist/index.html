<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SHATTERPOINT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* SHATTERPOINT — interface styles
   Layout: full-bleed WebGL canvas, HUD and menus layered on top with cut-corner "hardlight" panels. */
:root {
  --bg: #06070b;
  --panel: rgba(11, 13, 20, 0.88);
  --panel-2: rgba(20, 24, 36, 0.92);
  --line: rgba(150, 178, 230, 0.16);
  --line-2: rgba(150, 178, 230, 0.32);
  --fg: #e6ebf4;
  --dim: #8b94a8;
  --blue: #2fb4ff;
  --violet: #9a5cff;
  --silver: #c9d2e3;
  --ok: #3ddc84;
  --bad: #ff4d6d;
  --gold: #ffbf3d;
  --r0: #9aa3b2; --r1: #3ddc84; --r2: #3d8bff; --r3: #b46cff; --r4: #ffbf3d;
  --display: 'Chakra Petch', 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  --body: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --cut: 12px;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gutR: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#app { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
input, textarea { font: inherit; user-select: text; -webkit-user-select: text; }
h1, h2, h3, h4 { font-family: var(--display); letter-spacing: 0.04em; margin: 0; text-wrap: balance; }
h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--dim); margin: 16px 0 8px; font-weight: 600; }
p { margin: 6px 0; }
.muted { color: var(--dim); }
.small { font-size: 13px; }
.center { text-align: center; }
.ok { color: var(--ok); }
.bad { color: var(--bad); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* ---------- buttons ---------- */
.btn {
  font-family: var(--display); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-size: 13px;
  background: var(--panel-2); border: 1px solid var(--line-2); color: var(--fg);
  padding: 10px 16px; cursor: pointer; min-height: 40px;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  transition: background 0.12s, border-color 0.12s, transform 0.08s;
}
.btn:hover { background: #222a3e; border-color: var(--blue); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, #1d6fd6, #1553a8); border-color: #5fc8ff; }
.btn.primary:hover { background: linear-gradient(180deg, #2a86f0, #1a62c4); }
.btn.danger { border-color: rgba(255, 77, 109, 0.6); color: #ffd3dc; }
.btn.danger:hover { background: #3a1520; }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 10px; min-height: 32px; font-size: 12px; }
.btn.big { padding: 14px 28px; font-size: 16px; min-height: 52px; }
.btn.icon { width: 40px; padding: 0; font-size: 18px; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn.key { min-width: 110px; }
.btn.key.wait { border-color: var(--gold); color: var(--gold); }

.seg { display: inline-flex; flex-wrap: nowrap; gap: 4px; }
.seg.wrap { flex-wrap: wrap; }
.seg button { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); padding: 7px 12px; cursor: pointer; font-size: 13px; font-family: var(--display); letter-spacing: 0.05em; min-height: 36px; }
.seg button:hover { border-color: var(--line-2); }
.seg button.on { background: rgba(47, 180, 255, 0.16); border-color: var(--blue); color: #fff; }
.seg button.buy { color: var(--dim); }
.seg button small { color: var(--gold); }

.panel {
  background: var(--panel); border: 1px solid var(--line);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  padding: 18px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.pbar { height: 6px; background: rgba(255, 255, 255, 0.07); position: relative; overflow: hidden; }
.pbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--blue), var(--violet)); }
.pbar.xp i { background: linear-gradient(90deg, var(--violet), var(--blue)); }
.cur { display: flex; gap: 12px; font-family: var(--display); font-variant-numeric: tabular-nums; font-size: 14px; }
.cur .cr { color: var(--gold); }
.cur .sh { color: #7fd0ff; }
.rar { font-family: var(--display); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; padding: 2px 6px; border: 1px solid currentColor; }
.rar.r0, .r0 > .rar { color: var(--r0); } .rar.r1 { color: var(--r1); } .rar.r2 { color: var(--r2); } .rar.r3 { color: var(--r3); } .rar.r4 { color: var(--r4); }
.badge { font-family: var(--display); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; border: 1px solid; }
.badge.ok { color: var(--ok); }
.warnbox { border: 1px solid rgba(255, 191, 61, 0.5); background: rgba(255, 191, 61, 0.08); padding: 10px 12px; max-width: 520px; color: #ffe7b0; font-size: 14px; }
.tip { border-left: 2px solid var(--blue); padding-left: 10px; color: #bfe6ff; font-size: 14px; }

/* ---------- menu layer ---------- */
.ui { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: none; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.ui > * { pointer-events: auto; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 12px var(--gutR) 12px var(--gut); background: linear-gradient(180deg, rgba(6, 7, 11, 0.95), rgba(6, 7, 11, 0.6)); border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.topbar h1 { font-size: 20px; flex: 1; text-transform: uppercase; }
.content { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 18px var(--gutR) 28px var(--gut); -webkit-overflow-scrolling: touch; touch-action: pan-y; background: linear-gradient(180deg, rgba(6, 7, 11, 0.82), rgba(6, 7, 11, 0.92)); }
.content.narrow > * { max-width: 760px; margin-left: auto; margin-right: auto; }
.content > * + * { margin-top: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.row-end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
ul.plain { list-style: none; padding: 0; margin: 6px 0; }
ul.plain li { padding: 3px 0; }

/* title */
.scr-title { justify-content: center; }
.title-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; padding: 0 var(--gutR) 0 max(6vw, var(--gut)); pointer-events: auto; max-width: 640px; }
.logo { font-family: var(--display); font-weight: 700; line-height: 0.88; letter-spacing: 0.02em; font-size: clamp(54px, 11vw, 120px); display: flex; flex-direction: column; }
.logo .l1 { color: #f2f5fa; text-shadow: 0 0 24px rgba(47, 180, 255, 0.35); }
.logo .l2 { color: transparent; -webkit-text-stroke: 2px var(--blue); position: relative; left: 0.6em; }
.logo .l2::after { content: ''; position: absolute; left: -0.62em; top: 52%; width: 0.5em; height: 3px; background: var(--violet); }
.tag { font-family: var(--display); letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim); font-size: 13px; }

/* main menu */
.scr-main .main-wrap, .scr-title .title-wrap { pointer-events: auto; }
.main-wrap { flex: 1; display: flex; align-items: center; padding: 16px var(--gutR) 16px var(--gut); pointer-events: none !important; }
.mainmenu { width: min(400px, 100%); pointer-events: auto; max-height: 100%; overflow-y: auto; }
.who-name { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: 0.06em; }
.who-lvl { display: flex; justify-content: space-between; color: var(--dim); font-size: 13px; margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
.who .cur { margin-top: 8px; }
.menu { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; }
.mbtn { display: flex; flex-direction: column; align-items: flex-start; text-align: left; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); border-left: 3px solid transparent; padding: 10px 14px; cursor: pointer; transition: background 0.12s, border-color 0.12s, padding 0.12s; }
.mbtn b { font-family: var(--display); font-size: 17px; letter-spacing: 0.08em; text-transform: uppercase; }
.mbtn small { color: var(--dim); font-size: 12.5px; }
.mbtn:hover, .mbtn:focus-visible { background: rgba(47, 180, 255, 0.08); border-left-color: var(--blue); padding-left: 18px; }
.mbtn.primary { background: linear-gradient(90deg, rgba(47, 180, 255, 0.2), rgba(154, 92, 255, 0.08)); border-left-color: var(--blue); }
.hint-drag { position: absolute; right: var(--gutR); bottom: 18px; color: var(--dim); font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; pointer-events: none; }

/* cards */
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.card { text-align: left; background: var(--panel); border: 1px solid var(--line); padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-width: 0; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
button.card:hover { border-color: var(--blue); background: rgba(20, 30, 48, 0.92); }
.card h3 { font-size: 17px; text-transform: uppercase; }
.card p { color: #c3cad8; font-size: 14px; flex: 1; }
.card .meta { color: var(--dim); font-size: 12.5px; font-family: var(--display); letter-spacing: 0.05em; }
.card.locked { opacity: 0.5; }
.card.sel { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
.card.done { border-color: rgba(61, 220, 132, 0.4); }
.cards.opps { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.card.opp b { font-family: var(--display); letter-spacing: 0.05em; }
.card.opp small { color: var(--dim); }
.card .reward { color: var(--gold); font-family: var(--display); font-size: 13px; }

/* campaign */
.split { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.split > * + * { margin-top: 0; }
.split2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.sector { margin-bottom: 14px; }
.sector h3 { font-size: 18px; text-transform: uppercase; }
.sector h3 span { color: var(--blue); margin-right: 6px; font-size: 13px; letter-spacing: 0.2em; }
.sector.locked { opacity: 0.55; }
.stages { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.stage { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; background: var(--panel); border: 1px solid var(--line); padding: 10px; cursor: pointer; text-align: left; min-height: 74px; min-width: 0; }
.stage .sid { font-family: var(--display); color: var(--dim); font-size: 12px; letter-spacing: 0.1em; }
.stage .sname { font-family: var(--display); font-size: 14px; letter-spacing: 0.03em; overflow-wrap: anywhere; }
.stage .sstat { color: var(--ok); font-size: 13px; margin-top: auto; }
.stage.boss { border-color: rgba(255, 138, 61, 0.45); }
.stage.boss .sname { color: #ffc89e; }
.stage.locked { opacity: 0.45; }
.stage.sel { border-color: var(--blue); background: rgba(47, 180, 255, 0.12); }
.detail h2 { font-size: 26px; text-transform: uppercase; }
.eyebrow { font-family: var(--display); color: var(--blue); letter-spacing: 0.2em; font-size: 12px; text-transform: uppercase; }
.bossdesc { color: #ffd9bf; }

.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.stats3 > div, .statgrid > div, .loadsum > div { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; min-width: 0; }
.stats3 b, .statgrid b, .loadsum b { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.stats3 span, .statgrid span, .loadsum span { color: var(--dim); font-size: 12px; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: 14px; }
.statgrid.small b { font-size: 17px; }

/* character */
.scr-character .content, .scr-equipment .content, .scr-weapons .content { background: transparent; }
.char { display: flex; justify-content: flex-start; align-items: flex-start; pointer-events: none !important; }
.charpanel { pointer-events: auto; width: min(440px, 100%); max-height: 100%; display: flex; flex-direction: column; }
.char .charpanel { max-height: calc(100vh - 110px); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: -4px 0 6px; overflow-x: auto; flex: 0 0 auto; }
.tabs button { background: none; border: none; border-bottom: 2px solid transparent; padding: 9px 12px; cursor: pointer; font-family: var(--display); letter-spacing: 0.08em; text-transform: uppercase; font-size: 13px; color: var(--dim); white-space: nowrap; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--blue); }
.tabbody { overflow-y: auto; flex: 1 1 auto; padding-right: 4px; touch-action: pan-y; }
.foot { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 10px; }
.fld { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
.fld > span { font-size: 13px; color: var(--dim); display: flex; justify-content: space-between; }
.fld > span b { color: var(--fg); font-family: var(--display); font-variant-numeric: tabular-nums; }
.fld input:not([type]), .fld textarea { background: #0b0e16; border: 1px solid var(--line-2); color: var(--fg); padding: 10px; font-family: var(--display); letter-spacing: 0.1em; font-size: 16px; }
.fld textarea { font-family: ui-monospace, monospace; font-size: 12px; letter-spacing: 0; word-break: break-all; resize: vertical; }
input[type=range] { width: 100%; accent-color: var(--blue); height: 28px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 34px; height: 34px; border: 2px solid rgba(255, 255, 255, 0.12); background: var(--c); cursor: pointer; padding: 0; position: relative; }
.sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--blue); }
.sw.custom { background: conic-gradient(#ff4d6d, #ffbf3d, #3ddc84, #2fb4ff, #9a5cff, #ff4d6d); overflow: hidden; display: inline-block; }
.sw.custom input { opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.viewctl { position: absolute; left: var(--gut); bottom: 20px; display: flex; gap: 6px; align-items: center; pointer-events: auto; }
.tog { display: flex; gap: 10px; align-items: center; margin: 10px 0; cursor: pointer; }
.tog input { width: 20px; height: 20px; accent-color: var(--blue); }

/* equipment */
.equip { display: grid; grid-template-columns: minmax(0, 0.7fr) minmax(220px, 280px) minmax(0, 1.25fr); gap: 12px; align-items: start; pointer-events: none !important; }
.equip > * + * { margin-top: 0; }
.equip .slots { grid-column: 2; pointer-events: auto; display: flex; flex-direction: column; gap: 4px; }
.equip .invpanel { grid-column: 3; pointer-events: auto; max-height: calc(100vh - 110px); overflow-y: auto; touch-action: pan-y; }
.slot { display: flex; flex-direction: column; align-items: flex-start; text-align: left; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); border-left: 3px solid var(--line-2); padding: 8px 10px; cursor: pointer; min-width: 0; }
.slot .sl { font-family: var(--display); font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--dim); }
.slot .sv { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.slot.sel { background: rgba(47, 180, 255, 0.1); border-color: var(--blue); }
.slot.r0 { border-left-color: var(--r0); } .slot.r1 { border-left-color: var(--r1); } .slot.r2 { border-left-color: var(--r2); } .slot.r3 { border-left-color: var(--r3); } .slot.r4 { border-left-color: var(--r4); }
.loadsum { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 8px; }
.loadsum b { font-size: 16px; }
.inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; }
.itm { display: grid; grid-template-columns: 34px 1fr; grid-template-rows: auto auto; column-gap: 8px; text-align: left; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); border-left: 3px solid var(--rc, var(--r0)); padding: 8px; cursor: pointer; position: relative; min-width: 0; }
.itm .ico { grid-row: span 2; display: grid; place-items: center; font-size: 20px; color: var(--rc); background: rgba(255, 255, 255, 0.04); }
.itm .nm { font-family: var(--display); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--rc); }
.itm .nm small { color: var(--fg); }
.itm .sub { font-size: 12px; color: var(--dim); }
.itm.sel { background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 0 0 1px var(--rc); }
.itm.eq .nm { padding-right: 64px; }
.itm .eqtag { position: absolute; right: 6px; top: 6px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--blue); font-family: var(--display); }
.r0 { --rc: var(--r0); } .r1 { --rc: var(--r1); } .r2 { --rc: var(--r2); } .r3 { --rc: var(--r3); } .r4 { --rc: var(--r4); }
.detail-item { margin-top: 14px; border-top: 2px solid var(--rc); padding-top: 12px; }
.detail-item h3 { color: var(--rc); font-size: 19px; }
.stt { width: 100%; border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; }
.stt td { padding: 5px 0; border-bottom: 1px solid var(--line); }
.stt td:last-child { text-align: right; font-family: var(--display); }
.stt tr.lost td { color: var(--dim); }
.up { color: var(--ok); font-size: 11px; } .dn { color: var(--bad); font-size: 11px; } .dz { color: var(--dim); font-size: 11px; }
.mods { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.mod { font-size: 13.5px; padding: 6px 8px; background: rgba(154, 92, 255, 0.08); border-left: 2px solid var(--violet); }
.mod.leg { background: rgba(255, 191, 61, 0.08); border-left-color: var(--gold); }
.cache { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--line-2); }
.cache > div { display: flex; flex-direction: column; }
.abslots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; }
.abslot { border: 1px solid var(--line-2); padding: 10px; display: flex; gap: 8px; align-items: center; }
.abslot .k, .cd .k { font-family: var(--display); font-size: 11px; padding: 1px 5px; border: 1px solid var(--line-2); color: var(--dim); }
.ablist { display: flex; flex-direction: column; gap: 8px; }
.ab { border: 1px solid var(--line); padding: 10px 12px; background: rgba(255, 255, 255, 0.02); }
.ab h4 { margin: 0; color: var(--fg); font-size: 14px; letter-spacing: 0.06em; text-transform: none; }
.ab h4 small { color: var(--blue); margin-left: 6px; }
.ab.locked { opacity: 0.5; }
.ab .actions { margin-top: 8px; }
.aicon { display: inline-grid; place-items: center; width: 24px; height: 24px; border: 1px solid var(--blue); color: var(--blue); margin-right: 4px; }

/* weapons */
.weap { pointer-events: none !important; grid-template-columns: minmax(0, 0.55fr) minmax(200px, 260px) minmax(0, 1.2fr); }
.weap .fams { grid-column: 2; pointer-events: auto; display: flex; flex-direction: column; gap: 6px; }
.weap .famdetail { grid-column: 3; pointer-events: auto; max-height: calc(100vh - 110px); overflow-y: auto; touch-action: pan-y; }
.fam { display: flex; gap: 10px; align-items: center; text-align: left; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--wc); padding: 10px; cursor: pointer; }
.fam .g { width: 30px; height: 30px; display: grid; place-items: center; color: var(--wc); font-size: 18px; background: rgba(255, 255, 255, 0.04); }
.fam b { font-family: var(--display); display: block; letter-spacing: 0.05em; }
.fam small { color: var(--dim); }
.fam:not(.own) { opacity: 0.7; }
.fam.sel { background: rgba(47, 180, 255, 0.1); border-color: var(--wc); opacity: 1; }
.famdetail h2 { font-size: 26px; text-transform: uppercase; }
.sw2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tblwrap { overflow-x: auto; }
table.moves { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.moves th { text-align: left; color: var(--dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; padding: 4px 6px 4px 0; }

.fbar i { display: block; height: 100%; background: #ff4d6d; }
.fbar.locked div { border-color: #fff; box-shadow: 0 0 6px #ff4d6d; }
.float { position: absolute; left: 0; top: 0; will-change: transform, opacity; white-space: nowrap; text-shadow: 0 2px 4px #000; }

.pop.counter { color: #ffe08a; }
.pop.break { color: #ffbf3d; }
.pop.block { color: #c9d2e3; font-size: 12px; }
.pop.tip { color: #7fd0ff; font-size: 12px; }
.pop.weak { color: #8b94a8; font-size: 12px; }
.lowhp { position: absolute; inset: 0; box-shadow: inset 0 0 120px rgba(255, 30, 60, 0.0); transition: box-shadow 0.4s; }
.lowhp.on { box-shadow: inset 0 0 140px rgba(255, 30, 60, 0.45); animation: lowhp 1s infinite alternate; }

.h-pause { position: absolute; pointer-events: auto; right: calc(var(--gutR) + 0px); top: calc(max(14px, env(safe-area-inset-top)) + 0px); width: 40px; height: 40px; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--line-2); font-family: var(--display); cursor: pointer; display: none; }

/* =================================================================
   touch controls
   ================================================================= */
#touch { position: absolute; inset: 0; z-index: 8; touch-action: none; --tscale: 1; }
#touch .tbtn {
  --x: 0; --y: 0; --s: 60;
  position: absolute; right: calc(var(--x) * var(--tscale) * 1px + env(safe-area-inset-right, 0px)); bottom: calc(var(--y) * var(--tscale) * 1px + env(safe-area-inset-bottom, 0px));
  width: calc(var(--s) * var(--tscale) * 1px); height: calc(var(--s) * var(--tscale) * 1px);
  border-radius: 50%; border: 1.5px solid rgba(200, 225, 255, 0.45); background: rgba(10, 14, 24, 0.42);
  color: #e6ebf4; font-family: var(--display); font-size: calc(11px * var(--tscale)); letter-spacing: 0.06em; font-weight: 700;
  display: grid; place-items: center; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden;
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
}
#touch .tbtn span { position: relative; z-index: 1; pointer-events: none; }
#touch .tbtn.down { background: rgba(47, 180, 255, 0.45); border-color: #9fdcff; transform: scale(0.94); }
#touch .tbtn.cdb::after { content: ''; position: absolute; inset: 0; background: conic-gradient(rgba(0, 0, 0, 0.6) calc(var(--cd, 0) * 360deg), transparent 0); pointer-events: none; }
#touch .t-light { --x: 92; --y: 58; --s: 88; border-color: rgba(47, 180, 255, 0.8); font-size: calc(13px * var(--tscale)); }
#touch .t-heavy { --x: 196; --y: 36; --s: 66; }

#touch .t-jump { --x: 18; --y: 52; --s: 60; }
#touch .t-block { --x: 190; --y: 126; --s: 62; }
#touch .t-skill { --x: 112; --y: 168; --s: 56; font-size: calc(9.5px * var(--tscale)); }
#touch .t-ab0 { --x: 272; --y: 112; --s: 52; font-size: calc(18px * var(--tscale)); }
#touch .t-ab1 { --x: 276; --y: 44; --s: 52; font-size: calc(18px * var(--tscale)); }

#stick { position: absolute; width: calc(120px * var(--tscale)); height: calc(120px * var(--tscale)); transform: translate(-50%, -50%); border-radius: 50%; border: 1.5px solid rgba(200, 225, 255, 0.35); background: rgba(10, 14, 24, 0.25); pointer-events: none; }
#stickKnob { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; border-radius: 50%; background: rgba(47, 180, 255, 0.5); border: 1.5px solid #9fdcff; transform: translate(-50%, -50%); }

/* ---------- responsive ---------- */
@media (max-width: 820px) {

}

}
@media (orientation: portrait) and (pointer: coarse) {
  body.in-game .rotate { display: block; position: absolute; left: 50%; bottom: 40%; transform: translateX(-50%); background: rgba(10, 14, 24, 0.85); border: 1px solid var(--line-2); padding: 8px 12px; font-family: var(--display); font-size: 12px; letter-spacing: 0.1em; z-index: 9; pointer-events: none; animation: fadeout 4s forwards; }
}

  .banner.show, .sp, .toastmsg { animation-duration: 0.01s; }

}

<script>
/* ---- src/js/core.js ---- */
/* SHATTERPOINT — core utilities, storage and save system */
'use strict';
const SP = (window.SP = window.SP || {});

SP.VERSION = '1.0.0';

/* ---------- math / misc helpers ---------- */
SP.U = {
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randi: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  chance: (p) => Math.random() < p,
  smooth: (t) => t * t * (3 - 2 * t),
  easeOut: (t) => 1 - (1 - t) * (1 - t),
  easeIn: (t) => t * t,
  /* frame-rate independent exponential damping */
  damp: (a, b, lambda, dt) => b + (a - b) * Math.exp(-lambda * dt),
  angNorm(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  },
  angDiff(a, b) { return SP.U.angNorm(b - a); },
  dampAngle(a, b, lambda, dt) {
    const d = SP.U.angDiff(a, b);
    return a + d * (1 - Math.exp(-lambda * dt));
  },
  uid: () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4),
  fmt: (n) => Math.round(n).toLocaleString('en-US'),
  fmtTime(s) {
    s = Math.max(0, s);
    const m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ':' + (r < 10 ? '0' : '') + r;
  },
  weighted(entries) { // [[value, weight], ...]
    let tot = 0;
    for (const e of entries) tot += e[1];
    let r = Math.random() * tot;
    for (const e of entries) { r -= e[1]; if (r <= 0) return e[0]; }
    return entries[entries.length - 1][0];
  },
  esc: (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
  deepClone: (o) => JSON.parse(JSON.stringify(o)),
};

SP.Store = {
  ok: false,
  init() {
    try {
      const k = '__sp_probe';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      this.ok = true;
    } catch (e) { this.ok = false; }
    return this.ok;
  },
  get(k) {
    if (!this.ok) return null;
    try { return localStorage.getItem(k); } catch (e) { return null; }
  },
  set(k, v) {
    if (!this.ok) return false;
    try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
  },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
};

SP.Save = {
  data: null,
  status: 'new', // new | loaded | recovered | unavailable
  lastSaved: 0,

  /* merge saved object onto defaults so new fields always exist */
  validate(obj) {
    const def = SP.defaultSave();
    if (!obj || typeof obj !== 'object') return def;
    const out = def;
    const mergeInto = (dst, src) => {
      for (const k in src) {
        if (!(k in dst)) { dst[k] = src[k]; continue; }
        const dv = dst[k], sv = src[k];
        if (dv && typeof dv === 'object' && !Array.isArray(dv) && sv && typeof sv === 'object' && !Array.isArray(sv)) mergeInto(dv, sv);
        else if (Array.isArray(dv) && Array.isArray(sv)) dst[k] = sv;
        else if (typeof dv === typeof sv || dv === null) dst[k] = sv;
      }
    };
    mergeInto(out, obj);
    // sanity
    out.level = SP.U.clamp(Math.floor(+out.level || 1), 1, 60);
    out.xp = Math.max(0, +out.xp || 0);
    out.credits = Math.max(0, Math.floor(+out.credits || 0));
    out.shards = Math.max(0, Math.floor(+out.shards || 0));
    out.inventory = (out.inventory || []).filter((it) => it && it.id && (it.kind === 'weapon' || it.kind === 'armor'));
    if (!Array.isArray(out.abilities.slots)) out.abilities.slots = ['phase', null];
    return out;
  },

  load() {
    SP.Store.init();
    let raw = SP.Store.get(SP.SAVE_KEY);
    if (!SP.Store.ok) this.status = 'unavailable';
    if (raw) {
      try {
        this.data = this.validate(JSON.parse(raw));
        this.status = 'loaded';
      } catch (e) {
        // corrupted — keep a backup copy and start fresh
        SP.Store.set(SP.SAVE_KEY + '.corrupt', raw);
        this.data = SP.defaultSave();
        this.status = 'recovered';
      }
    } else {
      this.data = SP.defaultSave();
      if (this.status !== 'unavailable') this.status = 'new';
    }
    SP.Items.ensureStarter(this.data);
    return this.data;
  },

  save() {
    if (!this.data) return false;
    const ok = SP.Store.set(SP.SAVE_KEY, JSON.stringify(this.data));
    if (ok) this.lastSaved = Date.now();
    return ok;
  },

  exportString() {
    const json = JSON.stringify(this.data);
    return 'SP1:' + btoa(unescape(encodeURIComponent(json)));
  },

  importString(str) {
    str = (str || '').trim();
    if (!str.startsWith('SP1:')) throw new Error('This is not a SHATTERPOINT save code. Codes start with "SP1:".');
    let obj;
    try { obj = JSON.parse(decodeURIComponent(escape(atob(str.slice(4))))); } catch (e) { throw new Error('The save code is damaged or incomplete. Copy the whole code and try again.'); }
    if (!obj || obj.v !== 1) throw new Error('The save code is from an unsupported version.');
    this.data = this.validate(obj);
    SP.Items.ensureStarter(this.data);
    this.save();
    return true;
  },

  reset() {
    this.data = SP.defaultSave();
    SP.Items.ensureStarter(this.data);
    this.save();
  },
};

/* ---------- simple event bus ---------- */
SP.Bus = {
  h: {},
  on(ev, fn) { (this.h[ev] = this.h[ev] || []).push(fn); },
  emit(ev, a, b, c) { const l = this.h[ev]; if (l) for (const f of l) f(a, b, c); },
};

/* SHATTERPOINT — items, loot generation, upgrades and loadout stats */
'use strict';
(function () {
  const U = SP.U;
  const PREFIX = [
    ['Standard', 'Issue', 'Basic', 'Field'],
    ['Tuned', 'Honed', 'Refit', 'Calibrated'],
    ['Vanta', 'Cobalt', 'Arc', 'Helix', 'Tempest'],
    ['Nightfall', 'Voidglass', 'Seraph', 'Eclipse', 'Quantum'],
    ['Shatterpoint', 'Godspark', 'Zenith', 'Paragon', 'Aurora'],
  ];
  const ARMOR_NOUN = { head: 'Visor', torso: 'Chassis', arms: 'Bracers', legs: 'Greaves', feet: 'Treads' };
  const ARMOR_STYLE_POOL = {
    head: ['visor', 'band', 'helm', 'crest', 'hood', 'mask'],
    torso: ['runner', 'plate', 'coat', 'core', 'tank'],
    arms: ['wraps', 'guards', 'plated', 'cyber'],
    legs: ['cargo', 'sleek', 'plated'],
    feet: ['boots', 'greaves', 'hover'],
  };

  const Items = {
    makeWeapon(family, rarity) {
      const R = SP.RARITY[rarity];
      const it = { id: U.uid(), kind: 'weapon', family, rarity, level: 1, stats: {}, mods: [] };
      const keys = Object.keys(SP.WSTATS);
      for (let i = 0; i < R.stats; i++) {
        const k = U.pick(keys.filter((x) => !(x in it.stats)));
        const r = SP.WSTATS[k].roll;
        it.stats[k] = +(U.rand(r[0], r[1]) * (1 + rarity * 0.12)).toFixed(3);
      }
      const mk = Object.keys(SP.MODS);
      for (let i = 0; i < R.mods; i++) it.mods.push(U.pick(mk.filter((x) => !it.mods.includes(x))));
      if (R.legendary) it.mods.push(U.pick(Object.keys(SP.LEGENDARY_MODS)));
      it.name = U.pick(PREFIX[rarity]) + ' ' + SP.WEAPONS[family].name;
      return it;
    },

    makeArmor(slot, rarity) {
      const R = SP.RARITY[rarity];
      const it = { id: U.uid(), kind: 'armor', slot, rarity, level: 1, stats: {}, mods: [] };
      const keys = Object.keys(SP.ASTATS).filter((k) => !(k in SP.SLOT_BASE[slot].main));
      for (let i = 0; i < R.stats + (rarity >= 3 ? 1 : 0); i++) {
        const k = U.pick(keys.filter((x) => !(x in it.stats)));
        const r = SP.ASTATS[k].roll;
        it.stats[k] = +(U.rand(r[0], r[1]) * (1 + rarity * 0.12)).toFixed(3);
      }
      it.style = U.pick(ARMOR_STYLE_POOL[slot]);
      it.name = U.pick(PREFIX[rarity]) + ' ' + ARMOR_NOUN[slot];
      return it;
    },

    starterKit() {
      const k = Items.makeWeapon('katana', 0); k.name = 'Rookie Plasma Katana';
      const g = Items.makeWeapon('gauntlets', 0); g.name = 'Rookie Combat Gauntlets';
      const t = Items.makeArmor('torso', 0); t.style = 'runner'; t.name = 'Rookie Chassis';
      const f = Items.makeArmor('feet', 0); f.style = 'boots'; f.name = 'Rookie Treads';
      return [k, g, t, f];
    },

    ensureStarter(save) {
      if (!save.inventory.length) {
        save.inventory = Items.starterKit();
        save.equipped.weapon = save.inventory[0].id;
        save.equipped.torso = save.inventory[2].id;
        save.equipped.feet = save.inventory[3].id;
      }
      // repair dangling equip references
      for (const k in save.equipped) {
        if (save.equipped[k] && !save.inventory.find((i) => i.id === save.equipped[k])) save.equipped[k] = null;
      }
      if (!save.equipped.weapon) {
        const w = save.inventory.find((i) => i.kind === 'weapon');
        if (w) save.equipped.weapon = w.id;
        else { const nw = Items.makeWeapon('katana', 0); save.inventory.push(nw); save.equipped.weapon = nw.id; }
      }
      const owned = save.abilities.owned;
      save.abilities.slots = save.abilities.slots.slice(0, 2).map((s) => (s && owned[s] ? s : null));
      while (save.abilities.slots.length < 2) save.abilities.slots.push(null);
    },

    get(save, id) { return save.inventory.find((i) => i.id === id) || null; },
    ownedFamilies(save) { return [...new Set(save.inventory.filter((i) => i.kind === 'weapon').map((i) => i.family))]; },

    /* level scaling */
    levelMult(it) { return 1 + (it.level - 1) * (it.kind === 'weapon' ? 0.05 : 0.08); },

    weaponPower(it) { return SP.RARITY[it.rarity].mult * Items.levelMult(it); },

    armorStats(it) {
      const out = {};
      const m = SP.RARITY[it.rarity].mult * Items.levelMult(it);
      const main = SP.SLOT_BASE[it.slot].main;
      for (const k in main) out[k] = (out[k] || 0) + main[k] * m;
      for (const k in it.stats) out[k] = (out[k] || 0) + it.stats[k] * Items.levelMult(it);
      return out;
    },

    /* list of {label, value} lines for display */
    describe(it) {
      const lines = [];
      if (it.kind === 'weapon') {
        lines.push({ k: 'power', label: 'Damage', value: Math.round(Items.weaponPower(it) * 100), fmt: (v) => v + '%' });
        for (const k in it.stats) lines.push({ k, label: SP.WSTATS[k].name, value: it.stats[k] * Items.levelMult(it), fmt: SP.WSTATS[k].fmt });
      } else {
        const s = Items.armorStats(it);
        for (const k in s) lines.push({ k, label: SP.ASTATS[k].name, value: s[k], fmt: SP.ASTATS[k].fmt });
      }
      return lines;
    },

    modInfo(id) { return SP.MODS[id] || SP.LEGENDARY_MODS[id]; },

    upgradeCost(it) {
      const r = 1 + it.rarity * 0.5;
      return { credits: Math.round(90 * it.level * r), shards: Math.round(4 * it.level * (1 + it.rarity * 0.6)) };
    },
    canUpgrade(save, it) {
      if (it.level >= SP.RARITY[it.rarity].maxLevel) return false;
      const c = Items.upgradeCost(it);
      return save.credits >= c.credits && save.shards >= c.shards;
    },
    upgrade(save, it) {
      if (!Items.canUpgrade(save, it)) return false;
      const c = Items.upgradeCost(it);
      save.credits -= c.credits; save.shards -= c.shards; it.level++;
      return true;
    },
    salvageValue(it) { return { shards: Math.round(3 * (it.rarity + 1) * (it.rarity + 1) + it.level * 2), credits: 25 * (it.rarity + 1) }; },
    isEquipped(save, it) { return Object.values(save.equipped).includes(it.id); },
    salvage(save, it) {
      if (Items.isEquipped(save, it)) return false;
      const v = Items.salvageValue(it);
      save.shards += v.shards; save.credits += v.credits;
      save.inventory = save.inventory.filter((x) => x !== it);
      return true;
    },

    /* rarity roll for loot. tier: 1..3 sector, plus level gating */
    rollRarity(tier, level, bonus = 0) {
      const w = [
        [0, Math.max(5, 55 - tier * 12 - bonus * 10)],
        [1, 30],
        [2, 12 + tier * 5 + bonus * 6],
        [3, (level >= 6 || tier >= 2) ? 3 + tier * 2.5 + bonus * 3 : 0.5],
        [4, level >= 8 ? 0.6 + tier * 0.9 + bonus * 1.5 : 0],
      ];
      return U.weighted(w);
    },
    rollDrop(save, tier, bonus = 0, minRarity = 0) {
      const rarity = Math.max(minRarity, Items.rollRarity(tier, save.level, bonus));
      if (U.chance(0.4)) {
        const fams = SP.WEAPON_ORDER.filter((f) => save.level >= SP.SHOP_WEAPONS[f].level);
        return Items.makeWeapon(U.pick(fams), rarity);
      }
      return Items.makeArmor(U.pick(SP.SLOTS), rarity);
    },

    /* aggregate player stats from equipment, abilities and mastery */
    loadout(save, forcedWeaponFamily) {
      let w = Items.get(save, save.equipped.weapon);
      if (forcedWeaponFamily && (!w || w.family !== forcedWeaponFamily)) {
        // best owned of that family, or a loaner
        const owned = save.inventory.filter((i) => i.kind === 'weapon' && i.family === forcedWeaponFamily).sort((a, b) => Items.weaponPower(b) - Items.weaponPower(a));
        w = owned[0] || Object.assign(Items.makeWeapon(forcedWeaponFamily, 0), { name: 'Loaner ' + SP.WEAPONS[forcedWeaponFamily].name, loaner: true });
      }
      const st = { hp: 200, def: 0, guard: 0, speed: 0, cdr: 0, momentum: 0, dodge: 0 };
      for (const slot of SP.SLOTS) {
        const a = Items.get(save, save.equipped[slot]);
        if (!a) continue;
        const s = Items.armorStats(a);
        for (const k in s) st[k] += s[k];
      }
      st.def = Math.min(st.def, 0.35);
      st.cdr = Math.min(st.cdr, 0.35);
      const mods = new Set(w.mods);
      const ws = {};
      for (const k in w.stats) ws[k] = w.stats[k] * Items.levelMult(w);
      const mLvl = Items.masteryLevel(save.mastery[w.family] || 0);
      return {
        weaponItem: w, family: w.family, power: Items.weaponPower(w), wstats: ws, mods,
        hp: Math.round(st.hp), def: st.def, guardBonus: st.guard, speed: st.speed, cdr: st.cdr,
        momentumGain: st.momentum + (mods.has('surge') ? 0.25 : 0), dodgeRecharge: st.dodge,
        mastery: mLvl,
        abilities: save.abilities.slots.map((id) => (id ? { id, mk: save.abilities.owned[id] || 1 } : null)),
      };
    },

    masteryLevel(xp) {
      let l = 1;
      for (let i = 0; i < SP.MASTERY_LEVELS.length; i++) if (xp >= SP.MASTERY_LEVELS[i]) l = i + 1;
      return l;
    },
  };
  SP.Items = Items;
})();

/* ---- src/js/audio.js ---- */
/* SHATTERPOINT — procedural sound effects (Web Audio, no external files) */
'use strict';
(function () {
  const A = {
    ctx: null, master: null, sfx: null, noise: null, last: {}, ready: false,

    init() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { return; }
      this.master = this.ctx.createGain();
      this.sfx = this.ctx.createGain();
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      this.sfx.connect(this.master); this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 1.0;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.ready = true;
      this.applySettings();
    },

    applySettings() {
      if (!this.ready) return;
      const s = SP.Save.data.settings;
      this.master.gain.value = s.muted ? 0 : s.master;
      this.sfx.gain.value = s.sfx;
    },

    env(g, t, a, peak, d) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    },
    osc(type, f0, f1, dur, vol, t, dest) {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      this.env(g, t, 0.005, vol, dur);
      o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + dur + 0.05);
    },
    nz(filterType, f0, f1, q, dur, vol, t, attack = 0.005) {
      const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
      s.buffer = this.noise; f.type = filterType; f.Q.value = q;
      f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
      this.env(g, t, attack, vol, dur);
      s.connect(f); f.connect(g); g.connect(this.sfx);
      s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
    },

    play(name, p = 1) {
      if (!this.ready || SP.Save.data.settings.muted) return;
      const now = this.ctx.currentTime;

    if (id === 'sky') {

      const platTex = canvasTex(512, 512, (g, w, h) => {

      const d = Math.hypot(p.x, p.z);
      if (d > s) { p.x *= s / d; p.z *= s / d; return true; }

      let hit = false;

  Model.prototype.setWeapon = function (family, variant) {

  /* apply a pose object to joints */
  Model.prototype.applyPose = function (p) {

  /* ---------------- animator ---------------- */
  function lerpPose(out, a, b, t) {
    for (const j of JOINTS) {
      const va = a[j] || DEF[j], vb = b[j] || DEF[j];
      const o = out[j] || (out[j] = [0, 0, 0]);
      o.length = va.length;
      for (let i = 0; i < va.length; i++) o[i] = va[i] + ((vb[i] == null ? 0 : vb[i]) - va[i]) * t;
    }
    out.cr = (a.cr || 0) + ((b.cr || 0) - (a.cr || 0)) * t;
    return out;
  }
  function fillPose(p, base) {
    const o = {};
    for (const j of JOINTS) o[j] = p[j] || base[j] || DEF[j];
    o.cr = p.cr != null ? p.cr : base.cr || 0;
    return o;
  }

  function Animator(model) {
    this.m = model;
    this.walkPh = 0;
    this.cur = fillPose({}, STANCE[model.grip]);
    this.tmp = {}; this.tmp2 = {}; this.tmp3 = {};
    this.spinYaw = 0;
  }
  SP.Animator = Animator;

  /* state: {speed (m/s), moving dir local, grounded, action: {type, anim, p, a, b, spin}, block, stun, dead, deadT, sprint, air, dodge} */
  Animator.prototype.update = function (dt, st) {
    const m = this.m;
    const stance = st.block ? BLOCK[m.grip] : STANCE[m.grip];
    // locomotion base
    const base = this.tmp;
    lerpPose(base, fillPose(stance, DEF), fillPose(stance, DEF), 0);
    const spd = st.speed || 0;
    const amt = U.clamp(spd / 6, 0, 1.3);
    this.walkPh += dt * (4 + spd * 1.6);
    const ph = this.walkPh;
    let bob = 0;
    if (st.grounded && amt > 0.05) {
      const fwd = st.localFwd == null ? 1 : st.localFwd; // -1..1 forward/back
      const side = st.localSide || 0;
      const sw = Math.sin(ph) * 0.75 * amt;
      base.rt[0] += sw * fwd; base.lt[0] -= sw * fwd;
      base.rt[1] = (base.rt[1] || 0) + Math.sin(ph) * 0.25 * side * amt; base.lt[1] = (base.lt[1] || 0) - Math.sin(ph) * 0.25 * side * amt;
      base.rs[0] += Math.max(0, Math.sin(ph + 1.4)) * 1.1 * amt;
      base.ls[0] += Math.max(0, Math.sin(ph + 1.4 + Math.PI)) * 1.1 * amt;
      if (!st.block && !st.action) {
        base.ru[0] -= sw * 0.35; base.lu[0] += sw * 0.35;
        base.sp[0] += 0.12 * amt * (st.sprint ? 1.8 : 1);

      bob = Math.abs(Math.cos(ph)) * 0.05 * amt;
    } else if (!st.grounded) {
      base.rt[0] = -0.6; base.rs[0] = 1.0; base.lt[0] = -0.1; base.ls[0] = 0.5;
    } else {
      // idle breathing
      const b = Math.sin(ph * 0.4) * 0.025;
      base.sp[0] += b; base.ru[2] -= b * 0.5; base.lu[2] += b * 0.5;
      base.rt[0] = -0.15; base.lt[0] = 0.15; base.rs[0] = 0.25; base.ls[0] = 0.15; base.cr = (base.cr || 0) + 0.04;
    }

    let target = base;
    this.spinYaw = 0;
    const act = st.action;
    if (act && act.anim) {
      const w = fillPose(P[act.anim.w] || {}, base), s = fillPose(P[act.anim.s] || {}, base);
      const a = act.a, b = act.b, p = act.p;
      const out = this.tmp2;
      if (p < a) lerpPose(out, base, w, U.smooth(p / Math.max(a, 0.001)));
      else if (p < b) lerpPose(out, w, s, U.easeOut((p - a) / Math.max(b - a, 0.001)));

    if (st.stun) {

      lerpPose(k, base, fillPose({ sp: [-0.45, 0.2, 0.15], hd: [-0.4, 0, 0], ru: [-0.3, 0, -0.9], rf: [-0.5], lu: [-0.3, 0, 0.9], lf: [-0.5], cr: 0.12 }, base), Math.min(1, st.stun));
      target = k;
    }
    if (st.dodge) {
      const k = this.tmp3;
      lerpPose(k, base, fillPose({ sp: [0.7, 0, 0], hd: [0.3, 0, 0], ru: [-1.2, 0, -0.3], rf: [-1.8], lu: [-1.2, 0, 0.3], lf: [-1.8], rt: [-1.4, 0], rs: [2.0], lt: [-1.3, 0], ls: [2.1], cr: 0.45 }, base), Math.sin(Math.min(1, st.dodge) * Math.PI));

    return Object.assign({}, base, { moves: Object.assign({}, base.moves, SP.BOSS_MOVES[bossId]) });
  }
  SP.bossWeapon = bossWeapon;

  class BossBrain extends Brain {
    constructor(f, def, diff, match) {
      super(f, Object.assign({}, SP.ARCHETYPES.elite, { aggr: 0.85, block: 0.35, parry: 0.25, dodge: 0.3, combo: [2, 4], punish: 0.8, skill: 0.6 }), diff, match);
      this.B = def;
      this.phase = 1;
      this.specialT = U.rand(3, 5);
      this.f.W = bossWeapon(def.weapon, def.id);
      if (def.id === 'warden') { this.A = Object.assign({}, this.A, { dodge: 0.02, parry: 0.1, block: 0.6, strafe: 0.2, aggr: 0.75 }); }
      if (def.id === 'phantom') { this.A = Object.assign({}, this.A, { dodge: 0.55, parry: 0.15, block: 0.15, flank: true, strafe: 0.9, aggr: 0.85 }); }
      this.decoys = [];
      this.pending = [];
    }

    update(dt) {
      const f = this.f;
      // pending timed actions
      for (let i = this.pending.length - 1; i >= 0; i--) {
        const p = this.pending[i];
        p.t -= dt;
        if (p.t <= 0) { this.pending.splice(i, 1); if (!f.dead) p.fn(); }
      }
      this.checkPhase();
      // warden keeps shield up when not attacking
      if (this.B.id === 'warden') f.shieldUp = f.state === 'free' && !f.dead;
      if (f.state === 'attack' && f.move && f.move.special === 'wardenRing' && !f.moveFlags.ring && f.moveT >= f.move.hits[0].t[0]) {
        f.moveFlags.ring = true;
        const n = this.phase >= 2 ? 2 : 1;
        f.fwd(_a);
        const c = f.pos.clone().addScaledVector(_a, 1.8);
        for (let i = 0; i < n; i++) SP.Combat.hazard({ kind: 'ring', pos: c.clone(), r0: 1, r1: 15, speed: 9, delay: i * 0.55, dmg: 18, owner: f, team: f.team, color: '#ff8a3d', kb: 4, stun: 0.6 });
      }
      this.specialT -= dt;
      if (this.specialT <= 0 && f.state === 'free' && !this.plan && f.target) {
        this.useSpecial();
      }
      return super.update(dt);
    }

    checkPhase() {
      const f = this.f;
      const r = f.hp / f.maxHp;
      const want = this.B.id === 'archon' ? (r < 0.34 ? 3 : r < 0.67 ? 2 : 1) : (r < 0.5 ? 2 : 1);
      if (want > this.phase && !f.dead) {
        this.phase = want;
        SP.HUD.bossPhase(this.B.name, this.phase);
        SP.Audio.play('bossWarn');
        f.buffs.invuln = 1.2;
        f.endMove(); f.state = 'free';
        f.startMove('aNova' in f.W.moves ? 'aNova' : (f.W.moves.ext ? 'ext' : 'heavy'), this.match, true);
        G.FX.ring(f.pos, 7, this.B.color, 0.6);
        if (this.B.id === 'warden') { f.st.atkMult = (f.st.atkMult || 1) * 1.15; }
        if (this.B.id === 'phantom') { f.st.atkMult = (f.st.atkMult || 1) * 1.15; this.A = Object.assign({}, this.A, { aggr: 1 }); }
        if (this.B.id === 'archon') {
          const fam = this.phase === 2 ? 'katana' : 'hammer';
          this.pending.push({ t: 1.05, fn: () => this.swapWeapon(fam) });
        }
      }
    }

    swapWeapon(fam) {
      const f = this.f;
      f.family = fam;
      f.W = bossWeapon(fam, 'archon');
      f.model.setWeapon(fam);
      f.trail.setColor(this.B.color);
      SP.HUD.popup(f.chest(_a), SP.WEAPONS[fam].name.toUpperCase(), 'break');
    }

    useSpecial() {
      const f = this.f, t = f.target, id = this.B.id;
      const dist = SP.Combat.dist(f, t);
      if (id === 'warden') {
        const r = Math.random();
        if (dist > 6 && r < 0.55) { this.telegraphRed(); f.startMove('wCharge', this.match); }
        else if (dist < 6 && r < 0.6) f.startMove('wSlam', this.match);
        else if (dist < 4.5) f.startMove('wSweep', this.match);
        else if (this.phase >= 2) this.quakeBarrage(3);
        else f.startMove('wSlam', this.match);
        this.specialT = (this.phase >= 2 ? 3.2 : 4.5) * U.rand(0.8, 1.2) * (this.D.decide / 0.38) ** 0.5;
      } else if (id === 'phantom') {
        const r = Math.random();
        const alive = this.decoys.filter((d) => !d.dead).length;
        if (alive === 0 && r < 0.3) this.spawnDecoys(this.phase >= 2 ? 3 : 2);
        else if (r < 0.65) this.ambush();
        else { f.startMove('pVolley', this.match); }
        this.specialT = (this.phase >= 2 ? 2.8 : 3.8) * U.rand(0.8, 1.2) * (this.D.decide / 0.38) ** 0.5;
      } else if (id === 'archon') {
        const r = Math.random();
        if (this.phase === 1) { if (r < 0.6) f.startMove('aBurst', this.match); else this.orbital(2); }
        else if (this.phase === 2) { if (r < 0.6) this.orbital(4); else f.startMove('aBurst', this.match); }
        else { if (r < 0.4) f.startMove('aOrbs', this.match); else if (r < 0.75) this.orbital(5); else f.startMove('aBurst', this.match); }
        this.specialT = (4.2 - this.phase * 0.6) * U.rand(0.8, 1.2) * (this.D.decide / 0.38) ** 0.5;
      }
    }

    telegraphRed() {
      const p = this.f.chest(_a);
      G.FX.flash(p, 2.2, '#ff2a3d', 0.5);
      SP.Audio.play('warn');
    }

    quakeBarrage(n) {
      const f = this.f, t = f.target;
      SP.Audio.play('warn');
      for (let i = 0; i < n; i++) {
        this.pending.push({ t: i * 0.35, fn: () => {
          const p = t.pos.clone(); p.x += U.rand(-1.5, 1.5); p.z += U.rand(-1.5, 1.5); p.y = 0;
          SP.Combat.hazard({ kind: 'circle', pos: p, r: 2.6, delay: 1.0, dmg: 20, owner: f, team: f.team, color: '#ff8a3d', kb: 5, up: 4 });
        } });
      }
      f.startMove('ext', this.match);
    }

    orbital(n) {
      const f = this.f, t = f.target;
      SP.Audio.play('warn');
      SP.HUD.popup(f.chest(_a), 'ORBITAL STRIKE', 'break');
      for (let i = 0; i < n; i++) {
        this.pending.push({ t: i * 0.28, fn: () => {
          const lead = t.vel.clone().multiplyScalar(0.6);
          const p = t.pos.clone().add(lead); p.x += U.rand(-1.2, 1.2) * (i ? 1 : 0); p.z += U.rand(-1.2, 1.2) * (i ? 1 : 0); p.y = 0;
          G.clampToArena(p, 1);
          SP.Combat.hazard({ kind: 'circle', pos: p, r: 2.2, delay: 1.15, dmg: 22, owner: f, team: f.team, color: '#ffffff', kb: 4, up: 3 });
        } });
      }
    }

    ambush() {
      const f = this.f, t = f.target;
      // marker where Phantom will appear (behind the player)
      t.fwd(_a);
      const p = t.pos.clone().addScaledVector(_a, -1.4); p.y = 0;
      G.clampToArena(p, 1);
      const dec = G.FX.decal(p, 0.9, '#ff5cf0');
      const delay = this.phase >= 2 ? 0.5 : 0.65;
      let tt = 0;
      const tick = { t: 0, fn: null };
      const step = () => {
        tt += 0.05;
        G.FX.decalProgress(dec, Math.min(1, tt / delay));
        if (tt < delay) this.pending.push({ t: 0.05, fn: step });
        else {
          G.FX.freeDecal(dec);
          if (f.state === 'stun' || f.dead) return;
          f.blinkTo(p.x, p.z, t);
          f.startMove('pAmbush', this.match, true);
        }
      };
      this.pending.push({ t: 0.05, fn: step });
      SP.Audio.play('blink');
      f.buffs.invuln = Math.max(f.buffs.invuln, delay);
      void tick;
    }

    spawnDecoys(n) {
      const f = this.f;
      SP.HUD.popup(f.chest(_a), 'HOLOGRAPHIC SPLIT', 'break');
      SP.Audio.play('blink');
      for (let i = 0; i < n; i++) {
        const ang = f.yaw + (i - (n - 1) / 2) * 1.6;
        const d = this.match.spawnEnemyDecoy(f, f.pos.x + Math.sin(ang) * 2.5, f.pos.z + Math.cos(ang) * 2.5);
        this.decoys.push(d);
      }
      // the real one repositions
      f.blinkTo(f.pos.x + U.rand(-3, 3), f.pos.z + U.rand(-3, 3), f.target);
    }
  }
  SP.BossBrain = BossBrain;
})();

/* SHATTERPOINT — keyboard, mouse and touch input, remapping, touch layout */
'use strict';
(function () {
  const U = SP.U;
  const ACTIONS_PRESS = ['light', 'heavy', 'jump', 'dodge', 'skill', 'ab0', 'ab1', 'mom', 'lock', 'pause'];
  const I = {
    keys: new Set(), pressed: [], camDX: 0, camDY: 0, zoom: 0,
    active: false, locked: false, touchMode: false,
    stick: { x: 0, y: 0, id: null, ox: 0, oy: 0 },
    camTouch: { id: null, x: 0, y: 0 },
    touchBlock: false, remapCb: null, editLayout: false,
    lastInput: 'kb',
  };
  SP.Input = I;

  const KEY_NAMES = { Space: 'Space', ShiftLeft: 'L-Shift', ShiftRight: 'R-Shift', ControlLeft: 'L-Ctrl', Tab: 'Tab', Mouse0: 'L-Click', Mouse1: 'M-Click', Mouse2: 'R-Click', ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', Escape: 'Esc' };
  I.keyName = (code) => KEY_NAMES[code] || (code || '').replace(/^Key/, '').replace(/^Digit/, '');
  I.bind = (a) => SP.Save.data.keybinds[a];
  I.actionFor = (code) => { const kb = SP.Save.data.keybinds; for (const a in kb) if (kb[a] === code) return a; return null; };

  I.init = function (canvas) {
    I.canvas = canvas;

    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', () => { I.keys.clear(); I.touchBlock = false; });
    canvas.addEventListener('mousedown', onMouseDown);
    window.addEventListener('mouseup', onMouseUp);
    window.addEventListener('mousemove', onMouseMove);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('wheel', (e) => { if (I.active) { I.zoom += Math.sign(e.deltaY); e.preventDefault(); } }, { passive: false });
    document.addEventListener('pointerlockchange', () => {
      const was = I.locked;
      I.locked = document.pointerLockElement === canvas;
      if (was && !I.locked && I.active && SP.Game.state === 'playing' && !I.suppressPauseOnUnlock) SP.Game.pause();
      I.suppressPauseOnUnlock = false;
    });
    // touch zone handlers
    const tz = document.getElementById('touch');
    tz.addEventListener('pointerdown', onTouchDown, { passive: false });
    tz.addEventListener('pointermove', onTouchMove, { passive: false });
    tz.addEventListener('pointerup', onTouchUp);
    tz.addEventListener('pointercancel', onTouchUp);
    window.addEventListener('touchstart', () => { if (SP.Save.data.settings.touch === 'auto' && !I.touchMode) { I.touchMode = true; SP.Bus.emit('touchMode'); } }, { passive: true });
    I.touchMode = SP.Save.data.settings.touch === 'on' || (SP.Save.data.settings.touch === 'auto' && SP.G.isMobile);
    I.applyTouchLayout();
  };

  function onKeyDown(e) {
    if (I.remapCb) {
      e.preventDefault();
      if (e.code === 'Escape') { const cb = I.remapCb; I.remapCb = null; cb(null); return; }
      const cb = I.remapCb; I.remapCb = null; cb(e.code); return;
    }
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.code === 'Escape' && SP.Game.state === 'playing') { SP.Game.pause(); e.preventDefault(); return; }
    if (!I.active) return;
    I.lastInput = 'kb';
    const a = I.actionFor(e.code);
    if (a) e.preventDefault();
    if (e.repeat) return;
    I.keys.add(e.code);
    if (a && ACTIONS_PRESS.includes(a)) I.press(a);
  }
  function onKeyUp(e) { I.keys.delete(e.code); }
  function onMouseDown(e) {
    const code = 'Mouse' + e.button;
    if (I.remapCb) { const cb = I.remapCb; I.remapCb = null; cb(code); e.preventDefault(); return; }
    if (!I.active) return;
    I.lastInput = 'kb';
    if (!I.locked && !SP.G.isMobile && SP.Game.state === 'playing' && I.canvas.requestPointerLock) {
      try { const r = I.canvas.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (err) { /* not allowed */ }
    }
    I.keys.add(code);
    const a = I.actionFor(code);
    if (a && ACTIONS_PRESS.includes(a)) I.press(a);
    e.preventDefault();
  }
  function onMouseUp(e) { I.keys.delete('Mouse' + e.button); }
  function onMouseMove(e) {
    if (!I.active || I.touchMode) return;
    if (I.locked || (e.buttons & 4)) {
      I.camDX += e.movementX || 0; I.camDY += e.movementY || 0;
    }
  }

  I.press = function (a) {
    if (a === 'pause') { SP.Game.pause(); return; }
    if (a === 'lock') { SP.Game.toggleLock(); return; }
    I.pressed.push(a);
  };

  I.held = (a) => I.keys.has(SP.Save.data.keybinds[a]);

  /* sample per frame: returns {ix, iy, sprint, block, camDX, camDY, pressed} */
  I.sample = function (dt) {
    let ix = 0, iy = 0;
    if (I.held('forward')) iy += 1;
    if (I.held('back')) iy -= 1;
    if (I.held('right')) ix += 1;
    if (I.held('left')) ix -= 1;
    let sprint = I.held('sprint');
    let block = I.held('block');
    let cdx = I.camDX * 0.0028, cdy = I.camDY * 0.0022;
    const camKey = 2.4 * dt;
    if (I.held('camLeft')) cdx -= camKey;
    if (I.held('camRight')) cdx += camKey;
    if (I.held('camUp')) cdy -= camKey * 0.6;
    if (I.held('camDown')) cdy += camKey * 0.6;
    if (I.touchMode) {
      const s = I.stick;
      if (s.id != null) {
        ix += s.x; iy += s.y;

    if (l > 1) { ix /= l; iy /= l; }
    const out = { ix, iy, sprint, block, camDX: cdx, camDY: cdy, pressed: I.pressed.slice(), zoom: I.zoom };
    I.pressed.length = 0; I.camDX = 0; I.camDY = 0; I.zoom = 0;
    return out;
  };
  I.tcx = 0; I.tcy = 0;

  I.setActive = function (on) {
    I.active = on;
    I.keys.clear(); I.pressed.length = 0; I.touchBlock = false;
    I.stick.id = null; I.camTouch.id = null;
    const st = document.getElementById('stick');

    if (!on && I.locked && document.exitPointerLock) { I.suppressPauseOnUnlock = true; document.exitPointerLock(); }
  };

  /* ---------------- touch ---------------- */
  function btnFrom(el) {
    while (el && el !== document.body) { if (el.dataset && el.dataset.act) return el; el = el.parentElement; }
    return null;
  }
  function onTouchDown(e) {
    if (!I.active && !I.editLayout) return;
    e.preventDefault();
    const btn = btnFrom(e.target);

    SP.Audio.init();
    if (btn) {
      const a = btn.dataset.act;

      else I.press(a);

    }
    const left = SP.Save.data.settings.leftHanded ? e.clientX > window.innerWidth * 0.55 : e.clientX < window.innerWidth * 0.45;
    if (left && I.stick.id == null) {
      I.stick.id = e.pointerId; I.stick.ox = e.clientX; I.stick.oy = e.clientY; I.stick.x = 0; I.stick.y = 0;
      const st = document.getElementById('stick');
      st.hidden = false; st.style.left = e.clientX + 'px'; st.style.top = e.clientY + 'px';

      I.camTouch.id = e.pointerId; I.camTouch.x = e.clientX; I.camTouch.y = e.clientY;
    }
  }
  function onTouchMove(e) {
    if (I.drag) { moveDrag(e); return; }

      e.preventDefault();

      if (d > R) {
        // drag the stick origin along so direction changes stay responsive
        const k = (d - R) / d; I.stick.ox += dx * k; I.stick.oy += dy * k;
        dx = e.clientX - I.stick.ox; dy = e.clientY - I.stick.oy;
        const st = document.getElementById('stick'); st.style.left = I.stick.ox + 'px'; st.style.top = I.stick.oy + 'px';
      }
      I.stick.x = dx / R; I.stick.y = -dy / R;
      const dead = 0.12, m = Math.hypot(I.stick.x, I.stick.y);

    } else if (e.pointerId === I.camTouch.id) {
      e.preventDefault();
      const s = SP.Save.data.settings.camSens;

    }
  }

    if (I.drag) { endDrag(e); return; }

  }

  /* ---------------- touch layout editing ---------------- */
  I.applyTouchLayout = function () {
    const s = SP.Save.data.settings;
    const root = document.getElementById('touch');
    if (!root) return;
    root.style.setProperty('--tscale', s.touchScale);
    root.classList.toggle('lefty', !!s.leftHanded);

    if (e.pointerId !== I.drag.id) return;
    e.preventDefault();

    b.style.left = x + '%'; b.style.top = y + '%'; b.style.right = 'auto'; b.style.bottom = 'auto'; b.classList.add('custom');
    I.drag.x = x; I.drag.y = y;
  }

    if (!I.drag || e.pointerId !== I.drag.id) return;

    I.drag = null;
  }
})();
