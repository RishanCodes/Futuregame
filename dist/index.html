  Game.start = function (cfg) {
    SP.Audio.init();
    if (Game.match) Game.match.dispose();
    G.stageRoot.visible = false;
    if (Game.preview.model) { G.stageRoot.remove(Game.preview.model.root); Game.preview.model = null; Game.preview.dirty = true; }
    G.FX.clear();
    G.buildArena(cfg.arena);
    Game.match = new Match(cfg);
    Game.cam.yaw = Game.match.player.yaw; Game.cam.pitch = 0.3; Game.cam.manualT = 0;
    const p = Game.match.player;
    Game.cam.pos.set(p.pos.x - Math.sin(p.yaw) * 6, 3, p.pos.z - Math.cos(p.yaw) * 6);
    Game.cam.look.set(p.pos.x, 1.4, p.pos.z);
    SP.HUD.reset(Game.match);
    SP.UI.showGame();
    Game.state = 'playing';
    SP.Input.setActive(true);
    SP.HUD.banner(cfg.title || 'FIGHT', cfg.subtitle || '');
    Game.timeScale = 1; Game.slowT = 0;
  };

  Game.pause = function () {
    if (Game.state !== 'playing') return;
    Game.state = 'paused';
    SP.Input.setActive(false);
    SP.UI.showPause();
  };
  Game.resume = function () {
    if (Game.state !== 'paused') return;
    Game.state = 'playing';
    SP.UI.showGame();
    SP.Input.setActive(true);
  };
  Game.restart = function () {
    const cfg = Game.match.cfg;
    Game.start(cfg);
  };
  Game.quitToMenu = function () {
    if (Game.match) { Game.match.dispose(); Game.match = null; }
    SP.Input.setActive(false);
    Game.state = 'menu';
    Game.showMenuScene();
  };

  /* =================================================================
     Match
     ================================================================= */
  class Match {
    constructor(cfg) {
      this.cfg = cfg;
      this.mode = cfg.mode;
      this.diff = SP.DIFFICULTY[cfg.difficulty || SP.Save.data.settings.difficulty] || SP.DIFFICULTY.normal;
      this.diffId = cfg.difficulty || SP.Save.data.settings.difficulty;
      this.tier = cfg.tier || 1;
      this.fighters = []; this.decoys = [];
      this.time = 0; this.waveIdx = -1; this.waveDelay = 0; this.ended = false; this.endT = 0;
      this.lowgrav = cfg.modifier === 'lowgrav';
      this.stats = { dealt: 0, taken: 0, parries: 0, counters: 0, perfects: 0, finishers: 0, heals: 0, overheats: 0, kills: 0, maxCombo: 0, combo: 0, comboT: 0, wavesCleared: 0, score: 0 };
      this.ventT = 4;
      this.spawnPlayer();
      if (this.mode === 'survival') this.waves = [];
      else this.waves = cfg.waves;
      this.nextWave(true);
    }

    spawnPlayer() {
      const s = SP.Save.data;
      const lo = SP.Items.loadout(s, this.cfg.weapon);
      this.loadout = lo;
      const W = SP.WEAPONS[lo.family];
      const st = {
        maxHp: lo.hp, def: lo.def, dmgMult: 1, power: lo.power, guardMax: W.guardMax + lo.guardBonus,
        speed: lo.speed, cdr: lo.cdr, momentumGain: lo.momentumGain, dodgeRecharge: lo.dodgeRecharge,
        mods: lo.mods, wstats: lo.wstats, mastery: lo.mastery,
      };
      const A = G.arena.def;
      const p = new SP.Fighter({ team: 0, isPlayer: true, name: s.name, appearance: s.appearance, family: lo.family, stats: st, x: 0, z: -A.size * 0.45, yaw: 0, abilities: lo.abilities, weaponColor: Game.variantColor(lo.family) });
      p.lockTarget = null;
      this.player = p;
      this.fighters.push(p);
    }

    enemyAppearance(arch, color) {
      const pickStyle = (slot) => U.pick(SP.STYLES[slot].map((x) => x.id));
      return {
        face: U.randi(0, 4), skin: U.randi(0, 7), hairStyle: U.randi(0, 6), hairColor: U.randi(0, 9), eyeColor: U.randi(0, 6),
        height: U.rand(0.95, 1.06), build: arch && arch.id === 'heavy' ? 1.25 : U.rand(0.9, 1.1), shoulders: U.rand(0.95, 1.12),
        styles: { head: U.pick(['visor', 'helm', 'mask', 'hood', 'band', 'crest']), torso: pickStyle('torso'), arms: pickStyle('arms'), legs: pickStyle('legs'), feet: pickStyle('feet') },
        colors: { primary: U.pick(['#15171f', '#1d1a22', '#20242e', '#1a1418']), secondary: U.pick(['#3a3f4d', '#59606e', '#2c2f38']), accent: color },
      };
    }

    makeEnemy(spec, x, z) {
      const D = this.diff;
      const atk = { easy: 0.86, normal: 0.94, hard: 1, nightmare: 1.04 }[this.diffId] || 0.94;
      const track = { easy: 3, normal: 4.5, hard: 6, nightmare: 8 }[this.diffId] || 4.5;
      let f;
      if (spec.boss) {
        const B = SP.BOSSES[spec.boss];
        const ap = {
          face: 2, skin: spec.boss === 'archon' ? 6 : 3, hairStyle: 0, hairColor: 0, eyeColor: spec.boss === 'phantom' ? 4 : 1, height: 1, build: spec.boss === 'warden' ? 1.3 : 1, shoulders: spec.boss === 'warden' ? 1.25 : 1,
          styles: spec.boss === 'warden' ? { head: 'helm', torso: 'plate', arms: 'plated', legs: 'plated', feet: 'greaves' }
            : spec.boss === 'phantom' ? { head: 'hood', torso: 'coat', arms: 'cyber', legs: 'sleek', feet: 'hover' }
              : { head: 'crest', torso: 'core', arms: 'cyber', legs: 'plated', feet: 'hover' },
          colors: spec.boss === 'warden' ? { primary: '#2a2119', secondary: '#5b4a3a', accent: B.color }
            : spec.boss === 'phantom' ? { primary: '#140f18', secondary: '#2b2033', accent: B.color }
              : { primary: '#e8ecf3', secondary: '#9aa3b2', accent: '#7fd0ff' },
        };
        const hpMult = (spec.hpMult || 1) * D.hp;
        const st = { maxHp: Math.round(B.hp * hpMult), def: 0, dmgMult: 0.8 * D.dmg * (spec.dmgMult || 1), power: 1, guardMax: spec.boss === 'warden' ? 220 : 140, speed: 0, poise: B.poise, mods: new Set(), wstats: {}, mastery: 1, atkMult: atk, trackRate: track, moveMult: spec.boss === 'warden' ? 0.85 : spec.boss === 'phantom' ? 1.15 : 1 };
        f = new SP.Fighter({ team: 1, name: B.name, boss: B.id, appearance: ap, family: B.weapon, stats: st, scale: B.scale, x, z, yaw: Math.PI, extra: spec.boss === 'warden' ? 'shield' : spec.boss === 'archon' ? 'core' : null, weaponColor: B.color === '#ffffff' ? '#7fd0ff' : B.color });
        new SP.BossBrain(f, B, D, this);
      } else {
        const A = SP.ARCHETYPES[spec.arch];
        const fam = spec.weapon || U.pick(A.weapons);
        const W = SP.WEAPONS[fam];
        const tierMul = 1 + 0.15 * (this.tier - 1);
        const st = {
          maxHp: Math.round(150 * A.hp * D.hp * tierMul * (spec.hpMult || 1)), def: 0, dmgMult: 0.85 * D.dmg * (1 + 0.08 * (this.tier - 1)) * (spec.dmgMult || 1), power: 1,
          guardMax: W.guardMax * (this.cfg.modifier === 'shielded' ? 1.5 : 1) * (A.id === 'defensive' ? 1.2 : 1), speed: 0, poise: A.poise || 0, mods: new Set(), wstats: {}, mastery: 1, atkMult: atk * (A.id === 'heavy' ? 0.95 : 1), trackRate: track,
          moveMult: A.id === 'mobile' ? 1.12 : A.id === 'heavy' ? 0.9 : 1,
        };
        if (A.id === 'drone') st.dmgMult = 0;
        f = new SP.Fighter({ team: 1, name: A.name, arch: A.id, appearance: this.enemyAppearance(A, A.color), family: fam, stats: st, scale: A.scale || 1, x, z, yaw: Math.PI, weaponColor: A.color });
        new SP.Brain(f, A, D, this);
      }
      this.fighters.push(f);
      return f;
    }

    spawnEnemyDecoy(boss, x, z) {
      const st = Object.assign({}, boss.st, { maxHp: 1, dmgMult: boss.st.dmgMult * 0.35, poise: 0 });
      const d = new SP.Fighter({ team: 1, name: boss.name, boss: boss.boss, decoy: true, holo: false, appearance: boss.o.appearance, family: boss.family, stats: st, scale: boss.scale, x, z, yaw: boss.yaw, weaponColor: boss.o.weaponColor });
      d.model.blob.visible = false; // the tell: decoys cast no shadow
      d.model.root.traverse((o) => { o.castShadow = false; });
      new SP.Brain(d, Object.assign({}, SP.ARCHETYPES.aggressive, { block: 0, parry: 0, dodge: 0.1 }), this.diff, this);
      d.life = 10;
      G.clampToArena(d.pos, 1);
      this.fighters.push(d);
      return d;
    }

    spawnDecoy(owner, dur, explode) {
      const st = { maxHp: 80, def: 0, dmgMult: 0, power: 1, guardMax: 50, speed: 0, mods: new Set(), wstats: {}, mastery: 1 };
      owner.fwd(_a);
      const d = new SP.Fighter({ team: owner.team, name: 'Decoy', decoy: true, appearance: owner.o.appearance, family: owner.family, stats: st, x: owner.pos.x - _a.x * 1.5, z: owner.pos.z - _a.z * 1.5, yaw: owner.yaw, holoColor: owner.o.appearance.colors.accent });
      d.buffs.decoyAggro = dur; d.life = dur; d.explode = explode;
      this.fighters.push(d);
      G.FX.ring(d.pos, 1.5, owner.o.appearance.colors.accent, 0.4);
    }

    enemiesOf(f) {
      const out = this._eo || (this._eo = []);
      out.length = 0;
      for (const o of this.fighters) if (o.team !== f.team && !o.removed) out.push(o);
      return out.slice();
    }
    nearestEnemy(f, r, arc) {
      let best = null, bd = r;
      for (const e of this.fighters) {
        if (e.team === f.team || e.dead || e.removed) continue;
        const d = SP.Combat.dist(f, e);
        if (d > bd) continue;
        if (arc < 360) { const ang = Math.abs(U.angDiff(f.yaw, Math.atan2(e.pos.x - f.pos.x, e.pos.z - f.pos.z))); if (ang > arc * Math.PI / 360) continue; }
        bd = d; best = e;
      }
      return best;
    }

    /* waves */
    genSurvivalWave(n) {
      const count = Math.min(4, 1 + Math.floor((n - 1) / 3));
      const pool = ['aggressive'];
      if (n >= 2) pool.push('defensive');
      if (n >= 3) pool.push('tactical');
      if (n >= 4) pool.push('mobile');
      if (n >= 5) pool.push('heavy');
      if (n >= 7) pool.push('elite');
      if (n % 10 === 0) {
        const b = ['warden', 'phantom', 'archon'][(n / 10 - 1) % 3];
        return [{ boss: b, hpMult: 0.6 + n * 0.01 }];
      }
      const w = [];
      for (let i = 0; i < count; i++) w.push({ arch: n % 5 === 0 && i === 0 ? 'elite' : U.pick(pool), hpMult: 1 + n * 0.03, dmgMult: 1 + n * 0.015 });
      return w;
    }
    nextWave(first) {
      this.waveIdx++;
      let wave;
      if (this.mode === 'survival') {
        wave = this.genSurvivalWave(this.waveIdx + 1);
        this.tier = Math.min(3, 1 + Math.floor((this.waveIdx + 1) / 6));
      } else wave = this.waves[this.waveIdx];
      if (!wave) return false;
      const n = wave.length;
      const A = G.arena.def;
      wave.forEach((spec, i) => {
        const ang = n === 1 ? 0 : (i / (n - 1) - 0.5) * 1.6;
        const r = A.size * 0.5;
        const x = Math.sin(ang) * r, z = Math.cos(ang) * r;
        const e = this.makeEnemy(spec, x, z);
        e.yaw = Math.atan2(this.player.pos.x - x, this.player.pos.z - z);
        G.FX.ring(e.pos, 1.6, e.o.weaponColor || '#ff4d4d', 0.5);
      });
      if (!first) {
        const label = this.mode === 'survival' ? 'WAVE ' + (this.waveIdx + 1) : this.mode === 'bossrush' ? SP.BOSSES[wave[0].boss].name : 'WAVE ' + (this.waveIdx + 1) + ' / ' + this.waves.length;
        SP.HUD.banner(label, wave[0].boss && this.mode !== 'bossrush' ? SP.BOSSES[wave[0].boss].title : '');
      }
      if (wave[0].boss) SP.Audio.play('bossWarn');
      if (SP.Save.data.settings.autoLock && !this.player.lockTarget) this.pendingLock = 0.6;
      return true;
    }

    aliveEnemies() { return this.fighters.filter((f) => f.team === 1 && !f.dead && !f.decoy); }

    onPlayerHit() {
      const s = this.stats;
      s.combo = s.comboT > 0 ? s.combo + 1 : 1;
      s.comboT = 1.6;
      s.maxCombo = Math.max(s.maxCombo, s.combo);
      SP.HUD.combo(s.combo);
    }

    onDeath(f, killer) {
      if (f.isPlayer) { this.endT = 1.8; this.pendingResult = false; return; }
      if (f.team === 1 && !f.decoy) {
        this.stats.kills++;
        this.stats.score += Math.round(100 * (f.boss ? 10 : (SP.ARCHETYPES[f.arch] || { hp: 1 }).hp) * this.tier);
        // boss death clears its decoys
        if (f.boss) for (const o of this.fighters) if (o.decoy && o.team === 1 && !o.dead) SP.Combat.kill(o, null);
      }
      if (f.decoy && f.team === 0 && f.explode) SP.Combat.areaDamage(f, f.pos, 3.2, 22, f.o.appearance.colors.accent);
      if (this.player.lockTarget === f) {
        this.player.lockTarget = SP.Save.data.settings.autoLock ? Game.bestLockTarget(f) : null;
      }
      f.removeAt = this.time + (f.decoy ? 0.4 : 2.4);
    }

    update(dt, inp, rdt) {
      this.time += dt;
      const p = this.player;
      Game.env.time = this.time;
      // camera-relative movement
      const yaw = Game.cam.yaw;
      const fx = Math.sin(yaw), fz = Math.cos(yaw);
      const ctrl = {
        mx: fx * inp.iy - fz * inp.ix, mz: fz * inp.iy + fx * inp.ix,
        sprint: inp.sprint, block: inp.block, pressed: inp.pressed,
      };
      if (this.ended) { ctrl.mx = ctrl.mz = 0; ctrl.pressed = []; ctrl.block = false; }
      if (this.pendingLock != null) {
        this.pendingLock -= dt;
        if (this.pendingLock <= 0) { this.pendingLock = null; if (!p.lockTarget) p.lockTarget = Game.bestLockTarget(); }
      }
      if (p.lockTarget && (p.lockTarget.dead || p.lockTarget.removed)) p.lockTarget = null;
      if (this.stats.comboT > 0) this.stats.comboT -= dt;
      // fighters
      for (const f of this.fighters) {
        if (f.removed) continue;
        let c = null;
        if (f.isPlayer) c = ctrl;
        else if (f.ai) c = this.ended && !f.dead ? { mx: 0, mz: 0, block: false, pressed: [] } : f.ai.update(dt);
        f.update(dt, c, this);
        if (f.life != null && !f.dead) { f.life -= dt; if (f.life <= 0) SP.Combat.kill(f, null); }
      }
      // fighter separation
      for (let i = 0; i < this.fighters.length; i++) {
        const a = this.fighters[i]; if (a.dead || a.removed) continue;
        for (let j = i + 1; j < this.fighters.length; j++) {
          const b = this.fighters[j]; if (b.dead || b.removed) continue;
          if (Math.abs(a.pos.y - b.pos.y) > 1.5) continue;
          const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d = Math.hypot(dx, dz), m = a.radius + b.radius;
          if (d < m && d > 1e-4) {
            const push = (m - d) / 2, nx = dx / d, nz = dz / d;
            const wa = b.boss ? 1.6 : 1, wb = a.boss ? 1.6 : 1;
            a.pos.x -= nx * push * wa; a.pos.z -= nz * push * wa; b.pos.x += nx * push * wb; b.pos.z += nz * push * wb;
          }
        }
      }
      SP.Combat.updateProjectiles(dt, this);
      SP.Combat.updateHazards(dt, this);
      // vents modifier
      if (this.cfg.modifier === 'vents' && !this.ended) {
        this.ventT -= dt;
        if (this.ventT <= 0) {
          this.ventT = U.rand(3.5, 5.5);
          for (let i = 0; i < 2; i++) {
            const pt = i === 0 ? p.pos.clone().add(_a.set(U.rand(-2, 2), 0, U.rand(-2, 2))) : G.randomPoint(3);
            pt.y = 0; G.clampToArena(pt, 1);
            SP.Combat.hazard({ kind: 'circle', pos: pt, r: 2.3, delay: 1.3, dmg: 14, owner: Game.env, team: -1, color: '#ff8a3d', kb: 3, up: 5 });
          }
        }
      }
      // remove finished
      for (const f of this.fighters) if (f.dead && !f.removed && f.removeAt != null && this.time >= f.removeAt && !f.isPlayer) f.dispose();
      this.fighters = this.fighters.filter((f) => !f.removed);
      // flow
      if (!this.ended) {
        if (p.dead) { this.ended = true; this.victory = false; this.endT = 1.8; }
        else if (this.aliveEnemies().length === 0) {
          if (this.waveDelay <= 0) {
            this.stats.wavesCleared++;
            const hasMore = this.mode === 'survival' || this.waveIdx + 1 < this.waves.length;
            if (hasMore) {
              this.waveDelay = 2.2;
              const heal = this.mode === 'bossrush' ? 0.35 : this.mode === 'survival' ? 0.2 : 0.1;
              p.hp = Math.min(p.maxHp, p.hp + p.maxHp * heal);
              p.healUses = Math.max(0, p.healUses - (this.mode === 'bossrush' ? 1 : 0));
              SP.HUD.popupSelf(this.mode === 'survival' ? 'WAVE ' + (this.waveIdx + 1) + ' CLEARED' : 'WAVE CLEARED', 'mom');
              this.waveTimerArmed = true;
            } else { this.ended = true; this.victory = true; this.endT = 1.4; SP.HUD.banner('VICTORY', ''); SP.Audio.play('victory'); Game.slowmo(0.3, 0.8); }
          }
        }
        if (this.waveTimerArmed) {
          this.waveDelay -= dt;
          if (this.waveDelay <= 0) { this.waveTimerArmed = false; this.waveDelay = 0; this.nextWave(false); }
        }
      } else {
        this.endT -= rdt;
        if (this.endT <= 0 && !this.rewarded) {
          if (!this.victory) SP.Audio.play('defeat');
          this.finish();
        }
      }
    }

    objectiveText() {
      const s = this.stats, t = U.fmtTime(this.time);
      let main = '';
      if (this.mode === 'survival') main = `<b>WAVE ${this.waveIdx + 1}</b> · Score ${U.fmt(s.score)} · ${t}`;
      else if (this.mode === 'bossrush') main = `<b>BOSS ${this.waveIdx + 1} / ${this.waves.length}</b> · ${t}`;
      else main = `<b>${U.esc(this.cfg.title || 'DUEL')}</b> · ${this.waves.length > 1 ? 'Wave ' + (this.waveIdx + 1) + '/' + this.waves.length + ' · ' : ''}${t}`;
      const goal = this.cfg.bonus || this.cfg.goal;
      if (goal) {
        const st = this.goalStatus(goal);
        main += `<div class="goal ${st.state}">${st.state === 'ok' ? '✓' : st.state === 'fail' ? '✕' : '◇'} ${U.esc(this.goalText(goal))}${st.prog ? ' <span>' + st.prog + '</span>' : ''}</div>`;
      }
      if (this.cfg.modifier) main += `<div class="mod">${U.esc(SP.MODIFIERS[this.cfg.modifier].name)}</div>`;
      return main;
    }
    goalText(g) {
      if (g.text) return g.text;
      const ch = SP.CHALLENGES.find((c) => c.goal === g);
      return ch ? ch.desc : '';
    }
    /* state: ok | fail | pending, prog text */
    goalStatus(g) {
      const s = this.stats, p = this.player;
      switch (g.id) {
        case 'noheal': return { state: s.heals > 0 ? 'fail' : (this.ended && this.victory ? 'ok' : 'pending') };
        case 'nooverheat': return { state: s.overheats > 0 ? 'fail' : (this.ended && this.victory ? 'ok' : 'pending') };
        case 'time': return { state: this.time > g.v ? 'fail' : (this.ended && this.victory ? 'ok' : 'pending'), prog: U.fmtTime(Math.max(0, g.v - this.time)) + ' left' };
        case 'parries': return { state: s.parries >= g.v ? 'ok' : 'pending', prog: Math.min(s.parries, g.v) + '/' + g.v };
        case 'counters': return { state: s.counters >= g.v ? 'ok' : 'pending', prog: Math.min(s.counters, g.v) + '/' + g.v };
        case 'perfect': return { state: s.perfects >= g.v ? 'ok' : 'pending', prog: Math.min(s.perfects, g.v) + '/' + g.v };
        case 'finishers': return { state: s.finishers >= g.v ? 'ok' : 'pending', prog: Math.min(s.finishers, g.v) + '/' + g.v };
        case 'dmgTaken': { const r = s.taken / p.maxHp; return { state: r >= g.v ? 'fail' : (this.ended && this.victory ? 'ok' : 'pending'), prog: Math.round(r * 100) + '% lost' }; }
        case 'win': return { state: this.ended && this.victory ? 'ok' : 'pending' };
        default: return { state: 'pending' };
      }
    }
    goalMet(g) { return this.victory && this.goalStatus(g).state === 'ok'; }

    /* ---------------- rewards (applied exactly once) ---------------- */
    finish() {
      if (this.rewarded) return;
      this.rewarded = true;
      const s = SP.Save.data;
      const D = this.diff;
      const v = !!this.victory;
      const R = { victory: v, xp: 0, credits: 0, shards: 0, items: [], notes: [], levelUps: [], mastery: null, firstClear: false, bonusDone: false, mode: this.mode };
      const tier = this.tier;
      const cfg = this.cfg;
      const stats = this.stats;
      s.stats.matches++;
      s.stats.kills += stats.kills; s.stats.parries += stats.parries; s.stats.finishers += stats.finishers;
      s.stats.playTime += this.time;
      if (v) s.stats.wins++;

      if (this.mode === 'campaign') {
        const st = cfg.stage;
        const isBoss = !!st.boss;
        const first = !s.campaign.cleared[st.id];
        R.xp = isBoss ? 380 * tier : 110 + 40 * tier;
        R.credits = isBoss ? 550 * tier : 140 * tier;
        R.shards = isBoss ? 25 * tier : 4 * tier;
        if (v) {
          if (first) { R.firstClear = true; R.xp *= 1.6; R.credits *= 1.6; R.notes.push('First clear bonus'); }
          s.campaign.cleared[st.id] = (s.campaign.cleared[st.id] || 0) + 1;
          if (isBoss) s.campaign.bosses[st.boss] = true;
          if (cfg.bonus && this.goalMet(cfg.bonus)) {
            R.bonusDone = true;
            const firstBonus = !s.campaign.bonus[st.id];
            s.campaign.bonus[st.id] = true;
            R.credits += firstBonus ? 200 * tier : 60 * tier; R.shards += firstBonus ? 12 : 4;
            R.notes.push((firstBonus ? 'Bonus objective complete: ' : 'Bonus objective: ') + cfg.bonus.text);
          }
          const dropChance = isBoss ? 1 : 0.55;
          if (Math.random() < dropChance) R.items.push(SP.Items.rollDrop(s, tier, isBoss ? 1 : 0, isBoss ? (first ? 3 : 2) : 0));
          if (isBoss && first) R.notes.push(SP.BOSSES[st.boss].name + ' defeated');
        }
      } else if (this.mode === 'survival') {
        const w = stats.wavesCleared;
        R.xp = 45 * w; R.credits = 70 * w + Math.round(stats.score / 40); R.shards = 2 * w;
        for (let i = 5; i <= w; i += 5) R.items.push(SP.Items.rollDrop(s, Math.min(3, 1 + Math.floor(i / 6)), i >= 10 ? 1 : 0));
        if (w > s.survival.bestWave || stats.score > s.survival.bestScore) R.notes.push('New personal best!');
        s.survival.bestWave = Math.max(s.survival.bestWave, w);
        s.survival.bestScore = Math.max(s.survival.bestScore, stats.score);
        R.survival = { waves: w, score: stats.score };
      } else if (this.mode === 'bossrush') {
        const n = stats.wavesCleared;
        R.xp = 300 * n; R.credits = 500 * n; R.shards = 18 * n;
        if (v) { R.items.push(SP.Items.rollDrop(s, 3, 2, 3)); s.bossRush.cleared = true; R.notes.push('Boss Rush cleared'); }
        s.bossRush.best = Math.max(s.bossRush.best, n);
      } else if (this.mode === 'duel') {
        const spec = cfg.waves[0][0];
        const practice = spec.arch === 'drone';
        if (practice) { R.notes.push('Training drone: practice only, no rewards'); }
        else if (v) { R.xp = spec.boss ? 200 : 60; R.credits = spec.boss ? 250 : 70; R.shards = spec.boss ? 8 : 2; R.notes.push('Duel Simulator pays reduced rewards'); }
      } else if (this.mode === 'challenge') {
        const ch = cfg.challenge;
        const done = v && this.goalMet(ch.goal);
        const first = done && !(s.challenges[ch.id] && s.challenges[ch.id].done);
        if (done) {
          R.bonusDone = true;
          R.xp = 150; R.credits = first ? ch.reward.credits : Math.round(ch.reward.credits * 0.25); R.shards = first ? ch.reward.shards : Math.round(ch.reward.shards * 0.25);
          if (first) { R.firstClear = true; R.items.push(SP.Items.rollDrop(s, 2, 1, 1)); R.notes.push('Challenge complete: ' + ch.name); }
          else R.notes.push('Challenge repeated (25% reward)');
          s.challenges[ch.id] = { done: true, best: Math.min((s.challenges[ch.id] || {}).best || 1e9, Math.round(this.time)) };
        } else R.notes.push(v ? 'Challenge objective not met' : 'Challenge failed');
      }
      if (!v && this.mode !== 'survival' && this.mode !== 'bossrush') { R.xp *= 0.3; R.credits *= 0.25; R.shards = 0; R.items = []; if (this.mode !== 'duel') R.notes.push('Defeat: consolation rewards'); }
      if (this.mode !== 'duel' || !cfg.waves[0][0].arch || cfg.waves[0][0].arch !== 'drone') {
        R.xp *= D.reward; R.credits *= D.reward; R.shards *= D.reward;
      }
      R.xp = Math.round(R.xp); R.credits = Math.round(R.credits); R.shards = Math.round(R.shards);
      // apply
      s.credits += R.credits; s.shards += R.shards;
      for (const it of R.items) { s.inventory.push(it); if (it.kind === 'armor' && !s.unlockedStyles.includes(it.style)) { s.unlockedStyles.push(it.style); R.notes.push('Style unlocked: ' + styleName(it.slot, it.style)); } }
      // xp & level
      s.xp += R.xp;
      while (s.xp >= SP.xpToNext(s.level) && s.level < 60) {
        s.xp -= SP.xpToNext(s.level); s.level++;
        const bonus = 100 * s.level; s.credits += bonus; s.shards += 5;
        R.levelUps.push({ level: s.level, credits: bonus, unlocks: SP.LEVEL_UNLOCKS[s.level] || [] });
      }
      // mastery (not for loaners or drones)
      const fam = this.loadout.family;
      const mxp = Math.round(stats.dealt * 0.45 + stats.kills * 25 + (v ? 40 : 0));
      if (mxp > 0 && !(cfg.waves && cfg.waves[0] && cfg.waves[0][0] && cfg.waves[0][0].arch === 'drone')) {
        const before = SP.Items.masteryLevel(s.mastery[fam] || 0);
        s.mastery[fam] = (s.mastery[fam] || 0) + mxp;
        const after = SP.Items.masteryLevel(s.mastery[fam]);
        R.mastery = { family: fam, gained: mxp, level: after, up: after > before, perk: after > before ? SP.MASTERY_PERKS[after - 1] : null };
      }
      R.time = this.time;
      R.stats = Object.assign({}, stats);
      this.result = R;
      SP.Save.save();
      Game.state = 'results';
      SP.Input.setActive(false);
      SP.UI.showResults(this, R);
      if (R.levelUps.length) SP.Audio.play('levelup'); else if (v) SP.Audio.play('reward');
    }

    dispose() {
      for (const f of this.fighters) { if (f.ai) f.ai.dispose(); if (!f.removed) f.dispose(); }
      this.fighters = [];
      SP.Combat.clear();
      G.FX.clear();
    }
  }
  function styleName(slot, id) { const s = SP.STYLES[slot].find((x) => x.id === id); return s ? s.name : id; }
  SP.Match = Match;
})();

      </div>`;

  /* ---------------- equipment ---------------- */

    const slot = p.slot || 'weapon';

    const lo = SP.Items.loadout(s);

  function itemDetail(it, eq) {
    const s = S();
    const lines = SP.Items.describe(it);
    const cmp = eq && eq.id !== it.id ? SP.Items.describe(eq) : null;
    const delta = (l) => {
      if (!cmp) return '';
      const o = cmp.find((x) => x.k === l.k);
      const d = l.value - (o ? o.value : 0);
      if (Math.abs(d) < 1e-4) return '<span class="dz">=</span>';
      return `<span class="${d > 0 ? 'up' : 'dn'}">${d > 0 ? '▲' : '▼'}</span>`;
    };
    const missing = cmp ? cmp.filter((o) => !lines.find((l) => l.k === o.k)) : [];
    const maxL = R[it.rarity].maxLevel;
    const cost = SP.Items.upgradeCost(it);
    const canUp = SP.Items.canUpgrade(s, it);
    const isEq = SP.Items.isEquipped(s, it);
    const sv = SP.Items.salvageValue(it);
    const W = it.kind === 'weapon' ? SP.WEAPONS[it.family] : null;
    return `
      <div class="detail-item r${it.rarity}">
        <div class="row-between"><h3>${itemName(it)}</h3>${rar(it.rarity)}</div>
        <div class="muted small">${slotLabel(it)} · Level ${it.level}/${maxL}${it.kind === 'armor' ? ' · Look: ' + esc((SP.STYLES[it.slot].find((x) => x.id === it.style) || {}).name || it.style) : ''}</div>
        ${W ? `<p class="small">${esc(W.blurb)}</p>` : ''}
        <table class="stt">${lines.map((l) => `<tr><td>${esc(l.label)}</td><td>${l.fmt(l.value)} ${delta(l)}</td></tr>`).join('')}${missing.map((o) => `<tr class="lost"><td>${esc(o.label)}</td><td>— <span class="dn">▼</span></td></tr>`).join('')}</table>
        ${it.mods.length ? `<div class="mods">${it.mods.map((m) => { const mi = SP.Items.modInfo(m); return `<div class="mod ${SP.LEGENDARY_MODS[m] ? 'leg' : ''}"><b>${esc(mi.name)}</b> ${esc(mi.desc)}</div>`; }).join('')}</div>` : ''}
        ${cmp ? `<p class="muted small">▲▼ compared with equipped ${esc(eq.name)}</p>` : ''}
        <div class="actions">
          <button class="btn primary" data-a="equipItem" data-v="${it.id}" ${isEq ? 'disabled' : ''}>${isEq ? 'Equipped' : 'Equip'}</button>
          <button class="btn" data-a="upgradeItem" data-v="${it.id}" ${it.level >= maxL ? 'disabled' : ''}>${it.level >= maxL ? 'Max level' : `Upgrade ◆${cost.credits} ⬢${cost.shards}`}</button>
          <button class="btn danger ghost" data-a="salvageItem" data-v="${it.id}" ${isEq ? 'disabled' : ''}>Salvage +⬢${sv.shards}</button>
        </div>
        ${!canUp && it.level < maxL ? '<p class="muted small">Not enough credits or shards to upgrade.</p>' : ''}
      </div>`;
  }

            <div><b>${s.bossRush.best}</b><span>Boss Rush best</span></div>

            <div><b>${U.fmt(s.stats.kills)}</b><span>Enemies defeated</span></div>
            <div><b>${U.fmt(s.stats.parries)}</b><span>Parries</span></div>
            <div><b>${U.fmt(s.stats.finishers)}</b><span>Finishers</span></div>
            <div><b>${Math.round(s.stats.playTime / 60)}m</b><span>Time in arena</span></div>
            <div><b>${s.inventory.length}</b><span>Items owned</span></div>
          </div>
        </div>
        <div class="split2">
          <div class="panel"><h3>Level rewards</h3><p class="muted small">Every level grants credits and shards. These levels unlock more:</p>
            <ul class="plain unlocks">${nextUnlocks.map((l) => `<li class="${s.level >= l ? 'ok' : ''}"><b>Lv ${l}</b> ${SP.LEVEL_UNLOCKS[l].map(esc).join(' · ')}</li>`).join('')}</ul></div>
          <div class="panel"><h3>Weapon mastery</h3>${SP.WEAPON_ORDER.map((f) => { const x = s.mastery[f] || 0, l = SP.Items.masteryLevel(x), n = SP.MASTERY_LEVELS[l]; return `<div class="mrow"><span>${SP.WEAPONS[f].name}</span><b>M${l}</b>${bar(n ? (x - SP.MASTERY_LEVELS[l - 1]) / (n - SP.MASTERY_LEVELS[l - 1]) : 1)}</div>`; }).join('')}</div>
        </div>
      </div>`;
  };

  /* ---------------- settings ---------------- */
  SCREENS.settings = (p) => {
    const s = S(), st = s.settings;
    const tab = p.tab || 'game';
    const tabs = [['game', 'Game'], ['graphics', 'Graphics'], ['audio', 'Audio'], ['controls', 'Controls'], ['touch', 'Touch'], ['save', 'Save data']];
    const seg = (k, opts) => `<div class="seg wrap">${opts.map(([v, n]) => `<button class="${st[k] === v ? 'on' : ''}" data-a="set" data-k="${k}" data-v="${v}">${n}</button>`).join('')}</div>`;
    const tog = (k, label) => `<label class="tog"><input type="checkbox" data-k="${k}" class="setChk" ${st[k] ? 'checked' : ''}><span>${label}</span></label>`;
    const rng = (k, label, min, max, step, fmt) => `<label class="fld range"><span>${label}<b>${fmt(st[k])}</b></span><input type="range" class="setRng" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${st[k]}"></label>`;
    let body = '';
    if (tab === 'game') body = `<h4>Difficulty</h4>${diffPicker(st.difficulty)}<p class="muted small">${diffNote(st.difficulty)}</p>
      ${tog('autoLock', 'Auto lock-on to the next enemy')}${tog('screenShake', 'Screen shake and vibration')}
      ${rng('camSens', 'Camera sensitivity', 0.3, 2.5, 0.05, (v) => v.toFixed(2))}${tog('invertY', 'Invert camera Y')}${rng('camDist', 'Camera distance', 3.5, 10, 0.1, (v) => v.toFixed(1) + 'm')}
      <button class="btn" data-a="howto">How to play</button>`;
    if (tab === 'graphics') body = `<h4>Quality</h4>${seg('quality', [['auto', 'Auto'], ['low', 'Low'], ['medium', 'Medium'], ['high', 'High']])}
      <p class="muted small">Auto picks Medium on phones and High on computers, then lowers resolution if the frame rate drops. Low disables shadows and cuts particles and crowd detail.</p>${tog('showFps', 'Show frame rate')}`;
    if (tab === 'audio') body = `${tog('muted', 'Mute all sound')}${rng('master', 'Master volume', 0, 1, 0.05, (v) => Math.round(v * 100) + '%')}${rng('sfx', 'Effects volume', 0, 1, 0.05, (v) => Math.round(v * 100) + '%')}<button class="btn" data-a="testSound">Play test sound</button>`;
    if (tab === 'controls') {
      const acts = [['forward', 'Move forward'], ['back', 'Move back'], ['left', 'Move left'], ['right', 'Move right'], ['light', 'Light attack'], ['heavy', 'Heavy attack'], ['block', 'Block / parry'], ['dodge', 'Dodge'], ['jump', 'Jump'], ['sprint', 'Sprint'], ['skill', 'Weapon skill'], ['ab0', 'Cybernetic 1'], ['ab1', 'Cybernetic 2'], ['mom', 'Momentum'], ['lock', 'Lock-on'], ['pause', 'Pause'], ['camLeft', 'Camera left'], ['camRight', 'Camera right'], ['camUp', 'Camera up'], ['camDown', 'Camera down']];
      body = `<p class="muted small">Click a binding, then press a key or mouse button. Esc cancels. Binding a key already in use swaps the two.</p>
        <div class="binds">${acts.map(([a, n]) => `<div class="bind"><span>${n}</span><button class="btn small key ${p.remap === a ? 'wait' : ''}" data-a="remap" data-v="${a}">${p.remap === a ? 'Press a key…' : esc(SP.Input.keyName(s.keybinds[a]))}</button></div>`).join('')}</div>
        <button class="btn ghost" data-a="resetKeys">Restore default keys</button>`;
    }
    if (tab === 'touch') body = `<h4>Touch controls</h4>${seg('touch', [['auto', 'Auto'], ['on', 'Always on'], ['off', 'Off']])}
      ${rng('touchScale', 'Button size', 0.75, 1.4, 0.05, (v) => Math.round(v * 100) + '%')}${tog('leftHanded', 'Left-handed layout (buttons on the left)')}
      <div class="row"><button class="btn" data-a="editLayout">Edit button layout</button><button class="btn ghost" data-a="resetLayout">Reset layout</button></div>
      <p class="muted small">In layout editing, drag buttons anywhere and tap Done.</p>`;
    if (tab === 'save') body = `
      <p>Progress saves automatically after every fight and change. ${SP.Store.ok ? 'Saves are stored in this browser only; they do not sync to other devices or other copies of this page.' : '<b>Browser storage is unavailable here.</b> Progress lasts only until you close the page. Export a save code to keep it.'}</p>
      ${SP.Save.lastSaved ? `<p class="muted small">Last saved ${new Date(SP.Save.lastSaved).toLocaleTimeString()}</p>` : ''}
      <div class="row"><button class="btn primary" data-a="manualSave">Save now</button><button class="btn" data-a="exportSave">Export save code</button><button class="btn" data-a="importSave">Import save code</button></div>
      <div id="saveBox"></div>
      <h4>Danger zone</h4><button class="btn danger" data-a="resetAsk">Erase all progress</button>`;
    return `${topbar('Settings')}
      <div class="content narrow">
        <div class="panel">
          <div class="tabs">${tabs.map(([id, n]) => `<button class="${id === tab ? 'on' : ''}" data-a="setTab" data-v="${id}">${n}</button>`).join('')}</div>
          <div class="tabbody">${body}</div>
        </div>
        <p class="muted small center">SHATTERPOINT ${SP.VERSION} · single-player · no online features</p>
      </div>`;
  };

  /* ---------------- results ---------------- */
  UI.showResults = function (match, Rz) {
    const s = S();
    const st = Rz.stats;
    const cfg = match.cfg;
    let next = null;
    if (cfg.mode === 'campaign' && Rz.victory) {
      let si = cfg.si, ti = cfg.ti + 1;
      if (ti >= SP.CAMPAIGN[si].stages.length) { si++; ti = 0; }
      if (si < SP.CAMPAIGN.length && UI.stageUnlocked(si, ti)) next = [si, ti];
    }
    UI.lastNext = next;
    const need = SP.xpToNext(s.level);
    const head = cfg.mode === 'survival' ? `Survived ${Rz.survival.waves} wave${Rz.survival.waves === 1 ? '' : 's'}` : Rz.victory ? 'Victory' : 'Defeat';
    UI.modal(`
      <div class="panel modalbox results ${Rz.victory ? 'win' : 'lose'}">
        <div class="eyebrow">${esc(cfg.title || '')}${cfg.subtitle ? ' · ' + esc(cfg.subtitle) : ''}</div>
        <h2>${head}</h2>
        <div class="statgrid small">
          <div><b>${U.fmtTime(Rz.time)}</b><span>Time</span></div>
          <div><b>${U.fmt(st.dealt)}</b><span>Damage dealt</span></div>
          <div><b>${U.fmt(st.taken)}</b><span>Damage taken</span></div>
          <div><b>${st.maxCombo}</b><span>Best combo</span></div>
          <div><b>${st.parries}</b><span>Parries</span></div>
          <div><b>${st.perfects}</b><span>Perfect dodges</span></div>
          <div><b>${st.counters}</b><span>Counters</span></div>
          <div><b>${st.finishers}</b><span>Finishers</span></div>
          ${cfg.mode === 'survival' ? `<div><b>${U.fmt(Rz.survival.score)}</b><span>Score</span></div>` : ''}
        </div>
        <h4>Rewards</h4>
        <div class="rewards"><span class="xp">+${U.fmt(Rz.xp)} XP</span><span class="cr">◆ +${U.fmt(Rz.credits)}</span><span class="sh">⬢ +${U.fmt(Rz.shards)}</span></div>
        <div class="lvl">Level ${s.level} ${bar(s.xp / need, 'xp')}</div>
        ${Rz.levelUps.map((l) => `<div class="levelup">LEVEL UP → ${l.level} <small>+◆${l.credits} +⬢5</small>${l.unlocks.length ? '<ul>' + l.unlocks.map((u) => '<li>' + esc(u) + '</li>').join('') + '</ul>' : ''}</div>`).join('')}
        ${Rz.mastery ? `<p class="small">${SP.WEAPONS[Rz.mastery.family].name} mastery +${Rz.mastery.gained}${Rz.mastery.up ? ` · <b class="ok">Mastery ${Rz.mastery.level}: ${esc(Rz.mastery.perk)}</b>` : ''}</p>` : ''}
        ${Rz.items.length ? `<h4>Gear acquired</h4><div class="drops">${Rz.items.map((it) => `<div class="itm r${it.rarity}"><span class="ico">${itemIcon(it)}</span><span class="nm">${esc(it.name)}</span><span class="sub">${rar(it.rarity)} ${slotLabel(it)}</span></div>`).join('')}</div>` : ''}
        ${Rz.notes.length ? `<ul class="notes">${Rz.notes.map((n) => '<li>' + esc(n) + '</li>').join('')}</ul>` : ''}
        <div class="actions">
          ${next ? '<button class="btn primary" data-a="nextStage" autofocus>Next fight</button>' : ''}
          <button class="btn ${next ? '' : 'primary'}" data-a="retry" ${next ? '' : 'autofocus'}>${Rz.victory ? 'Fight again' : 'Retry'}</button>
          ${Rz.items.length ? '<button class="btn" data-a="toEquip">Equipment</button>' : ''}
          <button class="btn ghost" data-a="toMenu">Continue</button>
        </div>
      </div>`);
  };

  /* =================================================================
     Actions
     ================================================================= */
  const ACT = {
    back: () => {
      if (UI.cur === 'character' && UI.charSnapshot && UI.charSnapshot !== JSON.stringify(S().appearance)) {
        S().appearance = JSON.parse(UI.charSnapshot); SP.Game.preview.dirty = true; UI.toast('Unsaved appearance changes discarded');
      }
      UI.back();
    },
    go: (d) => UI.go(d.s),
    enter: () => { SP.Audio.init(); if (!S().stats.matches && SP.Save.status !== 'loaded') { UI.stack = ['main'].map((x) => [x, {}]); UI.go('character', { tab: 'identity', fresh: true }, true); } else UI.go('main', {}, true); },
    lockedMsg: (d) => { SP.Audio.play('error'); UI.toast(d.m || 'Locked'); },
    setDiff: (d) => { S().settings.difficulty = d.d; save(); UI.render(); },
    selStage: (d) => { UI.sel.campaign = [+d.si, +d.ti]; UI.params = { sel: UI.sel.campaign }; UI.render(); },
    startStage: () => { const [si, ti] = UI.sel.campaign || [0, 0]; SP.Game.start(UI.campaignCfg(si, ti)); },
    survArena: (d) => { UI.params = { arena: d.v }; UI.render(); },
    startSurvival: (d) => SP.Game.start({ mode: 'survival', arena: d.v, title: 'SURVIVAL', subtitle: SP.ARENAS[d.v].name, tier: 1 }),
    startBossRush: () => {
      const b = ['warden', 'phantom', 'archon'].filter((x) => S().campaign.bosses[x]);
      SP.Game.start({ mode: 'bossrush', arena: 'sim', waves: b.map((x) => [{ boss: x }]), title: 'BOSS RUSH', subtitle: b.length + ' bosses', tier: 3 });
    },
    duelOpp: (d) => { UI.sel.duel.opp = d.v; UI.sel.duel.weapon = 'random'; UI.render(); },
    duelWeapon: (d) => { UI.sel.duel.weapon = d.v; UI.render(); },
    duelDiff: (d) => { UI.sel.duel.diff = d.d; UI.render(); },
    duelArena: (d) => { UI.sel.duel.arena = d.v; UI.render(); },
    startDuel: () => {
      const d = UI.sel.duel;
      const spec = SP.BOSSES[d.opp] ? { boss: d.opp } : { arch: d.opp, weapon: d.weapon === 'random' ? U.pick(SP.ARCHETYPES[d.opp].weapons) : d.weapon };
      SP.Game.start({ mode: 'duel', arena: d.arena, waves: [[spec]], difficulty: d.diff, title: 'DUEL', subtitle: enemyLabel(spec), tier: spec.boss ? 3 : 2 });
    },
    startChallenge: (d) => {
      const c = SP.CHALLENGES.find((x) => x.id === d.v);
      SP.Game.start({ mode: 'challenge', arena: c.arena, waves: c.waves, weapon: c.weapon, goal: c.goal, challenge: c, title: c.name, subtitle: 'Challenge', tier: 2 });
    },
    /* character */
    charTab: (d) => { UI.params = Object.assign({}, UI.params, { tab: d.v, keepZoom: true }); UI.render(); },
    apSet: (d) => { S().appearance[d.k] = +d.v; SP.Game.preview.dirty = true; UI.params.keepZoom = true; UI.render(); },
    styleSet: (d) => { S().appearance.styles[d.k] = d.v; SP.Game.preview.dirty = true; UI.params.keepZoom = true; UI.render(); },
    styleBuy: (d) => {
      const st = SP.STYLES[d.k].find((x) => x.id === d.v);
      if (S().credits < st.cost) { SP.Audio.play('error'); UI.toast(`You need ◆${st.cost} credits for ${st.name}.`); return; }
      S().credits -= st.cost; S().unlockedStyles.push(st.id); S().appearance.styles[d.k] = st.id;
      save(); SP.Audio.play('buy'); UI.toast(st.name + ' unlocked'); SP.Game.preview.dirty = true; UI.params.keepZoom = true; UI.render();
    },
    colorSet: (d) => { S().appearance.colors[d.k] = d.v; SP.Game.preview.dirty = true; UI.params.keepZoom = true; UI.render(); },
    charSave: () => {
      const n = $('nameIn');
      if (n) S().name = sanitizeName(n.value);
      save(); SP.Audio.play('buy'); UI.toast('Fighter saved');
      UI.charSnapshot = JSON.stringify(S().appearance);
      if (UI.params.fresh) UI.home(); else UI.back();
    },
    charRevert: () => {
      if (UI.charSnapshot) { S().appearance = JSON.parse(UI.charSnapshot); SP.Game.preview.dirty = true; UI.params.keepZoom = true; UI.render(); UI.toast('Changes reverted'); }
    },
    zoom: (d) => { SP.Game.preview.zoom = U.clamp(SP.Game.preview.zoom + (+d.v) * 0.25, 0.8, 2.6); },
    rot: () => { SP.Game.preview.yaw += Math.PI / 4; },
    /* equipment */
    selSlot: (d) => { UI.params = { slot: d.v }; UI.render(); },
    selItem: (d) => { UI.params = Object.assign({}, UI.params, { item: d.v }); UI.render(); },
    equipItem: (d) => {
      const it = SP.Items.get(S(), d.v); if (!it) return;
      S().equipped[it.kind === 'weapon' ? 'weapon' : it.slot] = it.id;
      save(); SP.Audio.play('buy'); SP.Game.preview.dirty = true; UI.render();
    },
    upgradeItem: (d) => {
      const it = SP.Items.get(S(), d.v); if (!it) return;
      if (!SP.Items.upgrade(S(), it)) { SP.Audio.play('error'); UI.toast('Not enough credits or shards.'); return; }
      save(); SP.Audio.play('buy'); UI.toast(it.name + ' upgraded to level ' + it.level); UI.render();
    },
    salvageItem: (d) => {
      const it = SP.Items.get(S(), d.v); if (!it) return;
      UI.modal(`<div class="panel modalbox"><h3>Salvage ${esc(it.name)}?</h3><p>You will get ⬢${SP.Items.salvageValue(it).shards} shards and ◆${SP.Items.salvageValue(it).credits} credits. This cannot be undone.</p>
        <div class="actions"><button class="btn danger" data-a="salvageYes" data-v="${it.id}">Salvage</button><button class="btn" data-a="closeModal" autofocus>Keep it</button></div></div>`);
    },
    salvageYes: (d) => { const it = SP.Items.get(S(), d.v); if (it && SP.Items.salvage(S(), it)) { save(); SP.Audio.play('buy'); UI.toast('Salvaged'); } UI.closeModal(); UI.params.item = null; UI.render(); },
    buyCache: () => {
      const s = S();
      if (s.credits < SP.CACHE_COST) { SP.Audio.play('error'); UI.toast(`A Data Cache costs ◆${SP.CACHE_COST}.`); return; }
      s.credits -= SP.CACHE_COST;
      const tier = 1 + Object.keys(s.campaign.bosses).length;
      const it = SP.Items.rollDrop(s, Math.min(3, tier), 1, 1);
      s.inventory.push(it);
      if (it.kind === 'armor' && !s.unlockedStyles.includes(it.style)) s.unlockedStyles.push(it.style);
      save(); SP.Audio.play('reward');
      UI.toast(`Cache opened: ${it.name} (${R[it.rarity].name})`, 'r' + it.rarity);
      UI.params = { slot: it.kind === 'weapon' ? 'weapon' : it.slot, item: it.id }; UI.render();
    },
    abEquip: (d) => {
      const sl = S().abilities.slots, i = +d.i, other = 1 - i;
      if (sl[other] === d.v) sl[other] = sl[i];
      sl[i] = d.v; save(); SP.Audio.play('ui'); UI.render();
    },
    abBuy: (d) => {
      const A = SP.ABILITIES[d.v], s = S();
      if (s.level < A.level) return;
      if (s.credits < A.cost) { SP.Audio.play('error'); UI.toast(`You need ◆${A.cost} credits.`); return; }
      s.credits -= A.cost; s.abilities.owned[d.v] = 1;
      if (!s.abilities.slots[1]) s.abilities.slots[1] = d.v;
      save(); SP.Audio.play('buy'); UI.toast(A.name + ' installed'); UI.render();
    },
    abUp: (d) => {
      const s = S(), mk = s.abilities.owned[d.v];
      const c = 400 * mk, sh = 15 * mk;
      if (s.credits < c || s.shards < sh) { SP.Audio.play('error'); UI.toast(`Upgrading needs ◆${c} and ⬢${sh}.`); return; }
      s.credits -= c; s.shards -= sh; s.abilities.owned[d.v] = mk + 1;
      save(); SP.Audio.play('buy'); UI.toast(SP.ABILITIES[d.v].name + ' Mk ' + ['I', 'II', 'III'][mk]); UI.render();
    },
    /* weapons */
    selFam: (d) => { UI.params = { fam: d.v }; UI.render(); },
    buyWeapon: (d) => {
      const s = S(), sh = SP.SHOP_WEAPONS[d.v];
      if (s.level < sh.level) return;
      if (s.credits < sh.cost) { SP.Audio.play('error'); UI.toast(`You need ◆${sh.cost} credits.`); return; }
      s.credits -= sh.cost;
      const it = SP.Items.makeWeapon(d.v, 0); s.inventory.push(it);
      save(); SP.Audio.play('buy'); UI.toast(it.name + ' added to your inventory'); UI.render();
    },
    equipBestFam: (d) => {
      const s = S();
      const best = s.inventory.filter((i) => i.kind === 'weapon' && i.family === d.v).sort((a, b) => SP.Items.weaponPower(b) - SP.Items.weaponPower(a))[0];
      if (best) { s.equipped.weapon = best.id; save(); SP.Audio.play('buy'); SP.Game.preview.dirty = true; UI.toast(best.name + ' equipped'); UI.render(); }
    },
    variant: (d, el) => {
      if (el.dataset.lock) { SP.Audio.play('error'); UI.toast(el.dataset.lock); return; }
      const s = S(); s.weaponVariant = s.weaponVariant || {}; s.weaponVariant[d.f] = d.v; save(); SP.Game.preview.dirty = true; UI.render();
    },
    /* settings */
    setTab: (d) => { UI.params = { tab: d.v }; UI.render(); },
    set: (d) => {
      const st = S().settings;
      st[d.k] = d.v; save();
      if (d.k === 'quality') { SP.G.applyQuality(); SP.Game.preview.dirty = true; }
      if (d.k === 'touch') { SP.Input.touchMode = d.v === 'on' || (d.v === 'auto' && SP.G.isMobile); }
      UI.render();
    },
    testSound: () => { SP.Audio.init(); SP.Audio.play('parry'); },
    remap: (d) => {
      UI.params = Object.assign({}, UI.params, { remap: d.v }); UI.render();
      SP.Input.remapCb = (code) => {
        const kb = S().keybinds;
        if (code) {
          const other = Object.keys(kb).find((k) => kb[k] === code && k !== d.v);
          if (other) kb[other] = kb[d.v];
          kb[d.v] = code; save();
        }
        UI.params = Object.assign({}, UI.params, { remap: null }); UI.render();
      };
    },
    resetKeys: () => { S().keybinds = SP.defaultKeybinds(); save(); UI.toast('Default keys restored'); UI.render(); },
    editLayout: () => {
      SP.Input.editLayout = true;
      $('ui').hidden = true; $('touch').hidden = false; $('touch').classList.add('editing');
      document.querySelectorAll('#touch .tbtn').forEach((b) => { b.hidden = false; });
      $('layoutDone').hidden = false;
    },
    resetLayout: () => { S().touchLayout = {}; save(); SP.Input.applyTouchLayout(); UI.toast('Touch layout reset'); },
    manualSave: () => { if (SP.Save.save()) UI.toast('Saved'); else UI.toast('Saving is not available in this browser. Export a save code instead.', 'warn'); UI.render(); },
    exportSave: () => {
      const code = SP.Save.exportString();
      $('saveBox').innerHTML = `<label class="fld"><span>Your save code (keep it somewhere safe)</span><textarea id="saveCode" rows="4" readonly>${esc(code)}</textarea></label><button class="btn small" data-a="copySave">Copy code</button>`;
      const ta = $('saveCode'); ta.focus(); ta.select();
    },
    copySave: () => {
      const ta = $('saveCode');
      navigator.clipboard && navigator.clipboard.writeText(ta.value).then(() => UI.toast('Copied'), () => { ta.focus(); ta.select(); UI.toast('Select the text and copy it manually'); });
      if (!navigator.clipboard) { ta.focus(); ta.select(); UI.toast('Select the text and copy it manually'); }
    },
    importSave: () => {
      $('saveBox').innerHTML = `<label class="fld"><span>Paste a save code. This replaces your current progress.</span><textarea id="saveIn" rows="4" placeholder="SP1:..."></textarea></label><button class="btn small primary" data-a="importYes">Import</button>`;
      $('saveIn').focus();
    },
    importYes: () => {
      try { SP.Save.importString($('saveIn').value); SP.G.applyQuality(); SP.Input.applyTouchLayout(); SP.Audio.applySettings(); SP.Game.preview.dirty = true; UI.toast('Save imported'); UI.home(); }
      catch (e) { SP.Audio.play('error'); UI.toast(e.message, 'warn'); }
    },
    resetAsk: () => UI.modal(`<div class="panel modalbox"><h3>Erase all progress?</h3><p>Your fighter, gear, levels and records will be deleted from this browser. Export a save code first if you might want them back.</p>
      <div class="actions"><button class="btn danger" data-a="resetYes">Erase everything</button><button class="btn" data-a="closeModal" autofocus>Cancel</button></div></div>`),
    resetYes: () => { SP.Save.reset(); UI.closeModal(); SP.G.applyQuality(); SP.Input.applyTouchLayout(); SP.Game.preview.dirty = true; UI.stack = []; UI.cur = 'title'; UI.render(); UI.toast('Progress erased'); },
    closeModal: () => UI.closeModal(),
    /* in-game */
    resume: () => { UI.closeModal(); SP.Game.resume(); },
    restart: () => { UI.closeModal(); SP.Game.restart(); },
    howto: () => UI.tutorial(false),
    closeHowto: () => {
      S().seenTutorial = true; save();
      if (SP.Game.state === 'paused' && UI.tutPaused) { UI.tutPaused = false; UI.closeModal(); SP.Game.state = 'playing'; SP.Input.setActive(true); return; }
      if (SP.Game.state === 'paused') { UI.showPause(); return; }
      UI.closeModal();
    },
    pauseSettings: () => {
      UI.modal(`<div class="panel modalbox"><h2>Quick settings</h2>
        <label class="fld range"><span>Camera sensitivity<b>${S().settings.camSens.toFixed(2)}</b></span><input type="range" class="setRng" data-k="camSens" min="0.3" max="2.5" step="0.05" value="${S().settings.camSens}"></label>
        <label class="fld range"><span>Master volume<b>${Math.round(S().settings.master * 100)}%</b></span><input type="range" class="setRng" data-k="master" min="0" max="1" step="0.05" value="${S().settings.master}"></label>
        <label class="tog"><input type="checkbox" class="setChk" data-k="muted" ${S().settings.muted ? 'checked' : ''}><span>Mute</span></label>
        <label class="tog"><input type="checkbox" class="setChk" data-k="screenShake" ${S().settings.screenShake ? 'checked' : ''}><span>Screen shake</span></label>
        <label class="tog"><input type="checkbox" class="setChk" data-k="invertY" ${S().settings.invertY ? 'checked' : ''}><span>Invert camera Y</span></label>
        <div class="seg">${['low', 'medium', 'high'].map((q) => `<button class="${SP.G.quality === q && S().settings.quality !== 'auto' ? 'on' : ''}" data-a="quickQuality" data-v="${q}">${q[0].toUpperCase() + q.slice(1)}</button>`).join('')}</div>
        <button class="btn primary" data-a="pauseBack" autofocus>Back</button></div>`);
    },
    quickQuality: (d) => { S().settings.quality = d.v; save(); SP.G.applyQuality(); ACT.pauseSettings(); },
    pauseBack: () => UI.showPause(),
    quitAsk: () => UI.modal(`<div class="panel modalbox"><h3>Quit this fight?</h3><p>You will forfeit the fight and earn no rewards.</p>
      <div class="actions"><button class="btn danger" data-a="quitYes">Quit</button><button class="btn" data-a="pauseBack" autofocus>Keep fighting</button></div></div>`),
    quitYes: () => { UI.closeModal(); SP.Game.quitToMenu(); UI.render(); },
    nextStage: () => { UI.closeModal(); const [si, ti] = UI.lastNext; UI.sel.campaign = [si, ti]; SP.Game.start(UI.campaignCfg(si, ti)); },
    retry: () => { UI.closeModal(); SP.Game.restart(); },
    toEquip: () => { UI.closeModal(); SP.Game.quitToMenu(); UI.stack = [['main', {}]]; UI.cur = 'equipment'; UI.params = {}; UI.render(); },
    toMenu: () => {
      UI.closeModal();
      const mode = SP.Game.match && SP.Game.match.cfg.mode;
      SP.Game.quitToMenu();
      const target = { campaign: 'campaign', survival: 'survival', bossrush: 'bossrush', duel: 'duel', challenge: 'challenges' }[mode] || 'main';
      UI.stack = target === 'main' ? [] : [['main', {}], ['play', {}]];
      UI.cur = target; UI.params = {}; UI.render();
    },
  };
  UI.ACT = ACT;

  function sanitizeName(v) { v = (v || '').toUpperCase().replace(/[^A-Z0-9 _\-.]/g, '').trim().slice(0, 14); return v || 'NOVA'; }

  function onClick(e) {
    const el = e.target.closest('[data-a]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.a];
    if (fn) { e.preventDefault(); fn(el.dataset, el); }
  }
  function onInput(e) {
    const el = e.target;
    if (el.classList.contains('apRange')) {
      S().appearance[el.dataset.k] = +el.value; SP.Game.preview.dirty = true;
      const b = el.parentElement.querySelector('b'); if (b) b.textContent = Math.round(el.value * 100) + '%';
    }
    if (el.classList.contains('setRng')) {
      const k = el.dataset.k; S().settings[k] = +el.value;
      const b = el.parentElement.querySelector('b');
      if (b) b.textContent = k === 'camSens' ? (+el.value).toFixed(2) : k === 'camDist' ? (+el.value).toFixed(1) + 'm' : Math.round(el.value * 100) + '%';
      if (k === 'master' || k === 'sfx') SP.Audio.applySettings();
      if (k === 'touchScale') SP.Input.applyTouchLayout();
    }
    if (el.classList.contains('colorIn')) { S().appearance.colors[el.dataset.k] = el.value; SP.Game.preview.dirty = true; }
    if (el.id === 'nameIn') { /* keep live */ }
  }
  function onChange(e) {
    const el = e.target;
    if (el.classList.contains('setChk')) {
      S().settings[el.dataset.k] = el.checked; save();
      if (el.dataset.k === 'muted') SP.Audio.applySettings();
      if (el.dataset.k === 'leftHanded') SP.Input.applyTouchLayout();
    }
    if (el.classList.contains('setRng') || el.classList.contains('apRange')) save();
    if (el.classList.contains('colorIn')) { save(); UI.params.keepZoom = true; UI.render(); }
    if (el.id === 'nameIn') { S().name = sanitizeName(el.value); }
  }

  /* modal & layout-done listeners (outside #ui) */
  UI.initModal = function () {
    $('modal').addEventListener('click', onClick);
    $('modal').addEventListener('input', onInput);
    $('modal').addEventListener('change', onChange);
    $('layoutDone').addEventListener('click', () => {
      SP.Input.editLayout = false;
      $('touch').classList.remove('editing'); $('touch').hidden = true; $('layoutDone').hidden = true;
      $('ui').hidden = false; UI.toast('Layout saved');
    });
  };

  /* character snapshot for revert */
  const origGo = UI.go;
  UI.go = function (screen, params, noPush) {
    if (screen === 'character') UI.charSnapshot = JSON.stringify(S().appearance);
    origGo(screen, params, noPush);
  };
})();

/* SHATTERPOINT — boot */
'use strict';
(function () {
  function shell() {
    const app = document.getElementById('app');
    app.innerHTML = `
      <canvas id="gl" aria-label="SHATTERPOINT arena"></canvas>
      <div id="hud" class="hud" hidden></div>
      <div id="touch" hidden>
        <div id="stick" hidden><div id="stickKnob"></div></div>
        <button class="tbtn t-light" data-act="light" aria-label="Light attack"><span>LIGHT</span></button>
        <button class="tbtn t-heavy" data-act="heavy" aria-label="Heavy attack"><span>HEAVY</span></button>
        <button class="tbtn t-dodge" data-act="dodge" aria-label="Dodge"><span>DODGE</span></button>
        <button class="tbtn t-jump" data-act="jump" aria-label="Jump"><span>JUMP</span></button>
        <button class="tbtn t-block" data-act="block" aria-label="Block or parry"><span>BLOCK</span></button>
        <button class="tbtn t-skill cdb" data-act="skill" aria-label="Weapon skill"><span>SKILL</span></button>
        <button class="tbtn t-ab0 cdb" data-act="ab0" aria-label="Cybernetic 1"><span>»</span></button>
        <button class="tbtn t-ab1 cdb" data-act="ab1" aria-label="Cybernetic 2"><span>+</span></button>
        <button class="tbtn t-mom cdb" data-act="mom" aria-label="Momentum technique"><span>MOM</span></button>
        <button class="tbtn t-lock" data-act="lock" aria-label="Lock on"><span>◎</span></button>
      </div>
      <button id="layoutDone" class="btn primary" hidden>Done editing</button>
      <div id="banner" class="banner"></div>
      <div id="ui" class="ui"></div>
      <div id="modal" class="modal" hidden></div>
      <div id="toast" class="toast" aria-live="polite"></div>
      <div id="fps" class="fps" hidden></div>
      <div id="rotate" class="rotate">Rotate to landscape for the best experience</div>`;
  }

  function boot() {
    shell();
    SP.Save.load();
    const ok = typeof THREE !== 'undefined' && SP.G.init(document.getElementById('gl'));
    if (!ok) {
      document.getElementById('ui').innerHTML = `<div class="fatal"><h1>SHATTERPOINT</h1><p>This browser could not start 3D graphics (WebGL). Try another browser or enable hardware acceleration.</p></div>`;
      return;
    }
    SP.Input.init(document.getElementById('gl'));
    SP.HUD.build();
    SP.UI.init();
    SP.UI.initModal();
    SP.Bus.on('touchMode', () => { if (SP.Game.state === 'playing') document.getElementById('touch').hidden = false; });
    // unlock audio on first interaction
    const unlock = () => { SP.Audio.init(); };
    window.addEventListener('pointerdown', unlock, { passive: true });
    window.addEventListener('keydown', unlock);
    // autosave on hide
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { SP.Save.save(); if (SP.Game.state === 'playing') SP.Game.pause(); }
    });
    SP.Game.state = 'menu';
    SP.Game.showMenuScene();
    SP.UI.cur = 'title';
    SP.UI.render();
    SP.Game.init();
    window.__SP_READY = true;
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
