<title>Forgeborn</title>
<meta name="description" content="FORGEBORN: Legacy of the Forge - an incremental blacksmith RPG with skill-based forging, mining and turn-based battles.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* FORGEBORN — interface styles.
   Layout: a forge-lit stone hall. Sticky iron header, content column up to 1280px,
   bottom navigation on phones. A deliberate single dark theme (stone, iron, ember, gold, arcane). */
:root {
  --stone-0: #0d0b0a; --stone-1: #16120f; --stone-2: #1f1915; --stone-3: #2a221c; --stone-4: #3a2f26;
  --iron: #6b6158; --line: #4a3c2e; --line-hi: #8a6a3e;
  --text: #efe4cf; --dim: #b4a48c; --faint: #7d6f5d;
  --gold: #e9b65a; --gold-hi: #ffd98a; --ember: #ff8a3a; --ember-deep: #c2441a;
  --arcane: #9a7bff; --frost: #7fd8ff;
  --hp: linear-gradient(90deg, #a8242c, #e8483e); --enemy: linear-gradient(90deg, #6a1a3a, #d8406a);
  --sta: linear-gradient(90deg, #6a8a2a, #b8d84a); --mana: linear-gradient(90deg, #2a3a9a, #6a8aff); --fury: linear-gradient(90deg, #c2441a, #ffd25a);
  --xp: linear-gradient(90deg, #4a3aa8, #9a7bff); --stagger: linear-gradient(90deg, #8a6a2a, #ffcf5a);
  --good: #7fe0a0; --bad: #ff7a6a;
  --f-display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --f-body: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 10px; --r-sm: 6px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--stone-0); color: var(--text); }
body {
  margin: 0; font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(255, 138, 58, 0.13), transparent 60%),
    radial-gradient(900px 500px at 100% 100%, rgba(154, 123, 255, 0.07), transparent 60%),
    var(--stone-0);
  -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--stone-1); }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; letter-spacing: 0.02em; margin: 0 0 0.4em; text-wrap: balance; color: #f6e6c4; }
h1 { font-size: clamp(1.4rem, 3.2vw, 2rem); }
h2 { font-size: clamp(1.15rem, 2.4vw, 1.45rem); }
h3 { font-size: 1.08rem; }
h4 { font-size: 0.98rem; }
p { margin: 0 0 0.6em; }
.muted { color: var(--dim); } .small { font-size: 0.86rem; } .center { text-align: center; }
.gold-text { color: var(--gold-hi); } .good { color: var(--good); } .bad { color: var(--bad); }
.lead { font-size: 1.12rem; color: #f6e6c4; }
.eyebrow { font-family: var(--f-display); font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
.row { display: flex; align-items: center; } .gap { gap: 10px; } .wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
.coin { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c0, #e9b65a 45%, #8a5a1a); box-shadow: 0 0 0 1px #5a3a10; vertical-align: -1px; margin-right: 3px; }
[hidden] { display: none !important; }

/* ---------- panels ---------- */
.panel {
  position: relative; background: linear-gradient(180deg, rgba(42, 34, 28, 0.94), rgba(26, 21, 17, 0.96));
  border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: inset 0 1px 0 rgba(255, 217, 138, 0.08), 0 8px 24px rgba(0, 0, 0, 0.35);
}
.panel::before { content: ""; position: absolute; inset: 3px; border: 1px solid rgba(233, 182, 90, 0.1); border-radius: calc(var(--r) - 3px); pointer-events: none; }
.pad { padding: 16px; }
.section { margin: 18px 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); margin-bottom: 10px; padding-bottom: 6px; flex-wrap: wrap; }
.section-head h3 { margin: 0; }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--dim); text-align: center; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 16px;
  border-radius: var(--r-sm); border: 1px solid var(--line-hi); color: var(--text);
  background: linear-gradient(180deg, #3e3228, #2a211a); box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.14), 0 2px 0 #0008;
  font-weight: 600; transition: transform 0.08s, filter 0.15s, box-shadow 0.15s; user-select: none; touch-action: manipulation;
}
.btn:hover:not(:disabled) { filter: brightness(1.12); }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.1); }
.btn:disabled { opacity: 0.45; }
.btn.primary { background: linear-gradient(180deg, #e9a24a, #b8661e); border-color: #ffcf8a; color: #1e0f04; text-shadow: 0 1px 0 rgba(255, 230, 180, 0.5); }
.btn.danger { background: linear-gradient(180deg, #8a2a22, #5a1612); border-color: #e0604a; }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.btn.ghost.danger { color: #ffab9a; border-color: #7a3a2a; }
.btn.small { min-height: 34px; padding: 5px 11px; font-size: 0.9rem; }
.btn.big { min-height: 50px; padding: 10px 22px; font-size: 1.05rem; }
.btn.full { width: 100%; }
.btn.choice { justify-content: flex-start; text-align: left; width: 100%; }
.icon-btn { background: transparent; border: 1px solid var(--line); border-radius: var(--r-sm); width: 40px; height: 40px; display: grid; place-items: center; color: var(--dim); }
.icon-btn:hover { color: var(--text); border-color: var(--line-hi); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0 12px; }
.tabs button { background: transparent; border: 1px solid var(--line); color: var(--dim); padding: 7px 14px; border-radius: 999px; min-height: 38px; font-weight: 600; }
.tabs button.on { background: linear-gradient(180deg, #4a3a28, #2e241a); color: var(--gold-hi); border-color: var(--line-hi); }
.tabs.small button { padding: 4px 10px; min-height: 32px; font-size: 0.88rem; }
.tag { display: inline-block; font-size: 0.72rem; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line-hi); color: var(--dim); margin-left: 6px; vertical-align: 1px; }
.tag.gold { color: var(--gold-hi); border-color: var(--gold); }
.tag.bad { color: var(--bad); border-color: #7a3a2a; }

/* ---------- chips & lists ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.chips.tight { margin: 4px 0 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 5px; border-radius: 999px; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); font-size: 0.86rem; }
.chip em { color: var(--faint); font-style: normal; }
.chip.short { border-color: #8a3a2a; color: #ffb3a0; }
.chip.grade-chip { padding: 3px 10px; font-weight: 700; }
.list { display: flex; flex-direction: column; gap: 6px; }
.list-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--r-sm); background: rgba(0, 0, 0, 0.22); border: 1px solid rgba(74, 60, 46, 0.7); }
.list-row.locked { opacity: 0.6; }
.list-row.toggle { cursor: pointer; }
.list-row.toggle input { width: 22px; height: 22px; accent-color: var(--gold); }
.col-btns { display: flex; flex-direction: column; gap: 4px; }

/* ---------- bars ---------- */
.bar { position: relative; height: 20px; border-radius: 999px; background: #0a0807; border: 1px solid var(--line); overflow: hidden; margin: 4px 0; }
.bar.small { height: 15px; }
.bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; transition: width 0.35s ease; }
.bar-text { position: relative; display: block; text-align: center; font-family: var(--f-mono); font-size: 0.74rem; line-height: 18px; color: #fff; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.bar.small .bar-text { line-height: 13px; font-size: 0.66rem; }

/* ---------- app shell ---------- */
.app { min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 24px; max-width: 1320px; margin: 0 auto; position: relative; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: center; padding: 10px 0; background: linear-gradient(180deg, var(--stone-1) 70%, rgba(22, 18, 15, 0.9)); border-bottom: 1px solid var(--line); margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: conic-gradient(from 200deg, #ffd98a, #ff8a3a, #c2441a, #ffd98a); clip-path: polygon(50% 0, 100% 30%, 82% 100%, 18% 100%, 0 30%); box-shadow: 0 0 18px rgba(255, 138, 58, 0.6); }
.brand-name { font-family: var(--f-display); font-weight: 900; font-size: 1.25rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-hi); line-height: 1; }
.brand-sub { font-family: var(--f-display); font-size: 0.62rem; letter-spacing: 0.26em; text-transform: uppercase; color: var(--dim); }
.top-stats { display: flex; gap: 14px; justify-content: flex-end; align-items: center; flex-wrap: wrap; font-family: var(--f-mono); font-size: 0.86rem; font-variant-numeric: tabular-nums; }
.ts { display: inline-flex; align-items: center; gap: 4px; color: var(--dim); }
.ts.hp { width: 110px; }
.topnav { grid-column: 1 / -1; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.nav-btn { position: relative; display: flex; align-items: center; gap: 6px; padding: 8px 12px; border: 0; background: transparent; color: var(--dim); border-radius: var(--r-sm); font-weight: 600; white-space: nowrap; }
.nav-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.03); }
.nav-btn.on { color: var(--gold-hi); background: linear-gradient(180deg, rgba(233, 182, 90, 0.14), transparent); box-shadow: inset 0 -2px 0 var(--gold); }
.badge { position: absolute; top: 2px; right: 2px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--ember); color: #1a0a00; font-size: 0.66rem; font-style: normal; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }
.bottomnav { display: none; }
.notice { margin: 10px 0; padding: 8px 12px; border-radius: var(--r-sm); background: rgba(233, 182, 90, 0.1); border: 1px solid var(--gold); font-size: 0.9rem; }
.notice.bad { background: rgba(255, 90, 70, 0.1); border-color: #a04030; }
.goal { display: flex; align-items: center; gap: 8px; width: 100%; margin: 10px 0 0; padding: 7px 12px; text-align: left; border-radius: var(--r-sm); border: 1px solid rgba(233, 182, 90, 0.3); background: rgba(233, 182, 90, 0.06); color: var(--dim); font-size: 0.9rem; }
.goal b { color: var(--gold-hi); }
.main { padding-top: 14px; }
.screen { animation: fadein 0.25s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* embers */
.embers { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.embers span { position: absolute; bottom: -10px; width: 3px; height: 3px; border-radius: 50%; background: #ffb347; box-shadow: 0 0 6px #ff8a3a; opacity: 0; animation: ember 10s linear infinite; }
@keyframes ember { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: 0.8; } 100% { transform: translate(40px, -100vh); opacity: 0; } }
.main, .topbar, .bottomnav, .goal, .notice { position: relative; z-index: 1; }
.topbar { z-index: 40; }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; z-index: 80; background: rgba(5, 3, 2, 0.72); backdrop-filter: blur(3px); display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); animation: fadein 0.18s; }
.modal { width: min(560px, 100%); max-height: 100%; display: flex; flex-direction: column; }
.modal.wide { width: min(860px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 8px; border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; }
.modal-body { padding: 14px 16px 16px; overflow-y: auto; overscroll-behavior: contain; }
.event-hero { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; }
.event-hero > div { min-width: 0; }
.event-text { font-size: 1.05rem; margin: 10px 0; }
.event-result { padding: 10px 12px; border-left: 3px solid var(--gold); background: rgba(233, 182, 90, 0.06); border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.found { font-family: var(--f-display); font-size: 1.1rem; color: var(--gold-hi); }
.welcome-steps { padding-left: 20px; } .welcome-steps li { margin-bottom: 6px; }
.confirm-box { padding: 10px; border: 1px solid #7a3a2a; border-radius: var(--r-sm); background: rgba(120, 30, 20, 0.15); }

/* ---------- toasts & bursts ---------- */
.toasts { position: fixed; z-index: 90; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 70px); display: flex; flex-direction: column; gap: 6px; width: min(340px, calc(100vw - 24px)); pointer-events: none; }
.toast { padding: 9px 12px; border-radius: var(--r-sm); background: rgba(26, 20, 15, 0.96); border: 1px solid var(--line-hi); box-shadow: 0 6px 18px #0009; font-size: 0.9rem; animation: toastin 0.3s ease; }
.toast.level, .toast.upgrade { border-color: var(--gold); color: var(--gold-hi); }
.toast.rare, .toast.discover { border-color: var(--arcane); color: #d8c8ff; }
.toast.quest, .toast.achieve { border-color: var(--good); color: #c8ffd8; }
@keyframes toastin { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.bursts { position: fixed; inset: 0; pointer-events: none; z-index: 85; display: grid; place-items: center; }
.burst { position: absolute; width: 10px; height: 10px; }
.burst i { position: absolute; left: 0; top: 0; width: 6px; height: 22px; border-radius: 3px; background: linear-gradient(#fff6c8, var(--ember)); transform: rotate(var(--a)) translateY(0); animation: ray 1.2s cubic-bezier(.2, .7, .3, 1) var(--d) forwards; opacity: 0; }
.burst.rare i, .burst.region i { background: linear-gradient(#f0e8ff, var(--arcane)); }
.burst.legendary i, .burst.boss i { background: linear-gradient(#fff, #ffcf5a); height: 34px; width: 8px; }
.burst.quest i { background: linear-gradient(#e8fff0, var(--good)); }
@keyframes ray { 0% { opacity: 1; transform: rotate(var(--a)) translateY(0) scaleY(0.4); } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-160px) scaleY(1); } }

/* ---------- WORLD ---------- */
.world-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.map-panel { padding: 8px; overflow: hidden; }
.worldmap { width: 100%; height: auto; display: block; border-radius: 8px; }
.map-help { margin: 6px 4px 0; }
.map-region { font-family: var(--f-display); font-size: 24px; font-weight: 700; fill: #f6e6c4; letter-spacing: 2px; paint-order: stroke; stroke: #0008; stroke-width: 4px; }
.map-region.locked { fill: #8a7d6a; }
.map-sealed { font-family: var(--f-body); font-size: 17px; fill: #b4a48c; }
.map-label { font-family: var(--f-body); font-size: 19px; font-weight: 700; fill: #f3e6cc; paint-order: stroke; stroke: #000a; stroke-width: 4px; pointer-events: none; }
.map-badge { font-family: var(--f-mono); font-size: 11px; font-weight: 700; fill: #1a0a00; }
.map-node { cursor: pointer; outline: none; }
.map-node:hover > circle:nth-child(2), .map-node:focus-visible > circle:nth-child(2) { stroke-width: 4; }
.map-node.here .map-label { fill: var(--gold-hi); }
.loc-panel { overflow: hidden; }
.loc-panel > :not(.scene) { margin-left: 16px; margin-right: 16px; }
.scene { display: block; }
.loc-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.loc-head h2 { margin: 0; }
.hp-mini { width: 150px; }
.loc-desc { color: var(--dim); margin-top: 6px; }
.prog-row { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; font-size: 0.86rem; color: var(--dim); }
.loc-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 16px; align-items: center; }
.boss-brief { display: flex; gap: 12px; align-items: center; padding: 10px; border: 1px solid #6a2a20; border-radius: var(--r-sm); background: rgba(90, 16, 16, 0.18); }
.boss-brief > div { min-width: 0; }
.enemy-strip { display: flex; gap: 8px; flex-wrap: wrap; }
.enemy-mini { display: flex; flex-direction: column; align-items: center; font-size: 0.78rem; color: var(--dim); width: 76px; text-align: center; }
.loc-panel .section:last-child { margin-bottom: 16px; }

/* ---------- FORGE ---------- */
.forge-banner { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
.forge-banner h1 { margin: 0; }
.forge-fire { position: relative; width: 52px; height: 52px; flex: none; }
.forge-fire span { position: absolute; bottom: 0; left: 50%; width: 30px; height: 44px; margin-left: -15px; border-radius: 50% 50% 45% 45% / 65% 65% 35% 35%; background: radial-gradient(circle at 50% 75%, #fff4c8, #ffb347 35%, #e0481a 70%, transparent 72%); animation: flick 1.2s ease-in-out infinite; filter: blur(0.5px); }
.forge-fire span:nth-child(2) { width: 20px; margin-left: -22px; height: 32px; animation-delay: -0.4s; opacity: 0.8; }
.forge-fire span:nth-child(3) { width: 18px; margin-left: 4px; height: 28px; animation-delay: -0.8s; opacity: 0.7; }
.starlit .forge-fire span { background: radial-gradient(circle at 50% 75%, #f4f0ff, #9ab8ff 35%, #7a4aff 70%, transparent 72%); }
@keyframes flick { 0%, 100% { transform: scaleY(1) skewX(0); } 50% { transform: scaleY(1.12) skewX(3deg); } }
.forge-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
.forge-col { min-width: 0; }
.preview-col { position: sticky; top: 120px; }
.preview { padding: 16px; }
.preview-art { display: grid; place-items: center; background: radial-gradient(circle, rgba(255, 138, 58, 0.18), transparent 70%); border-radius: var(--r); }
.preview-head { text-align: center; }
.bp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; }
.bp-card { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px; border-radius: var(--r-sm); border: 1px solid var(--line); background: rgba(0, 0, 0, 0.25); text-align: center; }
.bp-card.on { border-color: var(--gold); background: rgba(233, 182, 90, 0.1); box-shadow: 0 0 0 1px var(--gold) inset; }
.bp-card:disabled { opacity: 0.45; }
.bp-name { font-weight: 700; font-size: 0.88rem; line-height: 1.15; }
.bp-sub { font-size: 0.74rem; color: var(--dim); }
.weapon-art.unknown { filter: brightness(0) opacity(0.5); }
.mat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; }
.mat-pick { padding: 8px; border-radius: var(--r-sm); border: 1px solid var(--line); background: rgba(0, 0, 0, 0.25); }
.mat-pick.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.mat-pick-head { display: flex; gap: 8px; align-items: center; }
.q-row { display: flex; gap: 4px; margin-top: 6px; }
.q-btn { flex: 1; min-height: 32px; border-radius: 5px; border: 1px solid var(--line); background: #110d0a; font-family: var(--f-mono); font-size: 0.8rem; }
.q-btn.q1 { color: #9ec9ff; } .q-btn.q2 { color: #ffd76a; }
.q-btn.on { background: #4a3a28; border-color: var(--gold); }
.q-btn:disabled { opacity: 0.35; }
.comp-slot { margin-bottom: 10px; }
.comp-slot-name { font-family: var(--f-display); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
.comp-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.comp { display: flex; flex-direction: column; align-items: flex-start; text-align: left; padding: 6px 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: rgba(0, 0, 0, 0.25); max-width: 240px; min-height: 40px; justify-content: center; }
.comp span { font-size: 0.78rem; color: var(--dim); }
.comp.on { border-color: var(--gold); background: rgba(233, 182, 90, 0.1); }
.comp.short { border-style: dashed; opacity: 0.75; }
.ench-name { color: var(--ec, var(--arcane)); }
.stage-list, .stage-scores { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
.stage-chip { font-size: 0.78rem; padding: 3px 8px; border-radius: 999px; background: rgba(154, 123, 255, 0.1); border: 1px solid rgba(154, 123, 255, 0.35); }
.stage-chip em { color: var(--faint); font-style: normal; }
.problems { margin: 8px 0; padding-left: 18px; color: #ffb3a0; font-size: 0.86rem; }
.check { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 0.86rem; color: var(--dim); }
.check input { width: 18px; height: 18px; accent-color: var(--gold); }
.stat-table { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 8px 0; font-size: 0.92rem; }
.stat-table dt { color: var(--dim); }
.stat-table dd { margin: 0; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.stat-table .up { color: var(--good); margin-left: 6px; } .stat-table .down { color: var(--bad); margin-left: 6px; }
.traits { list-style: none; padding: 0; margin: 6px 0; }
.traits li { padding: 5px 8px; border-left: 2px solid var(--arcane); margin-bottom: 4px; background: rgba(154, 123, 255, 0.06); font-size: 0.9rem; }
.traits li span { color: var(--dim); }
.breakdown { list-style: none; padding: 0; margin: 8px 0; display: flex; flex-direction: column; gap: 6px; }
.breakdown li { display: flex; flex-direction: column; padding: 6px 9px; background: rgba(0, 0, 0, 0.25); border-radius: var(--r-sm); font-size: 0.88rem; }
.breakdown li span { color: var(--dim); }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.compare > div { min-width: 0; }

/* session */
.session { padding: 14px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 64px); }
.reveal { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 64px); }
.session-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 10px; }
.session-steps { display: flex; gap: 4px; flex-wrap: wrap; }
.step { font-size: 0.78rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--faint); }
.step.cur { color: var(--gold-hi); border-color: var(--gold); }
.step.done { color: var(--good); border-color: #3a6a4a; }
.step em { font-style: normal; font-family: var(--f-mono); }
.session-body { min-height: 380px; display: grid; place-items: center; position: relative; }
.stage-intro, .stage-result { text-align: center; max-width: 520px; padding: 20px 0; }
.stage-play { width: 100%; max-width: 560px; position: relative; }
.stage-title { text-align: center; margin-bottom: 6px; }
.big-score { font-family: var(--f-display); font-size: 4rem; font-weight: 900; line-height: 1; }
.pause-cover { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10, 7, 5, 0.86); border-radius: var(--r); text-align: center; z-index: 5; }

/* QTE common */
.qte { display: flex; flex-direction: column; align-items: center; gap: 8px; user-select: none; -webkit-user-select: none; }
.qte-stage { position: relative; width: min(340px, 88vw); aspect-ratio: 1; touch-action: none; cursor: pointer; max-width: 100%; }
.qte-canvas { display: block; width: 100%; height: 100%; }
.qte-hint { font-size: 0.86rem; color: var(--dim); text-align: center; max-width: 440px; margin: 0; }
.qte-msg { color: var(--gold-hi); font-size: 0.9rem; margin: 0; }
.grade-pop { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); font-family: var(--f-display); font-weight: 900; font-size: 1.7rem; pointer-events: none; animation: pop 0.7s ease forwards; text-shadow: 0 2px 8px #000; }
.grade-pop.small { font-size: 1.1rem; top: 6%; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, 10px) scale(0.7); } 25% { opacity: 1; transform: translate(-50%, 0) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -18px) scale(1); } }
.g-perfect { color: #ffd25a; } .g-excellent { color: #9ff0b8; } .g-good { color: #7fd0ff; } .g-poor { color: #d0a080; } .g-miss { color: #ff6a5a; }
.pip.g-perfect { background: #ffd25a; } .pip.g-excellent { background: #9ff0b8; } .pip.g-good { background: #7fd0ff; } .pip.g-poor { background: #b0805a; } .pip.g-miss { background: #ff6a5a; }
.pips { display: flex; gap: 6px; justify-content: center; }
.pip { width: 12px; height: 12px; border-radius: 50%; background: #2a221c; border: 1px solid var(--line-hi); }
.timebar { width: min(420px, 100%); height: 6px; border-radius: 3px; background: #0a0807; overflow: hidden; }
.timebar span { display: block; height: 100%; background: linear-gradient(90deg, var(--ember), var(--gold-hi)); }
/* furnace */
.furnace-wrap { display: flex; gap: 10px; align-items: stretch; justify-content: center; width: 100%; }
.furnace-svg { width: min(240px, 55vw); height: auto; }
.gauge-svg { width: 62px; height: auto; }
.fire-flicker { animation: flick 0.5s ease-in-out infinite; transform-origin: 110px 190px; }
.svg-warn { font-family: var(--f-display); font-size: 13px; fill: #9fd8ff; font-weight: 700; }
.svg-small { font-family: var(--f-mono); font-size: 9px; fill: var(--dim); }
.svg-tiny { font-family: var(--f-body); font-size: 4px; font-weight: 700; fill: #ffe8b8; pointer-events: none; }
.svg-tiny.key { fill: #b4a48c; }
.furnace-readout { display: grid; grid-template-columns: auto 1fr; gap: 0 12px; align-items: center; width: min(420px, 100%); }
.furnace-readout .muted { font-size: 0.86rem; }
.furnace-readout .trace { grid-column: 1 / -1; width: 100%; height: 34px; background: rgba(0, 0, 0, 0.3); border-radius: 4px; }
.temp { font-family: var(--f-mono); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.temp.ok { color: var(--good); } .temp.bad { color: #ffb38a; }
.blink { animation: blink 0.5s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.2; } }
.bellows { width: min(420px, 100%); min-height: 64px; font-size: 1.1rem; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.bellows.held { background: linear-gradient(180deg, #ff9a3a, #c2441a); color: #1e0f04; box-shadow: 0 0 24px rgba(255, 138, 58, 0.6); }
/* hammer */
.anvil-stage { position: relative; width: 100%; max-width: 540px; touch-action: none; }
.anvil-svg { width: 100%; height: auto; display: block; }
.hot-blade { filter: drop-shadow(0 0 2px #ff8a3a); }
.spt .spt-core { fill: #3a2a20; stroke: #6a5040; stroke-width: 0.6; transition: fill 0.08s; }
.spt.pre .spt-core { fill: #6a4a2a; }
.spt.live .spt-core { fill: #ff9a3a; stroke: #ffd27a; }
.spt.peak .spt-core { fill: #fff2b0; stroke: #fff; filter: drop-shadow(0 0 2px #ffd25a); }
.spt.decoy .spt-core { fill: #6a3aa8; stroke: #c8a0ff; }
.spt.heavy .spt-core { stroke-width: 1.4; }
.hammer-meta { display: flex; gap: 14px; font-family: var(--f-mono); font-size: 0.86rem; color: var(--dim); font-variant-numeric: tabular-nums; }
.hammer-meta .bad { color: var(--bad); }
/* quench */
.quench-weapon { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; transition: filter 0.4s; }
.qte-quench .qte-stage { background: radial-gradient(circle, rgba(60, 120, 180, 0.15), transparent 70%); border-radius: 50%; }
/* runes */
.rune-stage { width: min(360px, 90vw); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(154, 123, 255, 0.16), rgba(10, 6, 20, 0.6) 70%); max-width: 100%; }
.rune-stage.flash { box-shadow: 0 0 0 3px rgba(255, 70, 70, 0.6) inset; }
.rune-svg { width: 100%; height: 100%; touch-action: none; display: block; cursor: crosshair; }
.svg-rune-num { font-family: var(--f-mono); font-size: 4px; fill: #fff; pointer-events: none; font-weight: 700; }
.spin-slow { animation: spin 30s linear infinite; transform-origin: 50px 50px; }
@keyframes spin { to { transform: rotate(360deg); } }
/* mana */
.mana-stage { display: flex; align-items: stretch; justify-content: center; gap: 18px; width: 100%; }
.mana-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.mana-label { font-family: var(--f-display); font-weight: 700; font-size: 0.9rem; }
.mana-gauge { position: relative; width: 64px; height: 250px; border-radius: 12px; background: #0c0a14; border: 1px solid #3a3058; touch-action: none; cursor: ns-resize; overflow: visible; }
.mana-band { position: absolute; left: 0; right: 0; background: rgba(127, 224, 160, 0.22); border-top: 1px solid var(--good); border-bottom: 1px solid var(--good); }
.mana-fill { position: absolute; left: 22px; right: 22px; bottom: 0; border-radius: 10px 10px 0 0; opacity: 0.9; transition: background 0.2s; }
.mana-handle { position: absolute; left: -8px; right: -8px; height: 28px; border-radius: 8px; background: linear-gradient(180deg, #e8d8b0, #a08050); border: 1px solid #fff4d0; display: grid; place-items: center; color: #3a2a10; font-weight: 900; box-shadow: 0 2px 6px #000a; pointer-events: none; }
.mana-keys { font-family: var(--f-mono); font-size: 0.72rem; color: var(--faint); }
.mana-orb-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; width: 120px; position: relative; }
.mana-orb { width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #b48aff 40%, #3a6aff 75%, transparent 77%); transition: transform 0.1s linear; }
.mana-orb.stable { box-shadow: 0 0 30px #9a7bff; }
.mana-orb.wobble { animation: wob 0.3s ease-in-out infinite; }
.mana-orb.chaos { background: radial-gradient(circle at 40% 35%, #fff, #ff7a5a 40%, #a02a6a 75%, transparent 77%); animation: wob 0.15s ease-in-out infinite; }
@keyframes wob { 50% { filter: brightness(1.3); } }
.mana-state { font-family: var(--f-display); font-weight: 700; }
.svg-warn-html { color: #ffb38a; font-weight: 700; font-size: 0.86rem; text-align: center; }

/* reveal */
.reveal { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; padding: 20px; overflow: hidden; align-items: center; }
.reveal-burst { position: absolute; inset: -30%; background: conic-gradient(from 0deg, transparent, var(--rc), transparent 20%, transparent 50%, var(--rc), transparent 70%); opacity: 0.13; animation: spin 18s linear infinite; pointer-events: none; }
.reveal-art { display: grid; place-items: center; position: relative; animation: rise 0.9s cubic-bezier(.2, .8, .2, 1.2); }
.reveal-art::after { content: ""; position: absolute; width: 70%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, var(--rc), transparent 65%); opacity: 0.35; z-index: -1; }
@keyframes rise { from { transform: scale(0.3) rotate(-40deg); opacity: 0; } to { transform: none; opacity: 1; } }
.reveal-info { position: relative; min-width: 0; }
.reveal-name { font-size: clamp(1.5rem, 4vw, 2.3rem); color: var(--rc); text-shadow: 0 0 18px color-mix(in srgb, var(--rc) 50%, transparent); animation: fadein 0.6s 0.3s both; }
.aura { animation: breathe 3s ease-in-out infinite; transform-origin: 50px 50px; }
@keyframes breathe { 50% { opacity: 0.6; transform: scale(0.94); } }
.runeglow { animation: glow 1.6s ease-in-out infinite; }
.orbglow { animation: glow 2s ease-in-out infinite; }
@keyframes glow { 50% { opacity: 0.5; } }

/* ---------- BATTLE ---------- */
.battle { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(300px, 1fr); gap: 14px; align-items: start; }
.battlefield { overflow: hidden; display: grid; grid-template-rows: auto auto; }
.bf-scene { position: absolute; inset: 0; opacity: 0.3; pointer-events: none; }
.bf-scene .scene { height: 100%; }
.bf-enemy, .bf-player { position: relative; padding: 14px 16px; }
.bf-player { border-top: 1px solid var(--line); background: linear-gradient(180deg, rgba(13, 11, 10, 0.75), rgba(13, 11, 10, 0.92)); }
.combatant-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: relative; }
.combatant-head h2 { margin: 0; }
.mini-bars { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mini-bars .bar { flex: 1; min-width: 140px; }
.two-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.enemy-stage { position: relative; display: grid; place-items: center; min-height: 210px; }
.enemy-art .enemy-body { animation: idle 2.6s ease-in-out infinite; transform-origin: 100px 180px; }
.enemy-art.hit .enemy-body { animation: hitshake 0.35s ease, idle 2.6s ease-in-out 0.35s infinite; }
@keyframes idle { 50% { transform: translateY(-3px) scaleY(1.01); } }
@keyframes hitshake { 20% { transform: translateX(-6px); filter: brightness(2); } 60% { transform: translateX(5px); } }
.boss .enemy-art { filter: drop-shadow(0 0 16px rgba(255, 90, 60, 0.35)); }
.eye { animation: glow 2.2s ease-in-out infinite; }
.pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { opacity: 0.55; transform: scale(1.08); } }
.flame { animation: glow 0.6s ease-in-out infinite; }
.float { animation: idle 3s ease-in-out infinite; }
.wing { animation: flap 1.2s ease-in-out infinite; transform-origin: 100px 100px; }
@keyframes flap { 50% { transform: scaleY(0.88); } }
.bat { animation: idle 0.9s ease-in-out infinite; }
.bat1 { animation-delay: -0.3s; } .bat2 { animation-delay: -0.5s; } .bat3 { animation-delay: -0.2s; }
.twinkle { animation: glow 2.4s ease-in-out infinite; }
.mote { animation: idle 3s ease-in-out infinite, glow 2s ease-in-out infinite; }
.smoke { animation: smoke 3s ease-out infinite; }
@keyframes smoke { from { transform: translateY(0); opacity: 0.5; } to { transform: translateY(-30px) scale(2); opacity: 0; } }
.forgeglow { animation: glow 1.4s ease-in-out infinite; }
.floats { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 10%; }
.combatant-head .floats { left: auto; right: 0; top: -10px; align-items: flex-end; }
.float { font-family: var(--f-display); font-weight: 900; font-size: 1.3rem; animation: floatup 1.1s ease forwards; text-shadow: 0 2px 6px #000; }
.float.crit { color: #ffd25a; font-size: 1.6rem; } .float.dmg { color: #fff; } .float.heal { color: var(--good); } .float.miss { color: #9fc8ff; font-size: 1rem; }
.float.status { color: #d8c8ff; font-size: 1rem; } .float.dot { color: #ffb38a; font-size: 1rem; } .float.perfect { color: #ffd25a; font-size: 1.1rem; }
@keyframes floatup { from { opacity: 1; transform: translateY(10px); } to { opacity: 0; transform: translateY(-40px); } }
.status-row { display: flex; flex-wrap: wrap; gap: 4px; min-height: 24px; margin: 4px 0; }
.status { font-size: 0.74rem; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--sc); color: var(--sc); background: rgba(0, 0, 0, 0.4); }
.status em { font-style: normal; font-family: var(--f-mono); margin-left: 4px; opacity: 0.8; }
.intent { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: var(--r-sm); background: rgba(0, 0, 0, 0.5); border: 1px solid var(--line-hi); }
.intent.heavy { border-color: #ff6a4a; box-shadow: 0 0 14px rgba(255, 90, 60, 0.3); }
.battle-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.actions { padding: 12px; }
.act-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.act { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px; min-height: 76px; border-radius: var(--r-sm); border: 1px solid var(--line-hi); background: linear-gradient(180deg, #3a2e24, #231b15); color: var(--text); font-weight: 700; touch-action: manipulation; }
.act em { font-style: normal; font-weight: 400; font-size: 0.72rem; color: var(--dim); text-align: center; }
.act:hover:not(:disabled) { filter: brightness(1.15); }
.act:disabled { opacity: 0.4; }
.act.special.ready { border-color: var(--gold-hi); box-shadow: 0 0 16px rgba(255, 210, 90, 0.5); animation: glow 1.2s ease-in-out infinite; }
.submenu { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.sub-btn { display: grid; grid-template-columns: 1fr auto; text-align: left; gap: 0 8px; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: rgba(0, 0, 0, 0.3); min-height: 44px; }
.sub-btn b { grid-column: 1; } .sub-btn span { grid-column: 1; } .sub-btn em { grid-column: 2; grid-row: 1 / 3; align-self: center; font-style: normal; font-family: var(--f-mono); font-size: 0.8rem; color: var(--gold); }
.sub-btn:disabled { opacity: 0.45; }
.sub-label { font-family: var(--f-display); font-size: 0.76rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin-top: 6px; }
.timing-wrap { padding: 16px; }
.ctiming { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
.ct-label { font-family: var(--f-display); font-weight: 900; font-size: 1.5rem; color: var(--gold-hi); }
.ct-bar { position: relative; width: 100%; height: 34px; border-radius: 8px; background: #0a0807; border: 1px solid var(--line-hi); overflow: hidden; }
.ct-good { position: absolute; top: 0; bottom: 0; background: rgba(127, 208, 255, 0.3); }
.ct-sweet { position: absolute; top: 0; bottom: 0; background: #ffd25a; }
.ct-mark { position: absolute; top: -4px; bottom: -4px; width: 4px; margin-left: -2px; background: #fff; box-shadow: 0 0 10px #fff; }
.ct-sub { font-size: 0.82rem; color: var(--dim); }
.def-lane { position: relative; width: 100%; height: 46px; border-radius: 8px; background: #0a0807; border: 1px solid var(--line-hi); overflow: hidden; }
.def-shield { position: absolute; left: 4px; top: 4px; bottom: 4px; width: 30px; border-radius: 6px 6px 14px 14px; background: linear-gradient(180deg, #8aa8d8, #3a5a8a); border: 1px solid #c8dcff; }
.def-zone { position: absolute; left: 34px; top: 0; bottom: 0; background: rgba(255, 210, 90, 0.3); border-right: 1px solid #ffd25a; }
.def-strike { position: absolute; top: 8px; bottom: 8px; width: 30px; border-radius: 4px; background: linear-gradient(90deg, #ff5a3a, #ffd25a); box-shadow: 0 0 12px #ff6a3a; }
.ctiming.heavy .def-strike { width: 44px; }
.battle-end { padding: 16px; text-align: center; }
.battle-end.win h2 { color: var(--gold-hi); } .battle-end.lose h2 { color: var(--bad); }
.battle-log { padding: 10px 12px; max-height: 240px; overflow-y: auto; font-size: 0.86rem; }
.log { margin: 0 0 3px; color: var(--dim); }
.log.title { color: var(--gold-hi); font-family: var(--f-display); } .log.good { color: #b8f0c8; } .log.bad { color: #ffb3a0; } .log.info { color: #c8d8ff; }
.battle-idle .panel { margin-bottom: 12px; }

/* ---------- INVENTORY ---------- */
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 0.9rem; color: var(--dim); }
select { background: #1a1410; border: 1px solid var(--line-hi); border-radius: var(--r-sm); padding: 6px 10px; min-height: 38px; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.wcard { position: relative; display: flex; gap: 10px; align-items: center; text-align: left; padding: 8px; border-radius: var(--r); border: 1px solid var(--line); background: linear-gradient(135deg, color-mix(in srgb, var(--rc) 10%, #1f1915), #16120f); box-shadow: inset 3px 0 0 var(--rc); min-width: 0; }
.wcard:hover { border-color: var(--rc); }
.wcard.selected { border-color: var(--gold); }
.wcard-art { flex: none; }
.wcard-body { min-width: 0; flex: 1; }
.wcard-name { font-family: var(--f-display); font-weight: 700; color: var(--rc); line-height: 1.15; overflow-wrap: anywhere; }
.wcard-sub { font-size: 0.8rem; color: var(--dim); }
.wcard-stats { display: flex; gap: 8px; font-family: var(--f-mono); font-size: 0.76rem; margin-top: 3px; color: var(--text); }
.wcard-flags { position: absolute; top: 6px; right: 8px; display: flex; gap: 4px; align-items: center; color: var(--dim); }
.fav { color: var(--gold-hi); }
.rarity { font-weight: 700; }
.mat-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
.mat-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: rgba(0, 0, 0, 0.22); text-align: left; }
.mat-row .grow { display: flex; flex-direction: column; }
.qcounts { display: flex; gap: 6px; font-family: var(--f-mono); font-size: 0.86rem; font-variant-numeric: tabular-nums; }
.q0 { color: #e8e0d0; } .q1 { color: #9ec9ff; } .q2 { color: #ffd76a; }
.detail { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; }
.detail-art { display: grid; place-items: center; background: radial-gradient(circle, color-mix(in srgb, var(--rc) 30%, transparent), transparent 70%); border-radius: var(--r); }

/* ---------- CHARACTER ---------- */
.char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.unlocks { list-style: none; padding: 0; margin: 8px 0; font-size: 0.86rem; }
.unlocks li { color: var(--faint); padding: 3px 0; }
.unlocks li b { display: inline-block; min-width: 24px; font-family: var(--f-mono); }
.unlocks li.got { color: var(--text); }
.unlocks li.got b { color: var(--gold-hi); }
.trees { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tree { padding: 12px; border-top: 3px solid var(--tc); }
.tree h4 { color: var(--tc); }
.tree-row { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.row-req { font-size: 0.7rem; color: var(--faint); text-transform: uppercase; letter-spacing: 0.1em; }
.talent { display: flex; flex-direction: column; text-align: left; gap: 2px; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: rgba(0, 0, 0, 0.3); }
.talent .rank { font-family: var(--f-mono); font-size: 0.78rem; color: var(--faint); margin-left: 4px; }
.talent.has { border-color: var(--tc); }
.talent.max { background: color-mix(in srgb, var(--tc) 12%, #120e0b); }
.talent:disabled { opacity: 0.6; }
.talent:disabled.has { opacity: 0.95; }
.mastery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }

/* ---------- UPGRADES / LEGACY ---------- */
.up-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
.up-card { display: flex; flex-direction: column; gap: 6px; }
.up-card.built { border-color: var(--line-hi); }
.up-card .btn { align-self: flex-start; margin-top: auto; }
.up-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.up-head h4 { margin: 0; }
.lvl { font-family: var(--f-mono); color: var(--gold-hi); }
.up-card .pips { justify-content: flex-start; }
.legacy-hero { display: flex; gap: 18px; align-items: center; overflow: hidden; }
.legacy-flame { width: 90px; height: 120px; flex: none; border-radius: 50% 50% 45% 45% / 65% 65% 35% 35%; background: radial-gradient(circle at 50% 75%, #fff, #ffd98a 25%, #ff8a3a 50%, #9a3aff 80%, transparent 82%); animation: flick 1.6s ease-in-out infinite; filter: drop-shadow(0 0 20px #ff8a3a); }
.legacy-cols { display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; margin-top: 14px; }
.legacy-cols ul { padding-left: 18px; }

/* ---------- CODEX / QUESTS ---------- */
.codex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.codex-card { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: rgba(0, 0, 0, 0.25); text-align: left; }
.codex-card > div { min-width: 0; }
.codex-card.unknown { opacity: 0.55; }
.codex-card .q { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 1px dashed var(--line-hi); font-family: var(--f-display); color: var(--faint); }
.ench-dot { width: 26px; height: 26px; flex: none; border-radius: 50%; box-shadow: 0 0 12px currentColor; }
.records { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.history { list-style: none; padding: 0; margin: 0; font-size: 0.9rem; }
.history li { padding: 4px 0; border-bottom: 1px solid rgba(74, 60, 46, 0.5); }
.lore { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.lore-card { overflow: hidden; }
.quest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
.quest { display: flex; flex-direction: column; gap: 4px; }
.quest.done { border-color: var(--good); box-shadow: 0 0 0 1px rgba(127, 224, 160, 0.3) inset; }
.quest.claimed { opacity: 0.6; }
.quest-head { display: flex; justify-content: space-between; gap: 8px; }
.quest .btn { align-self: flex-start; }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.ach { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: rgba(0, 0, 0, 0.25); color: var(--faint); }
.ach.got { color: var(--gold-hi); border-color: var(--line-hi); }
.ach.got b { color: var(--text); }
.savebox { width: 100%; min-height: 80px; margin: 8px 0; padding: 8px; border-radius: var(--r-sm); background: #0e0b09; border: 1px solid var(--line); font-family: var(--f-mono); font-size: 0.74rem; resize: vertical; }

/* ---------- MINING / FORAGE ---------- */
.mining, .forage { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.mining-head { display: flex; gap: 10px; align-items: center; }
.mining-head > div { min-width: 0; flex: 1; }
.swings { display: flex; gap: 3px; flex-wrap: wrap; max-width: 140px; justify-content: flex-end; }
.swings span { width: 8px; height: 14px; border-radius: 2px; background: #2a221c; }
.swings span.on { background: var(--gold); }
.rock-svg { width: min(340px, 100%); align-self: center; touch-action: none; cursor: crosshair; user-select: none; }
.rock-svg.shake { animation: hitshake 0.18s; }
.weakpoint { animation: glow 0.5s ease-in-out infinite; pointer-events: none; }
.pocket { animation: pulse 0.4s ease-in-out infinite; pointer-events: none; }
.mining-foot { display: flex; justify-content: space-between; gap: 10px; }
.mining-msg { font-weight: 700; color: var(--gold-hi); }
.mining-msg.rare { color: #fffbe0; text-shadow: 0 0 8px #fff; }
.done-panel { text-align: center; align-items: center; }
.forage-field { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); touch-action: none; }
.forage-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.forage-item { position: absolute; width: 52px; height: 52px; border-radius: 50%; border: 0; background: radial-gradient(circle, rgba(255, 240, 180, 0.22), transparent 70%); display: grid; place-items: center; padding: 0; transition: transform 0.15s; touch-action: manipulation; }
.forage-item.glimmer { background: radial-gradient(circle, rgba(255, 230, 120, 0.6), transparent 70%); animation: pulse 0.6s ease-in-out infinite; }
.forage-item.thorn { background: radial-gradient(circle, rgba(160, 40, 40, 0.3), transparent 70%); }
.forage-pop { position: absolute; transform: translate(-50%, -100%); font-weight: 700; color: var(--good); font-size: 0.86rem; pointer-events: none; animation: floatup 0.8s ease forwards; white-space: nowrap; }
.forage-pop.bad { color: var(--bad); }
.discover-burst { height: 4px; background: linear-gradient(90deg, transparent, var(--arcane), transparent); margin-bottom: 10px; animation: glow 1s ease-in-out infinite; }
.maticon { flex: none; }

/* ---------- responsive ---------- */
@media (max-width: 980px) {
  .world-grid, .forge-grid, .battle, .reveal { grid-template-columns: 1fr; }
  .preview-col { position: static; }
  .trees { grid-template-columns: 1fr; }
  .legacy-cols, .char-grid { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .topnav { display: none; }
  .topbar { grid-template-columns: auto 1fr; padding-top: 8px; padding-bottom: 8px; }
  .brand-sub { display: none; }
  .brand-name { font-size: 1.05rem; }
  .top-stats { gap: 8px; font-size: 0.78rem; }
  .ts.hp { width: 70px; }
  .app { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .bottomnav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: linear-gradient(180deg, #1f1915, #120e0b); border-top: 1px solid var(--line-hi); padding: 4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .bn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px; min-height: 56px; border: 0; background: transparent; color: var(--dim); font-size: 0.72rem; font-weight: 700; border-radius: var(--r-sm); }
  .bn.on { color: var(--gold-hi); background: rgba(233, 182, 90, 0.1); }
  .bn .badge { right: 18%; }
  .more-sheet { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, 0.5); display: flex; align-items: flex-end; }
  .more-panel { width: 100%; margin: 0 8px calc(70px + env(safe-area-inset-bottom, 0px)); padding: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .more-btn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 6px; border-radius: var(--r-sm); border: 1px solid var(--line); background: rgba(0, 0, 0, 0.3); font-weight: 700; font-size: 0.86rem; }
  .goal { font-size: 0.82rem; }
  .compare { grid-template-columns: 1fr; }
  .detail { grid-template-columns: 1fr; }
  .detail-art .weapon-art { width: 140px; height: 140px; }
  .toasts { top: auto; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
}
@media (min-width: 861px) { .more-sheet { display: none; } }
@media (max-width: 520px) {
  body { font-size: 15px; }
  .act-grid { grid-template-columns: repeat(3, 1fr); }
  .act { min-height: 68px; padding: 8px 2px; font-size: 0.88rem; }
  .act em { display: none; }
  .mana-gauge { height: 210px; width: 56px; }
  .mana-orb-wrap { width: 84px; }
  .mana-orb { width: 58px; height: 58px; }
  .enemy-stage .enemy-art { width: 160px; height: 160px; }
  .enemy-stage { min-height: 170px; }
  .big-score { font-size: 3.2rem; }
  .session-body { min-height: 320px; }
  .reveal-art .weapon-art { width: 170px; height: 170px; }
  .loc-actions .btn { flex: 1 1 calc(50% - 8px); }
  .wgrid, .codex-grid, .mat-list, .quest-grid, .up-grid { grid-template-columns: 1fr; }
  .hp-mini { width: 100%; }
}
/* reduced motion */
.rm .grade-pop, .rm .float, .rm .forage-pop { animation: none !important; }
.rm *, .rm *::before, .rm *::after { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; transition-duration: 0.001s !important; }
.rm .embers { display: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; transition-duration: 0.001s !important; }
  .embers { display: none; }
}
