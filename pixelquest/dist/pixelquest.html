<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pixel Quest</title>
<meta name="description" content="PIXEL QUEST: ULTIMATE RPG - a 2D pixel-art open-world adventure RPG.">
</head>
<body>
<style>
/* PIXEL QUEST — interface styles. Pixel-framed panels in plum and gold; all text uses the runtime-generated PQPixel font. */
:root {
  --ink: #120d18; --panel: #241f3a; --panel2: #2f2850; --gold: #e8c070; --gold2: #ffd75a; --text: #f2ead8; --dim: #a89cc0;
  --green: #5fdc6a; --red: #ff6a6a; --blue: #7ef0ff;
  --font: 'PQPixel', ui-monospace, 'Courier New', monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0a0812; color: var(--text); overflow: hidden; }
body { font-family: var(--font); font-size: 16px; line-height: 1.35; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
html:not(.pqfont) body { font-weight: 700; letter-spacing: 0.02em; }
#app { position: fixed; inset: 0; }
#game { position: absolute; inset: 0; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
h2, h3, h4 { margin: 0 0 8px; font-weight: normal; }
h2 { font-size: 24px; color: var(--gold2); text-shadow: 2px 2px 0 var(--ink); }
h3 { font-size: 16px; color: var(--gold2); }
h4 { font-size: 16px; color: var(--dim); margin-top: 10px; }
p { margin: 6px 0; }
small { color: var(--dim); }
.hint { color: var(--dim); }
.gold { color: var(--gold2); }
.warn { color: #ffb0a0; max-width: 520px; text-align: center; }
img.ic { width: 32px; height: 32px; image-rendering: pixelated; vertical-align: middle; flex: none; }
img.ic.big { width: 48px; height: 48px; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* pixel frame */
.pq-panel, .dbox, .toast, .tb, .pb, .slot, .cell, .sr, .cr, .skill, .pc, .jc, .qi, .tab, #banner h2 {
  border: 0; box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--gold), 0 0 0 6px var(--ink);
}
.pb, .tb, .tab { background: var(--panel2); padding: 6px 12px; margin: 6px; min-height: 36px; transition: transform 0.06s, background 0.1s; }
.pb:hover, .tb:hover:not([disabled]), .tab:hover { background: #3c3366; }
.pb:active, .tb:active { transform: translateY(2px); }
.pb.gold, .tb.gold { background: #8a5a1a; color: #fff3c0; }
.pb.gold:hover, .tb.gold:hover { background: #a8701a; }
.pb.red { background: #5a1a2a; color: #ffd0d8; }
.pb.on, .tab.on { background: #2a5a6a; color: #e0fbff; }
.pb.sq { min-width: 34px; padding: 4px 8px; margin: 4px; }
.pb[disabled], .tb[disabled] { opacity: 0.45; cursor: default; }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 10px; }
.acts { display: flex; flex-wrap: wrap; gap: 0; margin: 4px -6px; }

/* title */
#ui { position: absolute; left: 0; right: 0; bottom: 0; top: 34%; display: flex; justify-content: center; align-items: flex-start; pointer-events: none; padding: 0 max(16px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px, env(safe-area-inset-left)); }
.title-menu { pointer-events: auto; display: flex; flex-direction: column; align-items: stretch; gap: 4px; width: min(420px, 92vw); max-height: 100%; overflow-y: auto; padding: 10px; }
.tb { font-size: 16px; padding: 10px 14px; margin: 6px; }
.tb-row { display: flex; gap: 0; }
.tb-row .tb { flex: 1; }
.tb.s { font-size: 16px; padding: 8px 6px; }

/* modal panels */
.panel-wrap { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8, 6, 14, 0.6); z-index: 30; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.panel-wrap.show { display: flex; animation: pin 0.14s ease-out; }
@keyframes pin { from { opacity: 0; transform: scale(0.97); } }
.pq-panel { background: var(--panel); padding: 16px; width: min(560px, 100%); max-height: 100%; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.wide .pq-panel { width: min(1040px, 100%); }
.tall .pq-panel { height: 100%; display: flex; flex-direction: column; }
.small .pq-panel { width: min(400px, 100%); }
.tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 0; margin: -4px -4px 8px; }
.tab { padding: 4px 10px; margin: 5px; min-height: 32px; }
.tab.x { margin-left: auto; background: #5a1a2a; }
.tab .dot { font-style: normal; background: var(--gold2); color: var(--ink); padding: 0 4px; }
.tabbody { flex: 1; overflow-y: auto; touch-action: pan-y; padding: 4px; }
.goldtag { margin-left: auto; color: var(--gold2); padding: 0 8px; }

/* slots */
.slots { display: flex; flex-direction: column; gap: 14px; margin: 10px 4px; }
.slot { display: flex; align-items: center; gap: 12px; background: var(--panel2); padding: 8px 10px; }
.slot.empty { opacity: 0.75; }
.imp { margin: 6px 4px; } .imp summary { cursor: pointer; color: var(--gold2); padding: 4px 0; }
.slotpv { width: 54px; height: 66px; image-rendering: pixelated; flex: none; }
.sinfo { flex: 1; min-width: 0; }
.sbtn { display: flex; flex-wrap: wrap; justify-content: flex-end; }
textarea { width: 100%; background: var(--ink); color: var(--text); font: 14px ui-monospace, monospace; border: 2px solid var(--gold); padding: 6px; user-select: text; -webkit-user-select: text; word-break: break-all; }
select, input[type=text], input:not([type]) { font: inherit; background: var(--ink); color: var(--text); border: 2px solid var(--gold); padding: 4px 8px; user-select: text; -webkit-user-select: text; }

/* creator */
.creator { display: flex; gap: 16px; flex-wrap: wrap; }
.crprev { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; }
#crCanvas { width: 320px; max-width: 100%; height: 144px; image-rendering: pixelated; background: linear-gradient(#2f2850, #241f3a); box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--gold); }
#pvC { width: 108px; height: 132px; image-rendering: pixelated; }
.crctl { flex: 1; min-width: 260px; }
.crow { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.crow > span { width: 110px; color: var(--dim); }
.crow > b { min-width: 90px; text-align: center; }
.crow input { flex: 1; min-width: 120px; }
.sws { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 26px; height: 26px; border: 2px solid var(--ink); padding: 0; }
.sw.on { outline: 3px solid var(--gold2); outline-offset: 1px; }

/* bag */
.bag { display: flex; gap: 16px; flex-wrap: wrap; }
.bagl { flex: 0 0 260px; }
.bagr { flex: 1; min-width: 280px; }
.eqgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 4px; align-items: center; justify-items: center; }
#bagPv { grid-row: span 2; width: 54px; height: 66px; image-rendering: pixelated; }
.eqs { display: flex; flex-direction: column; align-items: center; }
.eqs small { font-size: 16px; }
.stats { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.stats div { display: flex; justify-content: space-between; border-bottom: 1px solid #3a3058; }
.stats .pv { grid-column: span 2; color: var(--gold2); border: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, 44px); gap: 8px; margin: 8px 4px; }
.cell { width: 44px; height: 44px; background: #1a1630; position: relative; display: flex; align-items: center; justify-content: center; padding: 0; margin: 0; }
.cell.sel { background: #4a4080; }
.cell i { position: absolute; right: 2px; bottom: 0; font-style: normal; text-shadow: 1px 1px 0 var(--ink), -1px -1px 0 var(--ink); }
.cell.r1 { box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px #5fdc6a, 0 0 0 6px var(--ink); }
.cell.r2 { box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px #4aa8ff, 0 0 0 6px var(--ink); }
.cell.r3 { box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px #c070ff, 0 0 0 6px var(--ink); }
.cell.r4 { box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px #ffb52e, 0 0 0 6px var(--ink); }
.cell.r5 { box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px #ff4f7a, 0 0 0 6px var(--ink); }
.gold { display: flex; align-items: center; gap: 6px; }
.gold img { display: none; }
.detail { margin-top: 12px; background: #1a1630; padding: 10px; min-height: 120px; }
.dhead { display: flex; gap: 10px; align-items: center; }
table.st { border-collapse: collapse; margin: 8px 0; min-width: 200px; }
table.st td { padding: 1px 12px 1px 0; }
table.st tr.lost td { color: var(--dim); }
i.up { color: var(--green); font-style: normal; } i.dn { color: var(--red); font-style: normal; }
.pvd { color: var(--gold2); }
.desc { color: #d8d0e8; }

/* skills */
.trees { display: flex; gap: 14px; flex-wrap: wrap; }
.tree { flex: 1; min-width: 240px; }
.skill { background: var(--panel2); padding: 8px; margin: 12px 6px; }
.skill.got { background: #2f3f5a; }
.skill.locked { opacity: 0.55; }
.sk1 { display: flex; justify-content: space-between; }
.skill small { display: block; }
.req { color: #c8b0ff !important; }

/* quests */
.quests { display: flex; gap: 16px; flex-wrap: wrap; }
.qlist { flex: 0 0 260px; display: flex; flex-direction: column; }
.qi { background: var(--panel2); text-align: left; padding: 6px 10px; margin: 6px; }
.qi.sel { background: #4a4080; }
.qi.main { color: var(--gold2); }
.qi.done { opacity: 0.6; }
.qdet { flex: 1; min-width: 260px; }
.objs { list-style: none; padding: 0; }
.objs li { margin: 4px 0; }
.objs li.ok { color: var(--green); }

/* creatures */
.party { display: flex; flex-direction: column; gap: 14px; margin: 8px 4px; }
.pc { display: flex; align-items: center; gap: 10px; background: var(--panel2); padding: 8px; }
.pc.act { background: #2f4a3a; }
.pc > div { flex: 1; }
canvas.crt { width: 54px; height: 51px; image-rendering: pixelated; flex: none; }
.journal { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin: 8px 4px; }
.jc { background: var(--panel2); padding: 8px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; }
.jc.un { opacity: 0.7; }

/* map */
.mapwrap { flex: 1; min-height: 240px; display: flex; align-items: center; justify-content: center; background: #05030a; overflow: hidden; height: 60vh; }
#mapc { image-rendering: pixelated; }
.legend i { display: inline-block; width: 10px; height: 10px; margin: 0 4px 0 10px; vertical-align: middle; border: 1px solid var(--ink); }

/* system & settings */
.sys { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.set { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.set span { flex: 0 0 150px; color: var(--dim); }
.set input[type=range] { flex: 1; accent-color: var(--gold2); }
.set.chk span { flex: 1; color: var(--text); }
.set input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--gold2); }

/* shop & craft */
.slist { display: flex; flex-direction: column; gap: 12px; margin: 8px 4px; overflow-y: auto; flex: 1; }
.sr { display: flex; align-items: center; gap: 10px; background: var(--panel2); padding: 4px 8px; }
.sn { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sn small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.price { color: var(--gold2); }
.craft { display: flex; gap: 16px; flex: 1; min-height: 0; flex-wrap: wrap; }
.clist { flex: 1 1 280px; display: flex; flex-direction: column; overflow-y: auto; min-height: 120px; max-height: 100%; }
.cr { display: flex; align-items: center; gap: 8px; text-align: left; background: var(--panel2); padding: 2px 8px; margin: 6px; opacity: 0.7; }
.cr.can { opacity: 1; }
.cr.can span { color: var(--green); }
.cr.sel { background: #4a4080; opacity: 1; }
.cr.unk span { color: var(--dim); }
.cr .q { width: 32px; text-align: center; color: var(--dim); }
.cdet { flex: 1 1 300px; background: #1a1630; padding: 10px; overflow-y: auto; }
.ins { list-style: none; padding: 0; }
.ins li { display: flex; align-items: center; gap: 6px; }
.ins li.ok b { color: var(--green); } .ins li.no b { color: var(--red); }
.store { display: flex; gap: 16px; flex-wrap: wrap; flex: 1; overflow-y: auto; }
.store > div { flex: 1; min-width: 260px; }

/* dialogue */
#dlg { position: absolute; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; justify-content: center; padding: 0 max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.dbox { background: var(--panel); width: min(820px, 100%); display: flex; gap: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
#dportrait { width: 72px; height: 88px; image-rendering: pixelated; flex: none; background: var(--panel2); }
.dmain { flex: 1; min-width: 0; }
.dname { color: var(--gold2); }
#dtext { min-height: 42px; }
.dopts { display: flex; flex-wrap: wrap; margin: 0 -6px; }

/* notifications */
#toasts { position: absolute; top: 18%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: none; z-index: 40; width: min(560px, 92vw); }
.toast { background: rgba(36, 31, 58, 0.95); padding: 6px 12px; text-align: center; animation: tin 0.2s ease-out; transition: opacity 0.4s; }
.toast.out { opacity: 0; }
.toast.warn { color: #ffd0c0; } .toast.quest { color: var(--gold2); }
.toast.r2 { color: #8ac8ff; } .toast.r3 { color: #e0b0ff; } .toast.r4 { color: #ffd070; }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } }
#banner { position: absolute; top: 34%; left: 0; right: 0; text-align: center; pointer-events: none; opacity: 0; z-index: 20; }
#banner h2 { display: inline-block; font-size: 32px; background: rgba(36, 31, 58, 0.9); padding: 8px 18px; margin: 0; }
#banner p { margin-top: 12px; text-shadow: 2px 2px 0 var(--ink); }
#banner.show { animation: ban 2.8s ease-out forwards; }
@keyframes ban { 0% { opacity: 0; transform: translateY(8px); } 10%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }
#fade { position: absolute; inset: 0; background: #05030a; opacity: 0; pointer-events: none; transition: opacity 0.26s; z-index: 50; }
#fade.on { opacity: 1; }
#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5, 3, 10, 0.85); z-index: 60; font-size: 24px; color: var(--gold2); }
#feed { position: absolute; left: max(8px, env(safe-area-inset-left)); top: 42%; display: flex; flex-direction: column; gap: 2px; pointer-events: none; z-index: 15; }
.fi { display: flex; align-items: center; gap: 6px; background: rgba(18, 13, 24, 0.7); padding: 0 8px 0 2px; transition: opacity 0.4s; animation: tin 0.15s; }
.fi img.ic { width: 24px; height: 24px; }
.fi.out { opacity: 0; }
#saveind { position: absolute; right: max(10px, env(safe-area-inset-right)); bottom: 10px; opacity: 0; transition: opacity 0.3s; color: var(--green); z-index: 15; text-shadow: 2px 2px 0 var(--ink); pointer-events: none; }
#saveind.show { opacity: 1; } #saveind.bad { color: var(--red); }
body.touch #saveind { bottom: auto; top: var(--hudb, 130px); right: max(14px, env(safe-area-inset-right)); }

/* touch controls */
#touch { position: absolute; inset: 0; z-index: 10; display: none; --ts: 1; pointer-events: none; }
body.touch.ingame #touch { display: block; pointer-events: auto; }
#stick { position: absolute; width: calc(110px * var(--ts)); height: calc(110px * var(--ts)); transform: translate(-50%, -50%); border-radius: 50%; border: 3px solid rgba(232, 192, 112, 0.6); background: rgba(18, 13, 24, 0.3); pointer-events: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; border-radius: 50%; background: rgba(232, 192, 112, 0.65); border: 3px solid var(--ink); transform: translate(-50%, -50%); }
.tcluster { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); width: calc(210px * var(--ts)); height: calc(190px * var(--ts)); }
.tbt { position: absolute; border-radius: 50%; border: 3px solid var(--ink); box-shadow: 0 0 0 2px var(--gold); background: rgba(47, 40, 80, 0.75); width: calc(62px * var(--ts)); height: calc(62px * var(--ts)); padding: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; touch-action: none; overflow: hidden; }
.tbt span { position: relative; z-index: 1; pointer-events: none; text-shadow: 2px 2px 0 var(--ink); }
.tbt.big { width: calc(84px * var(--ts)); height: calc(84px * var(--ts)); right: 0; bottom: 0; background: rgba(138, 90, 26, 0.85); }
.tbt[data-b=dodge] { right: calc(94px * var(--ts)); bottom: 0; }
.tbt[data-b=interact] { right: calc(10px * var(--ts)); bottom: calc(96px * var(--ts)); background: rgba(42, 90, 106, 0.85); }
.tbt[data-b=interact].dim { opacity: 0.55; }
.tbt[data-b=ability] { right: calc(82px * var(--ts)); bottom: calc(72px * var(--ts)); }
.tbt.cdb::after { content: ''; position: absolute; inset: 0; background: conic-gradient(rgba(5, 3, 10, 0.7) calc(var(--cd, 0) * 360deg), transparent 0); }
.tbt.down, .tm.down, .hb.down { filter: brightness(1.5); transform: scale(0.94); }
.thot { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-30%); display: flex; gap: 10px; }
.hb { width: calc(44px * var(--ts)); height: calc(44px * var(--ts)); background: rgba(26, 22, 48, 0.85); border: 3px solid var(--ink); box-shadow: 0 0 0 2px var(--gold); padding: 0; position: relative; touch-action: none; }
.hb img.ic { width: 100%; height: 100%; }
.hb i { position: absolute; right: 2px; bottom: 0; font-style: normal; text-shadow: 1px 1px 0 var(--ink); }
.hb.empty { opacity: 0.4; }
.tmenu { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: none; }
.tm { background: rgba(26, 22, 48, 0.85); border: 3px solid var(--ink); box-shadow: 0 0 0 2px var(--gold); margin: 0 6px; padding: 4px 10px; touch-action: none; }
body.touch.ingame .tmenu { display: flex; top: var(--hudb, 130px); bottom: auto; left: max(12px, env(safe-area-inset-left)); transform: none; flex-direction: column; gap: 12px; }
body.panelopen #toasts { top: auto; bottom: 14px; }
#touch.lefty .tcluster { right: auto; left: max(14px, env(safe-area-inset-left)); transform: scaleX(-1); }
#touch.lefty .tcluster span { display: inline-block; transform: scaleX(-1); }
#touch.lefty .tmenu { left: auto !important; right: max(16px, env(safe-area-inset-right)); }
#rotate { display: none; }
@media (orientation: portrait) and (pointer: coarse) {
  body.ingame #rotate { display: block; position: absolute; top: 45%; left: 50%; transform: translateX(-50%); background: var(--panel); padding: 8px 12px; z-index: 12; text-align: center; animation: fadeaway 5s forwards; pointer-events: none; box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--gold); }
  .thot { left: auto; right: max(14px, env(safe-area-inset-right)); bottom: calc(210px * var(--ts)); transform: none; flex-direction: column; }
}
@keyframes fadeaway { 80% { opacity: 1; } 100% { opacity: 0; } }
@media (max-width: 720px) {
  .bagl, .qlist { flex: 1 1 100%; }
  h2 { font-size: 16px; }
  #banner h2 { font-size: 24px; }
  .pq-panel { padding: 10px; }
}
@media (max-height: 460px) {
  .tall .pq-panel { height: 100%; }
  .mapwrap { height: 50vh; }
  #ui { top: 36%; }
  .tb { padding: 4px 10px; margin: 5px; min-height: 32px; }
  .title-menu { gap: 2px; padding-top: 4px; }
}
@media (prefers-reduced-motion: reduce) { #banner.show, .toast, .panel-wrap.show { animation-duration: 0.01s; } }

</style>
<div id="app"></div>
<script>
/* ===== core.js ===== */
/* PIXEL QUEST — core: namespace, math, seeded RNG, noise, storage, events */
'use strict';
const PQ = (window.PQ = window.PQ || {});
PQ.VERSION = '1.0.0';
PQ.SAVE_VERSION = 1;
PQ.T = 16; // tile size in pixels

const U = (PQ.U = {
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
  angle: (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax),
  angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; },
  smooth: (t) => t * t * (3 - 2 * t),
  easeOut: (t) => 1 - (1 - t) * (1 - t),
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randi: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  chance: (p) => Math.random() < p,
  weighted(list, rnd = Math.random) { // [[value, weight]]
    let t = 0; for (const e of list) t += e[1];
    let r = rnd() * t;
    for (const e of list) { r -= e[1]; if (r <= 0) return e[0]; }
    return list[list.length - 1][0];
  },

/* ---------- seeded RNG (mulberry32) ---------- */
PQ.RNG = function (seed) {

};

PQ.Noise = function (seed) {

/* PIXEL QUEST — particles, floating text, transient lights and telegraphed hazards */
'use strict';
(function () {
  const U = PQ.U, Art = PQ.Art, T = PQ.T;
  const FX = { parts: [], texts: [], lights: [], hazards: [], budget: 1 };
  PQ.FX = FX;

  FX.clear = function () { FX.parts.length = 0; FX.texts.length = 0; FX.lights.length = 0; FX.hazards.length = 0; };

  /* ---------------- particles ---------------- */
  FX.burst = function (x, y, color, n = 8, o = {}) {
    n = Math.max(1, Math.round(n * FX.budget));
    for (let i = 0; i < n && FX.parts.length < 500; i++) {
      const a = o.ang != null ? o.ang + (Math.random() - 0.5) * (o.spread || 1) : Math.random() * Math.PI * 2;
      const s = (o.speed || 60) * (0.4 + Math.random() * 0.8);
      FX.parts.push({ x, y, z: o.z || 4, vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.6, vz: o.up != null ? o.up * (0.5 + Math.random()) : 40 + Math.random() * 50, life: (o.life || 0.5) * (0.6 + Math.random() * 0.6), max: 0, color: Array.isArray(color) ? U.pick(color) : color, size: o.size || 1, grav: o.grav != null ? o.grav : 160, glow: o.glow });
      FX.parts[FX.parts.length - 1].max = FX.parts[FX.parts.length - 1].life;
    }
  };
  FX.spark = (x, y, c) => FX.burst(x, y, c, 1, { speed: 10, up: 30, life: 0.8, grav: -20 });
  FX.dust = (x, y) => FX.burst(x, y, ['#d8c8a8', '#b8a888'], 3, { speed: 20, up: 15, life: 0.35, grav: 40 });
  FX.update = function (dt) {
    const P = FX.parts;
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i];
      p.life -= dt;
      if (p.life <= 0) { P[i] = P[P.length - 1]; P.pop(); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vz -= p.grav * dt; p.z += p.vz * dt;
      if (p.z < 0) { p.z = 0; p.vz *= -0.3; p.vx *= 0.6; p.vy *= 0.6; }
      p.vx *= 1 - dt * 2; p.vy *= 1 - dt * 2;
    }
    for (let i = FX.texts.length - 1; i >= 0; i--) { const t = FX.texts[i]; t.life -= dt; t.y -= 18 * dt * (t.life / t.max + 0.3); if (t.life <= 0) FX.texts.splice(i, 1); }
    for (let i = FX.lights.length - 1; i >= 0; i--) { const l = FX.lights[i]; l[4] -= dt; if (l[4] <= 0) FX.lights.splice(i, 1); }
    // hazards
    const G = PQ.G;
    for (let i = FX.hazards.length - 1; i >= 0; i--) {
      const h = FX.hazards[i];
      h.t += dt;
      if (h.follow && h.t < h.delay) { h.x = G.player.x; h.y = G.player.y; }
      if (!h.fired && h.t >= h.delay) { h.fired = true; FX.fireHazard(h); }
      if (h.fired && h.persist && h.t < h.delay + h.persist) {
        h.tick = (h.tick || 0) + dt;
        if (h.tick > 0.5) { h.tick = 0; if (FX.inHazard(h, G.player.x, G.player.y)) G.hurtPlayer(h.dmg * 0.4, h.status, h.x, h.y, true); }
        if (Math.random() < 0.3) FX.burst(h.x + (Math.random() - 0.5) * h.r * 1.6, h.y + (Math.random() - 0.5) * h.r, h.color, 1, { speed: 8, up: 30, life: 0.6, grav: -10 });
      }
      if (h.t > h.delay + (h.persist || 0.25)) FX.hazards.splice(i, 1);
    }
  };
  FX.draw = function (g, ox, oy) {
    for (const p of FX.parts) {
      const a = Math.min(1, p.life / p.max * 1.5);
      g.globalAlpha = a; g.fillStyle = p.color;
      g.fillRect(Math.round(p.x - ox), Math.round(p.y - oy - p.z), p.size, p.size);
    }
    g.globalAlpha = 1;
  };
  FX.drawHazards = function (g, ox, oy) {
    for (const h of FX.hazards) {
      const pre = h.t < h.delay;
      const k = pre ? h.t / h.delay : 1;
      const a = pre ? 0.18 + 0.25 * k : Math.max(0, 0.6 - (h.t - h.delay) * 2.4);
      g.save();
      g.translate(Math.round(h.x - ox), Math.round(h.y - oy));
      g.fillStyle = h.persist && !pre ? h.color : '#ff3a3a';
      g.strokeStyle = pre ? '#ffd0d0' : h.color;
      g.globalAlpha = h.persist && !pre ? 0.35 : a;
      g.lineWidth = 1;
      if (h.kind === 'circle' || h.kind === 'ring') {
        g.beginPath(); g.ellipse(0, 0, h.r, h.r * 0.7, 0, 0, Math.PI * 2); g.fill();
        g.globalAlpha = Math.min(1, a + 0.3); g.beginPath(); g.ellipse(0, 0, h.r * (pre ? k : 1), h.r * 0.7 * (pre ? k : 1), 0, 0, Math.PI * 2); g.stroke();
      } else if (h.kind === 'line') {
        g.rotate(h.ang); g.fillRect(0, -h.w / 2, h.len * (pre ? 1 : 1), h.w);
        g.globalAlpha = Math.min(1, a + 0.3); g.strokeRect(0, -h.w / 2, h.len * k, h.w);
      } else if (h.kind === 'cone') {
        g.rotate(h.ang); g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, h.r, -h.arc / 2, h.arc / 2); g.closePath(); g.fill();
        g.globalAlpha = Math.min(1, a + 0.3); g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, h.r * k, -h.arc / 2, h.arc / 2); g.closePath(); g.stroke();
      }
      g.restore();
    }
  };
  FX.drawText = function (g) {
    const ox = PQ.Render.ox, oy = PQ.Render.oy;
    for (const t of FX.texts) {
      const a = Math.min(1, t.life / t.max * 2.5);
      g.globalAlpha = a;
      PQ.Font.draw(g, t.s, t.x - ox, t.y - oy, t.color, t.big ? 2 : 1, 'center', '#120d18');
    }
    g.globalAlpha = 1;
  };
  FX.text = function (x, y, s, color = '#fff', big = false, life = 0.9) {
    if (FX.texts.length > 40) FX.texts.shift();
    FX.texts.push({ x: x + (Math.random() - 0.5) * 6, y, s: String(s), color, big, life, max: life });
  };
  FX.light = (x, y, r, a = 1, life = 0.2) => FX.lights.push([x, y, r, a, life]);

  /* ---------------- telegraphed hazards ---------------- */
  // {kind:'circle'|'line'|'cone', x,y, r, ang, len, w, arc, delay, dmg, status, persist, color, owner, fx}
  FX.hazard = function (o) {
    const h = Object.assign({ t: 0, delay: 0.8, dmg: 10, color: '#ff6a3a', r: 24 }, o);
    FX.hazards.push(h);
    return h;
  };
  FX.inHazard = function (h, x, y) {
    if (h.kind === 'circle' || h.kind === 'ring') { const dx = x - h.x, dy = (y - h.y) / 0.7; return dx * dx + dy * dy <= h.r * h.r; }
    const dx = x - h.x, dy = y - h.y;
    if (h.kind === 'line') { const c = Math.cos(-h.ang), s = Math.sin(-h.ang); const lx = dx * c - dy * s, ly = dx * s + dy * c; return lx >= 0 && lx <= h.len && Math.abs(ly) <= h.w / 2 + 3; }
    if (h.kind === 'cone') { const d = Math.hypot(dx, dy); if (d > h.r) return false; return Math.abs(U.angDiff(h.ang, Math.atan2(dy, dx))) <= h.arc / 2; }
    return false;
  };
  FX.fireHazard = function (h) {
    const G = PQ.G;
    if (h.onFire) h.onFire(h);
    const col = h.color;
    if (h.kind === 'circle' || h.kind === 'ring') FX.burst(h.x, h.y, [col, '#ffffff', PQ.U.shade(col, 0.3)], 14, { speed: h.r * 3, up: 60, life: 0.5 });
    else if (h.kind === 'line') { for (let i = 0; i < h.len; i += 10) FX.burst(h.x + Math.cos(h.ang) * i, h.y + Math.sin(h.ang) * i, col, 2, { speed: 30, up: 50, life: 0.4 }); }
    else FX.burst(h.x + Math.cos(h.ang) * h.r * 0.5, h.y + Math.sin(h.ang) * h.r * 0.5, col, 16, { speed: h.r * 2, ang: h.ang, spread: h.arc, life: 0.5 });
    if (h.shake) PQ.Render.shake = Math.max(PQ.Render.shake, h.shake);
    if (h.sfx) PQ.Audio.play(h.sfx);
    if (h.friendly) { for (const e of G.ents) if (e.isEnemy && !e.dead && FX.inHazard(h, e.x, e.y)) G.damageEnemy(e, h.dmg, { el: h.el, kb: 60, fx: h.x, fy: h.y, freeze: h.freeze }); return; }
    const p = G.player;
    if (FX.inHazard(h, p.x, p.y)) G.hurtPlayer(h.dmg, h.status, h.x, h.y);
  };
})();

/* PIXEL QUEST — maps, chunk rendering, collision and procedural world generation */
'use strict';
(function () {
  const T = PQ.T, TL = PQ.TILE, Art = PQ.Art, U = PQ.U;
  const TI = () => Art.TINFO;
  const CH = 16; // chunk size in tiles
  const REGIONS = ['greenfields', 'darkwood', 'sunscorch', 'frostfall', 'volcanic', 'shadow'];
  PQ.REGIONS = REGIONS;
  const W = {};
  PQ.World = W;

  /* =========================================================
     Map
     ========================================================= */
  class GMap {
    constructor(id, w, h, o = {}) {
      this.id = id; this.w = w; this.h = h;
      this.tiles = new Uint8Array(w * h); this.vari = new Uint8Array(w * h); this.reg = new Uint8Array(w * h);
      this.objAt = new Array(w * h).fill(null); this.objs = [];
      this.spots = {}; this.theme = o.theme || null; this.dark = !!o.dark; this.kind = o.kind || 'overworld';
      this.name = o.name || id; this.chunks = new Map(); this.mobs = []; this.safe = []; this.farm = []; this.music = o.music || null;
      this.outside = o.outside || 0; // tile id used out of bounds
    }
    idx(x, y) { return y * this.w + x; }
    inb(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
    t(x, y) { return this.inb(x, y) ? this.tiles[y * this.w + x] : this.outside; }
    set(x, y, t) { if (!this.inb(x, y)) return; this.tiles[y * this.w + x] = t; this.invalidate(x, y); }
    region(x, y) { return this.inb(x, y) ? REGIONS[this.reg[y * this.w + x]] : REGIONS[0]; }
    invalidate(x, y) {
      const cx = Math.floor(x / CH), cy = Math.floor(y / CH);
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy;
        this.chunks.delete(Math.floor(nx / CH) + ',' + Math.floor(ny / CH));
      }

  /* flood fill from start; carve gaps toward unreached pockets */
  W.ensureConnected = function (m, start, passExtra) {
    const walkable = (x, y) => { const w = m.walk(x, y); return w === 1 || w === 2 || (passExtra && passExtra(x, y)); };
    const reach = new Uint8Array(m.w * m.h);
    const flood = () => {
      reach.fill(0);
      const st = [m.idx(start.x, start.y)]; reach[st[0]] = 1;
      while (st.length) { const i = st.pop(); const x = i % m.w, y = (i / m.w) | 0; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const X = x + dx, Y = y + dy; if (!m.inb(X, Y)) continue; const j = m.idx(X, Y); if (!reach[j] && walkable(X, Y)) { reach[j] = 1; st.push(j); } } }
    };
    flood();
    let fixes = 0;
    for (let y = 2; y < m.h - 2 && fixes < 80; y += 3) for (let x = 2; x < m.w - 2 && fixes < 80; x += 3) {
      if (reach[m.idx(x, y)] || !walkable(x, y)) continue;
      // measure pocket size quickly
      let size = 0; const seen = new Set([m.idx(x, y)]); const st = [m.idx(x, y)];
      while (st.length && size < 12) { const i = st.pop(); size++; const cx = i % m.w, cy = (i / m.w) | 0; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const X = cx + dx, Y = cy + dy; const j = m.idx(X, Y); if (m.inb(X, Y) && !seen.has(j) && walkable(X, Y)) { seen.add(j); st.push(j); } } }
      if (size < 12) continue;
      const cost = (X, Y) => { if (reach[m.idx(X, Y)]) return 1; const t = m.t(X, Y); if (t === TL.LAVA || t === TL.VOID || t === TL.WALL) return 999; if (t === TL.DEEP) return 40; if (t === TL.CLIFF) return 30; const o = m.obj(X, Y); return o && o.solid ? (o.k === 'tree' || o.k === 'bush' || o.k === 'rock' ? 4 : 999) : 1; };
      // walk toward nearest reached tile via A* to start (stops early when entering reach)
      const p = W.astar(m, x, y, start.x, start.y, cost, 40000);
      if (!p) continue;
      for (const [X, Y] of p) {
        if (reach[m.idx(X, Y)]) break;
        const o = m.obj(X, Y);
        if (o && (o.k === 'tree' || o.k === 'bush' || o.k === 'rock')) m.removeObj(o);
        if (m.t(X, Y) === TL.CLIFF) m.set(X, Y, TL.VINE);
        if (m.t(X, Y) === TL.DEEP) m.set(X, Y, TL.BRIDGE);
      }
      fixes++;
      flood();
    }
    return fixes;
  };

    for (let x = 3; x < w - 3; x++) for (let y = 4; y < 7; y++) m.tiles[m.idx(x, y)] = TL.CARPET;
    const door = Math.floor(w / 2);

  /* ---------------- AI behaviours ---------------- */
  function startWindup(e, dur, next) { e.state = 'windup'; e.st = 0; e.wdur = dur; e.next = next; PQ.Audio.play('windup', 0.4); }

  };
  UI.drawMap = function (cv, m, fog, save, player) {
    cv = cv || $('mapc'); if (!cv) return;
    const g0 = G();
    m = m || g0.map; fog = fog || g0.fogs[m.id]; save = save || g0.save; player = player || g0.player;
    const wrap = cv.parentElement;
    const scale = 3;
    cv.width = m.w * scale; cv.height = m.h * scale;
    const fit = Math.min((wrap.clientWidth - 8) / cv.width, ((wrap.clientHeight || 300) - 8) / cv.height);
    cv.style.width = Math.floor(cv.width * fit) + 'px'; cv.style.height = Math.floor(cv.height * fit) + 'px';
    const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
    g.drawImage(PQ.Render.mapImage(m), 0, 0, cv.width, cv.height);
    if (fog) g.drawImage(PQ.Render.fogImage(m, fog), 0, 0, cv.width, cv.height);
    const mark = (x, y, c, r = 3) => { g.fillStyle = '#120d18'; g.fillRect(x * scale - r - 1, y * scale - r - 1, r * 2 + 2, r * 2 + 2); g.fillStyle = c; g.fillRect(x * scale - r, y * scale - r, r * 2, r * 2); };
    const seen = (x, y) => !fog || fog.has(y * m.w + x);
    for (const o of m.objs) {
      if (o.k === 'waypoint' && (save.waypoints[o.wid] || seen(o.x, o.y))) mark(o.x, o.y, save.waypoints[o.wid] ? '#7ef0ff' : '#5a6a7a');
      if (o.k === 'entrance' && seen(o.x, o.y)) mark(o.x + 1, o.y, '#ff6a4a');
      if ((o.k === 'house' || o.k === 'stall') && seen(o.x, o.y)) mark(o.x + 1, o.y, '#c87a5a', 2);
    }
    const q = PQ.Quests && g0 && g0.save === save ? PQ.Quests.tracked() : null;
    if (q && q.mark && m.spots[q.mark]) mark(m.spots[q.mark].x, m.spots[q.mark].y, '#ffd75a', 4);
    if (player) { const px = player.x / PQ.T, py = player.y / PQ.T; mark(px, py, '#ffffff', 3); g.fillStyle = '#e8363c'; g.fillRect(px * scale - 1, py * scale - 1, 2, 2); }
  };

        list += `<div class="sr">${icon(iid)}<div class="sn"><b>${esc(d.name)}</b><small>${esc(d.desc || '')}${d.lvl > 1 ? ' (Lv ' + d.lvl + ')' : ''}</small></div><b class="price">${price}g</b>${btn('Buy', 'buy', `data-k="${iid}" data-p="${price}" data-n="1"`, s.gold >= price && !locked ? 'gold' : '')}${d.stack > 1 ? btn('x5', 'buy', `data-k="${iid}" data-p="${price}" data-n="5"`) : ''}</div>`;
      }

      s.inv.forEach((it, i) => {

    // storage
    toStore: (d) => { const s = G().save, it = s.inv[+d.i]; if (!it) return; if (D.ITEMS[it.id].type === 'quest') { UI.toast('Keep quest items with you.'); return; } if (moveTo(s.storage, it)) s.inv[+d.i] = null; else UI.toast('The chest is full.'); UI.storage(); },
    fromStore: (d) => { const s = G().save, it = s.storage[+d.i]; if (!it) return; if (moveTo(s.inv, it)) s.storage[+d.i] = null; else UI.toast('Your bag is full.'); UI.storage(); },
    storeMats: () => { const s = G().save; s.inv.forEach((it, i) => { if (it && D.ITEMS[it.id].type === 'material' && moveTo(s.storage, it)) s.inv[i] = null; }); UI.storage(); },
    plant: (d) => { const cb = UI._seedCb; UI._seedCb = null; UI.open = null; $('panel').className = 'panel-wrap'; $('panel').innerHTML = ''; if (cb) cb(d.k); },
    imp: () => { const ta = $('impCode'); try { const o = PQ.Save.importCode(ta.value, +$('impSlot').value); PQ.Save.write(o); UI.toast('Save imported into slot ' + o.slot + '.'); UI.slots('load'); } catch (e) { UI.toast(e.message, 'warn'); } },
  };
  function moveTo(arr, it) {
    const d = D.ITEMS[it.id];
    if (!Inv.isEquip(d)) {
      for (const s of arr) if (s && s.id === it.id && s.n < d.stack) { const k = Math.min(it.n, d.stack - s.n); s.n += k; it.n -= k; if (!it.n) return true; }
    }
    const i = arr.findIndex((x) => !x);
    if (i < 0) return false;
    arr[i] = it; return true;
  }
  UI.ACT = ACT;
})();

/* ===== main.js ===== */
/* PIXEL QUEST — boot, settings, main loop and top-level flow */
'use strict';
(function () {
  const DEF = { music: 0.55, sfx: 0.8, mute: false, particles: 1, zoom: 1, touchScale: 1, lefty: false, vibrate: true, shake: true, fps: false };
  PQ.Settings = Object.assign({}, DEF);
  PQ.saveSettings = () => PQ.Store.set('pixelquest.settings', JSON.stringify(PQ.Settings));
  const M = (PQ.Main = { state: 'boot', fps: 60, acc: 0, last: 0, frames: 0, fpsT: 0 });

  function shell() {
    document.getElementById('app').innerHTML = `
      <canvas id="game"></canvas>
      <div id="touch">
        <div id="stick" hidden><div id="knob"></div></div>
        <div class="tcluster">
          <button class="tbt big" data-b="attack"><span>Attack</span></button>
          <button class="tbt" data-b="dodge"><span>Roll</span></button>
          <button class="tbt" id="bInteract" data-b="interact"><span>Use</span></button>
          <button class="tbt cdb" id="bAbility" data-b="ability"><span>Skill</span></button>
        </div>
        <div class="thot">${[0, 1, 2, 3].map((i) => `<button class="hb" id="th${i}" data-b="q${i}"></button>`).join('')}</div>
        <div class="tmenu"><button class="tm" data-b="bag">Bag</button><button class="tm" data-b="map">Map</button><button class="tm" data-b="menu">Menu</button></div>
      </div>
      <div id="feed"></div>
      <div id="toasts"></div>
      <div id="banner"></div>
      <div id="saveind"></div>
      <div id="ui" hidden></div>
      <div id="dlg" hidden></div>
      <div id="panel" class="panel-wrap"></div>
      <div id="fade"></div>
      <div id="loading" hidden><p>Generating world...</p></div>
      <div id="rotate">Turn your device sideways for the best view</div>`;
  }

  M.boot = function () {
    shell();
    PQ.Store.init();
    try { Object.assign(PQ.Settings, JSON.parse(PQ.Store.get('pixelquest.settings') || '{}')); } catch (e) { /* defaults */ }
    PQ.FX.budget = PQ.Settings.particles;
    PQ.Font.installDOM();
    const cv = document.getElementById('game');
    PQ.Render.init(cv);
    PQ.Input.init(cv);
    PQ.UI.init();
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { PQ.Audio.suspend(true); if (M.state === 'game') PQ.G.autosave(); }
      else { PQ.Audio.suspend(false); M.last = performance.now(); }
    });
    window.addEventListener('pagehide', () => { if (M.state === 'game') PQ.G.autosave(); });
    M.toTitle(true);
    M.last = performance.now();
    requestAnimationFrame(M.frame);
    window.__PQ_READY = true;
  };

  M.toTitle = function (first) {
    if (!first && M.state === 'game') PQ.G.autosave();
    M.state = 'title';
    PQ.G.running = false;
    PQ.UI.open = null; document.getElementById('panel').className = 'panel-wrap';
    document.getElementById('dlg').hidden = true; PQ.UI.dlgOpen = false;
    document.body.classList.remove('ingame');
    const latest = PQ.Save.latest();
    const meta = PQ.Save.meta();
    PQ.Title.look = latest ? meta[latest].look : PQ.UI.randLook();
    PQ.UI.titleMenu();
    PQ.Audio.music('title');
  };

  function startGame(fn) {
    const ld = document.getElementById('loading');
    ld.hidden = false;
    document.getElementById('ui').hidden = true;
    setTimeout(() => {
      try { fn(); } catch (e) { console.error(e); PQ.UI.toast('Could not start: ' + e.message, 'warn'); ld.hidden = true; M.toTitle(); return; }
      ld.hidden = true;
      M.state = 'game';
      document.body.classList.add('ingame');
      M.acc = 0;
    }, 40);
  }
  M.newGame = function (slot, name, look) { startGame(() => { PQ.G.newGame(slot, name, look); PQ.G.autosave(); }); };
  M.loadSlot = function (slot) {
    const s = PQ.Save.read(slot);
    if (!s) { PQ.UI.toast('That save slot is empty.'); return; }
    if (s.corrupt) { PQ.UI.corruptNote = 'Save slot ' + slot + ' could not be read. A backup copy was kept; please start a new game or import a save code.'; PQ.UI.close(); PQ.UI.titleMenu(); return; }
    PQ.UI.open = null; document.getElementById('panel').className = 'panel-wrap';
    startGame(() => PQ.G.load(s, false));
  };

  /* previews from the title screen */
  M.preview = function (kind) {
    const k = PQ.Save.latest();
    const s = k ? PQ.Save.read(+k) : null;
    const UI = PQ.UI, D = PQ.D, esc = PQ.U.esc;
    if (!s || s.corrupt) {
      if (kind === 'char') { UI.creator(false, 1); UI.cr.onCancel = () => UI.titleMenu(); return; }
      if (kind === 'coll') { UI.show('preview', `<h2>Creature Collection</h2><p class="hint">0/${Object.keys(D.CREATURES).length} discovered. Start an adventure to fill your journal.</p><div class="journal">${Object.values(D.CREATURES).map((d) => `<div class="jc un"><canvas class="crt sil" data-sp="${d.id}" width="18" height="17"></canvas><b>???</b><small>${esc(D.CREATURE_RARITY[d.rar].name)}</small></div>`).join('')}</div><div class="row"><button class="pb" data-a="close">Back</button></div>`, 'wide tall'); UI.drawCritters(); return; }
      UI.show('preview', '<h2>World Map</h2><p>No adventure yet. The map reveals itself as you explore: start a new game to begin charting the realm.</p><div class="row"><button class="pb gold" data-a="tNew">New Game</button><button class="pb" data-a="close">Back</button></div>');
      return;
    }
    if (kind === 'char') {
      const st = PQ.Stats.compute(s);
      const eq = Object.entries(s.eq).filter(([, v]) => v).map(([k2, v]) => `<li><span style="color:${D.RARITY[v.r || 0].color}">${esc(D.ITEMS[v.id].name)}</span> <small>${k2}</small></li>`).join('');
      UI.show('preview', `<h2>${esc(s.name)}</h2><div class="creator"><div class="crprev"><canvas id="pvC" width="54" height="66"></canvas></div><div><p>Level ${s.lvl} &middot; ${PQ.U.fmt(s.gold)} gold &middot; ${PQ.U.fmtTime(s.played)} played</p><p class="hint">HP ${st.maxHp} &middot; Mana ${st.maxMp} &middot; Attack ${st.weapon.dmg.toFixed(1)} &middot; Defense ${Math.round(st.def)} &middot; Crit ${Math.round(st.crit)}%</p><ul class="objs">${eq || '<li>No equipment</li>'}</ul><p class="hint">Bosses defeated: ${Object.keys(s.bosses).length}/6 &middot; Quests done: ${Object.values(s.quests).filter((q) => q.st === 'done').length}</p></div></div><div class="row"><button class="pb gold" data-a="tContinue">Continue</button><button class="pb" data-a="close">Back</button></div>`, 'wide');
      const g = document.getElementById('pvC').getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(PQ.Spr.humanoid(PQ.Spr.look(s.look)).down_idle_0, 0, 0, 54, 66);
      return;
    }
    if (kind === 'coll') {
      const c = s.creatures;
      UI.show('preview', `<h2>Creature Collection</h2><p class="hint">${esc(s.name)}: ${Object.keys(c.seen).length}/${Object.keys(D.CREATURES).length} discovered, ${c.owned.length} companions.</p><div class="journal">${Object.values(D.CREATURES).map((d) => { const seen = c.seen[d.id]; return `<div class="jc ${seen ? '' : 'un'}"><canvas class="crt ${seen ? '' : 'sil'}" data-sp="${d.id}" width="18" height="17"></canvas><b style="color:${seen ? D.CREATURE_RARITY[d.rar].color : '#777'}">${seen ? esc(d.name) : '???'}</b><small>${esc(D.CREATURE_RARITY[d.rar].name)}</small></div>`; }).join('')}</div><div class="row"><button class="pb" data-a="close">Back</button></div>`, 'wide tall');
      UI.drawCritters();
      return;
    }
    if (kind === 'map') {
      UI.show('preview', `<h2>World Map - ${esc(s.name)}</h2><div class="mapwrap"><canvas id="mapc"></canvas></div><div class="row"><button class="pb" data-a="close">Back</button></div>`, 'wide tall');
      setTimeout(() => {
        const m = PQ.World.genOverworld(s.seed);
        const fog = new PQ.Fog(m.w, m.h, s.fog.world);
        const pos = s.pos && s.pos.map === 'world' ? { x: s.pos.x, y: s.pos.y } : null;
        const prevG = PQ.G.save; PQ.G.save = s;
        try { UI.drawMap(document.getElementById('mapc'), m, fog, s, pos); } finally { PQ.G.save = prevG; }
      }, 30);
    }
  };

  /* ---------------- main loop ---------------- */
  M.frame = function (now) {
    requestAnimationFrame(M.frame);
    let dt = (now - M.last) / 1000;
    M.last = now;
    if (!(dt > 0)) dt = 1 / 60;
    dt = Math.min(dt, 0.1); // clamp after inactivity
    M.frames++; M.fpsT += dt;
    if (M.fpsT >= 1) { M.fps = M.frames; M.frames = 0; M.fpsT = 0; }
    try {
      if (M.state === 'title') { PQ.Title.draw(dt); return; }
      if (M.state !== 'game') return;
      const G = PQ.G;
      const blocked = PQ.UI.blocking();
      if (!blocked) {
        const inp = PQ.Input.sample();
        const step = 1 / 60;
        M.acc += dt;
        let first = true, n = 0;
        while (M.acc >= step && n < 6) {
          G.update(step, first ? inp : Object.assign({}, inp, { press: {} }));
          first = false; M.acc -= step; n++;
        }
        if (n === 6) M.acc = 0;
      } else PQ.Input.sample();
      PQ.Render.draw(G, blocked ? 0 : dt);
      PQ.HUD.draw(PQ.Render.g, G, dt);
      PQ.Render.present();
    } catch (err) {
      console.error(err);
      if (!M.reported) { M.reported = 1; PQ.UI.toast('Error: ' + err.message, 'warn'); }
    }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', M.boot); else M.boot();
})();

</script>
